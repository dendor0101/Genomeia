buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.9.3"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion"
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - project(':android')) {
  apply plugin: 'java-library'
  apply plugin: 'kotlin'
  apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
  java.sourceCompatibility = 21
  java.targetCompatibility = 21

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
  compileKotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
  compileTestKotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)

  // Физика на Rust (RUST_PORT.md): -PrustShadow гоняет любой стенд, проверку или тест с тенью —
  // каждый PhysicsWorld повторяет себя в мире на Rust и сверяется с ним побитово после каждого
  // тика (RustShadow.kt). -PrustShadowEvery=N — сверка раз в N тиков (отпечаток 100k частиц дорог).
  // Физика на Rust в игре (RustEngine.kt): -PrustEngine — мир физики шагает на Rust у любого запуска, проверки и теста
  // (на ПК — для проверок; игре Rust нужен на Android). Биты те же, что у Kotlin.
  if (rootProject.hasProperty('rustEngine')) {
    def lib = rootProject.file('physics-native/target/release/' + System.mapLibraryName('genomeia_physics_jni'))
    [JavaExec, Test].each { type ->
      tasks.withType(type).configureEach {
        dependsOn ':physics:cargoBuild'
        systemProperty 'genomeia.physics.native', lib.absolutePath
        systemProperty 'genomeia.physics.engine', 'rust'
      }
    }
  }
  if (rootProject.hasProperty('rustShadow')) {
    def lib = rootProject.file('physics-native/target/release/' + System.mapLibraryName('genomeia_physics_jni'))
    [JavaExec, Test].each { type ->
      tasks.withType(type).configureEach {
        dependsOn ':physics:cargoBuild'
        systemProperty 'genomeia.physics.native', lib.absolutePath
        systemProperty 'genomeia.physics.rust', 'shadow'
        // Тень замедляет тик в разы: сквозным проверкам игры — больше времени на сценарий.
        systemProperty 'bugReplayCheck.timeoutSec', '3600'
        if (rootProject.hasProperty('rustShadowEvery')) {
          systemProperty 'genomeia.physics.rust.every', rootProject.property('rustShadowEvery')
        }
      }
    }
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Genomeia'
  repositories {
    mavenCentral()
    // Lua уровней — Cobalt (MIT, форк LuaJ из CC: Tweaked). Публикуется только здесь;
    // из этого репозитория берём только его группу.
    maven {
      url = 'https://maven.squiddev.cc'
      content { includeGroup 'cc.tweaked' }
    }
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://teavm.org/maven/repository/' }
  }
}

eclipse.project.name = 'Genomeia' + '-parent'
