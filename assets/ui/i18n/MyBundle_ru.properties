cell.leaf.description = Копит энергию от солнца, пока не наполнится. Основа питания организма.
cell.fat.description = Хранилище: держит до 10 единиц энергии, вдвое больше обычной клетки. Мягкая.
cell.bone.description = Твёрдая клетка с очень жёсткими связями: каркас тела. Энергии держит мало.
cell.tail.description = Плывёт: по сигналу от 0 до 1 толкает организм в сторону, противоположную своей стрелке. Разгоняется и тормозит плавно.
cell.controller.description = Датчик клавиши игрока. Пока выбранная клавиша зажата, сырой сигнал 1, иначе 0; дальше он идёт через формулу клетки.
cell.muscle.description = Сжимается и растягивается по сигналу от -1 до 1: связи с соседями укорачиваются или удлиняются до половины длины.
cell.sucker.description = Притягивает еду рядом и поглощает её при касании, получая энергию. Сквозь неё проходят другие частицы.
cell.excreta.description = Направленная. Пока есть сигнал больше 0 и хватает энергии, выпускает еду по своей стрелке своего цвета.
cell.punisher.description = Убивает клетки чужих организмов при касании, кроме Bone и других Punisher. На каждое убийство тратит полный запас энергии.
cell.pumper.description = При касании высасывает энергию из чужой клетки, пока не наполнится.
cell.zygote.description = Первая клетка организма, из неё растёт всё тело. Сама понемногу копит энергию от солнца.
cell.producer.description = Размножение: при полной энергии и сигнале 1 время от времени выпускает зиготу, из которой растёт новый организм по тому же геному.
cell.neuron.description = Собирает входящие сигналы, считает выход по формуле (y = ax + b, sin, cos, sigmoid и другие) и передаёт его дальше.
cell.suction_cup.description = Присоска: по сигналу от 0 до 1 цепляется за поверхность, чем сильнее сигнал, тем крепче.
cell.sticky.description = Липкая: по сигналу от 0 до 1 притягивает и держит клетки, которых касается.
cell.chameleon.description = Меняет цвет по сигналу: 0 - чёрный, 1 - цвет из выбранных каналов R, G, B (один R - красный, все три - белый).
cell.eye.description = Направленный датчик: смотрит по своей стрелке и выдаёт яркость первого, что увидел, в выбранных каналах цвета.
cell.touch_trigger.description = Датчик касания: чем сильнее его вдавили, тем больше сигнал.
cell.synapse.description = Обучаемая связь: передаёт сигнал в Neuron с весом и меняет вес, когда вход и нейрон срабатывают вместе. Нужна ровно одна входящая и одна исходящая связь в Neuron.
cell.pheromone_emitter.description = Выпускает феромон выбранного типа, когда сигнал становится больше 0.
cell.pheromone_sensor.description = Чувствует феромон выбранного типа рядом с собой: чем ближе и свежее, тем больше сигнал (до 1).

# --- Стенд формул ---
guide.tab.formulas = Формулы
guide.cell.formulasLink = Формулы нейрона
guide.formulas.text = Здесь можно покрутить один нейрон. Каждый тик он собирает входные сигналы в одно число x (складывает или перемножает), считает по своей формуле выход y и отдаёт его дальше по связям. Двигай ползунки: график и числа меняются сразу.
guide.formulas.inputs = Входные сигналы
guide.formulas.input = Вход {0}
guide.formulas.addInput = Добавить вход
guide.formulas.removeInput = Убрать вход
guide.formulas.neuron = Нейрон
guide.formulas.curve = Жёлтая линия - выход y при любом входе x от -10 до 10. Отметка - текущий вход и выход.
guide.formulas.overTime = Эта формула зависит не только от x, но и от времени или памяти нейрона, поэтому график показывает последние 5 секунд: голубая линия - вход x, жёлтая - выход y.
guide.formulas.all = Все формулы
formula.linear.description = Прямая: y = a * x + b. a - наклон (во сколько раз усилить сигнал, минус переворачивает его), b - сдвиг. С a = 1 и b = 0 нейрон просто передаёт сигнал дальше.
formula.sin.description = Синусоида: y = c * sin(a * x + b). c - размах колебаний (при c = 0 выход всегда 0), a - частота, b - сдвиг. Вместе с часами (y = t) даёт ритм.
formula.cos.description = Косинусоида: то же, что синус, но сдвинутая на четверть периода. y = c * cos(a * x + b). При x = 0 выход равен c.
formula.sigmoid.description = Плавная ступенька от 0 до 1: y = 1 / (1 + e^-(a * x + b)) + c. a - крутизна, b - где ступенька, c - сдвиг вверх или вниз. Удобна, чтобы превратить любой сигнал в «да / нет» без резкого скачка.
formula.step_le.description = Ступенька: если x <= a, выход b, иначе c. Порог включения.
formula.step_lt.description = Ступенька: если x < a, выход b, иначе c. Отличается от предыдущей только точно на пороге x = a.
formula.time.description = Часы: выход - время мира в секундах, вход не важен. В игре к нему прибавляется номер клетки, поэтому у разных нейронов-часов разная фаза. Подключи к синусу или косинусу - получишь ритм.
formula.impulse.description = Импульс: когда вход x становится 1 и больше, нейрон выдаёт 1 в течение a секунд, потом 0. Пока импульс идёт, новые входы его не продлевают.
formula.in_range.description = Окно: если x между a и b (не включая края), выход равен x, иначе c. Пропускает только сигналы нужной силы.
formula.pow.description = Степень: y = x в степени a. Отрицательный x с дробной степенью не определён - тогда выход 0.
formula.remember.description = Память: положительный вход x запоминается и выдаётся на выход. Пока на входе 0, нейрон помнит последнее число. Отрицательный вход стирает память, выход становится 0.
formula.random.description = Случайное число от a до b, которое зависит от входа: один и тот же x всегда даёт один и тот же y, а соседние x - совсем разные. Подай на вход часы - получишь шум.
formula.energy.description = Сытость клетки: энергия, делённая на максимум, от 0 до 1. Вход не важен. На стенде у нейрона половина запаса.
formula.controller.description = Клавиша игрока с номером a: пока она зажата, выход 1, иначе выход повторяет вход x. Устарела - для управления есть клетка Controller.
formula.decay.description = Пик с затуханием: сильный вход (больше b и больше текущего) запоминается, а потом каждый тик выход уменьшается на a, пока не дойдёт до b. Выход всегда между b и c. Короткий всплеск превращается в долгий хвост.
formula.spike.description = Детектор рывка: выход 1 только в тот тик, когда вход вырос сразу на a или больше, иначе 0. Ровный сигнал не даёт ничего.
formula.abs.description = Модуль: y = |x|. Отрицательный сигнал становится положительным.
formula.links_amount.description = Сколько у клетки физических связей с соседями. Вход не важен. По нему клетка понимает, на краю тела она или внутри. На стенде у нейрона 4 связи.
bug.title.crashPrevious=Игра упала в прошлый раз
bug.text.crashPrevious=Это НЕ новый краш. Игра упала при прошлом запуске; отчёт сохранён и показан сейчас, когда игра снова работает. Опишите, что вы делали перед этим, и отправьте его - это очень поможет мне исправить ошибку.
bug.banner.crash=!! ИГРА УПАЛА !!
bug.banner.report=Ваше сообщение (вы нажали кнопку с жуком, краша не было)
bug.showCrash=Показать текст краша
bug.hideCrash=Скрыть текст краша
bug.crashMissing=Текста краша в отчёте нет.
