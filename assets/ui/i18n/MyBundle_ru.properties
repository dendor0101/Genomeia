guide.lab.leaf=Меняйте освещение и следите за энергией Leaf. Кнопка разрядки позволяет повторить накопление.
guide.lab.fat=Leaf отдаёт энергию связанной Fat. Разрядите Fat и посмотрите, как запас растёт снова.
guide.lab.bone=Потяните за край верхнего тела из Bone, затем нижнего из Fat. Сравните, как они деформируются.
guide.lab.tail=Подайте сигнал на Tail: он потянет за собой Leaf. Ползунок направления поворачивает Tail.
guide.lab.controller=Выберите W, A, S или D и зажмите эту клавишу либо кнопку ниже. Сигнал Controller по нейронной связи включает Tail.
guide.lab.muscle=Сигнал -1 сокращает Muscle, +1 растягивает. Потяните за край тела и сравните его ширину при разных сигналах.
guide.lab.sucker=Добавьте еду и подведите к ней Sucker. Можно перетащить и саму еду.
guide.lab.excreta=Подайте положительный сигнал на Excreta, чтобы появилась еда. При нуле выделение прекращается.
guide.lab.punisher=Подведите Punisher к Fat. Для убийства нужен полный запас энергии; Leaf помогает его восстановить. Bone защищена.
guide.lab.pumper=Прижмите правую Fat к Pumper: её энергия перейдёт к связанной Fat слева. Когда запас уйдёт ниже нуля, донор погибнет. Тогда можно добавить нового.
guide.lab.zygote=Zygote вырастает в две Leaf. Уберите освещение в начале, чтобы задержать рост.
guide.lab.producer=Сигнал +1 включает Producer, 0 останавливает новые рождения. Leaf питает его; потомки вырастают в две Leaf.
guide.lab.neuron=Меняйте вход, формулу и коэффициенты Neuron. Выход показан под сценой; графики есть во вкладке «Формулы». С формулой lif уменьшите a до 0.1: нейрон начнёт копить вход и выпускать спайки.
guide.lab.suction_cup=Потяните SuctionCup при сигнале 0, затем при +1. Чем выше сигнал, тем труднее её сдвинуть.
guide.lab.sticky=Прижмите Sticky к Fat и подайте +1. Попробуйте разъединить их, затем повторите при сигнале 0.
guide.lab.chameleon=Сигнал задаёт яркость Chameleon. Выберите R, G или B; сочетание R и G даёт жёлтый.
guide.lab.eye=Поворачивайте Eye и наводите луч на цветные клетки. Выход показывает среднюю яркость выбранных RGB-каналов первой цели.
guide.lab.touch_trigger=Прижмите Fat к TouchTrigger. Чем сильнее клетки перекрываются, тем выше сигнал.
guide.lab.synapse=Neuron слева раз в 120 тиков посылает спайк через Synapse в Neuron справа (lif, порог 0.6). Учитель заставляет правый нейрон сработать через заданное число тиков после входа: положительная задержка усиливает Synapse, отрицательная ослабляет. Когда вес станет больше 0.6, выключите учителя: правый нейрон будет срабатывать от входа сам - синапс научился.
guide.lab.pheromone_emitter=Подайте сигнал на PheromoneEmitter и приблизьте PheromoneSensor. Для реакции их каналы должны совпадать.
guide.lab.pheromone_sensor=Передвигайте PheromoneSensor относительно PheromoneEmitter. Меняйте канал сенсора: чужой феромон он не видит.
guide.lab.drain=Разрядить изучаемую клетку
guide.lab.add.sucker=Добавить еду
guide.lab.add.punisher=Добавить цель
guide.lab.add.pumper=Добавить Fat
guide.lab.metric.donorEnergy=Энергия Fat справа
guide.lab.metric.storedEnergy=Энергия связанной Fat
guide.lab.donorDead=Fat справа погибла. Можно добавить новую.

# First-launch feedback hint
bug.hint.title=Помогите сделать Genomeia лучше
bug.hint.body=Заметили баг, что-то не нравится или есть идея? Напишите разработчику, нажав на эту кнопку.
bug.hint.close=Понятно
cell.delay.description = Линия задержки: выдаёт свой вход, пришедший заданное число тиков назад. Заменяет цепочку нейронов, которые нужны только чтобы замедлить сигнал, например в детекторе движения: задержать сигнал одного сенсора и перемножить с другим.
delay.ticks = Задержка, тиков
delay.ticks.hint = Сколько тиков сигнал ждёт внутри клетки (0 - проходит как через нейрон)
delay.binary = Только 0 и 1
delay.binary.hint = Хранит бит на тик вместо числа: памяти в 32 раза меньше. Вход от 0.5 считается 1, выход ровно 0 или 1
guide.lab.delay=Neuron слева посылает волну в Delay, Neuron справа получает её позже на заданное число тиков. Включите «Только 0 и 1» на синусе, чтобы увидеть, как сигнал становится 0 или 1.
guide.lab.control.wave=Волна источника
guide.lab.control.ticks=Задержка, тиков
guide.lab.control.binary=Только 0 и 1
guide.lab.wave.pulse=Импульсы
guide.lab.wave.sine=Синус
guide.lab.metric.input=Входной сигнал
