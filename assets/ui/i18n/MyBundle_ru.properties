cell.delay.description = Линия задержки: выдаёт свой вход, пришедший заданное число тиков назад. Заменяет цепочку нейронов, которые нужны только чтобы замедлить сигнал, например в детекторе движения: задержать сигнал одного сенсора и перемножить с другим.
