# Гайды
guide.win=Уровень пройден!
guide.loose=Вы проиграли. Попробовать ещё раз?
guide.luck=Удачи!
guide.time=На сборку организма у вас пять минут.
guide.needcell=В организме должна быть клетка, которой посвящён этот уровень.

guide.leaf1=Лист (Leaf) вырабатывает энергию для остального организма и ничего не требует взамен.
guide.leaf2=Ваша цель - собрать организм из 10 листьев.

guide.tail1=Хвост (Tail) - клетка, которая позволяет организму двигаться.
guide.tail2=Сила хвоста задаётся его выходом y.
guide.tail3=Чтобы хвост работал постоянно, поставьте параметр b равным 1.
guide.tail4=Скорость настраивается в пределах от 0 до 1.
guide.tail5=На этом уровне нужно добраться до правой стороны карты.

guide.eye1=Глаз (Eye) - клетка, которая реагирует на определённые цвета.
guide.eye2=Глаз испускает прямой луч, и если что-то попадает в этот луч, глаз узнаёт его цвет.
guide.eye3=В глазе можно настроить угол, дальность луча и цвета, на которые он реагирует.
guide.eye4=Глаз выдаёт импульс, равный среднему арифметическому цветов объекта.
guide.eye5=С помощью глаз можно создавать организмы, которые обходят стены и другие организмы!
guide.eye6=Чтобы пройти этот уровень, нужно пройти небольшой лабиринт.
guide.eye7=Не забывайте, что глаза и хвосты можно соединить нейросвязью напрямую.

guide.muscle1=Мышца (Muscle) - клетка, которая умеет менять размер и тем самым меняет форму организма.
guide.muscle2=Размер мышцы зависит от нейросигнала, который на неё приходит.
guide.muscle3=Когда входной сигнал больше 0, мышца увеличивается; когда меньше 0 - уменьшается.
guide.muscle4=Сигнал ограничен отрезком [-1; 1], поэтому длина мышцы меняется от половины до полутора её обычной длины.
guide.muscle5=Чтобы пройти этот уровень, соберите из мышц и листьев организм, который сможет пролезть через узкую щель.
guide.muscle6=Не забывайте, что сигнал можно задать напрямую, изменив параметр b в клетке.

guide.neuron1=Нейрон (Neuron) - клетка, которая передаёт сигналы между другими клетками организма.
guide.neuron2=Своего действия у него нет: он получает сигналы по нейросвязям и передаёт результат дальше.
guide.neuron3=Результат считается по формуле активации, по умолчанию y = ax + b: a масштабирует вход, b добавляет постоянный сигнал.
guide.neuron4=Задайте b, и нейрон будет выдавать это значение, даже если к его входу ничего не подключено.
guide.neuron5=На компьютере зажмите Ctrl и щёлкните сначала по одной клетке, потом по другой, чтобы соединить их нейросвязью.
guide.neuron6=Нейроны можно соединять в цепочки, а их входы - складывать или умножать: нейрон с формулой time, подключённый к нейрону с формулой sin, даёт сигнал, который периодически меняется.
guide.neuron7=Нейрон тратит энергию каждый тик, поэтому делайте цепочку короткой.
guide.neuron8=На этом уровне разрешены только листья, мышцы, нейроны и хвосты.
guide.neuron9=Чтобы пройти этот уровень, соберите узкое тело с хвостом, управляйте хвостом через нейрон и проплывите через щель в нижнюю часть канала.

guide.suctioncup1=Присоска (Suction cup) - клетка, которая меняет, насколько сильно организм сопротивляется движению в воде.
guide.suctioncup2=Сила хватки задаётся нейросигналом: 0 - хватки нет, 1 - самая сильная хватка, значения больше 1 считаются как 1.
guide.suctioncup3=Сама по себе хватка организм не двигает: отпустите присоску, подтяните тело мышцами, снова схватитесь - и организм поползёт.
guide.suctioncup4=Чтобы хватка чередовалась, сигнал должен меняться со временем: соедините нейрон с формулой time с нейроном с формулой sin.
guide.suctioncup5=Подключите этот сигнал к присоскам и к мышцам. Поставьте мышце a = -1, чтобы она сжималась, пока присоски держат.
guide.suctioncup6=На этом уровне разрешены только листья, мышцы, нейроны и присоски. Хвосты запрещены.
guide.suctioncup7=Доберитесь до конца коридора организмом из этих клеток.

guide.smooth1=Выберите в нейроне формулу sin или cos: обе превращают значение в плавную волну от -1 до 1.
guide.smooth2=Параметры у них одинаковые: a задаёт частоту, b сдвигает волну по оси входа, c задаёт амплитуду.
guide.smooth3=sin начинается с 0, а cos - с 1, поэтому cos берут, когда сигнал должен быть высоким уже в нулевой момент.
guide.smooth4=Обычный приём - подать время на вход нейрона с sin: тогда его выход бесконечно поднимается и опускается без всяких датчиков.
guide.smooth5=На этом уровне разрешены только листья, мышцы, нейроны и хвосты.
guide.smooth6=Соберите тело с хвостом или мышцами, которыми управляет волна, и пройдите извилистый коридор до конца.

guide.thresholds1=Выберите в нейроне пороговую формулу: она превращает плавный вход в резкое решение.
guide.thresholds2=Формула sigmoid сжимает вход в 0..1: y = 1/(1+exp(-(ax+b))) + c. a задаёт крутизну, b сдвигает точку подъёма кривой, c сдвигает результат.
guide.thresholds3=Две ступенчатые формулы возвращают b, пока вход по одну сторону от a, и c - по другую: y = b при x <= a (строгая: x < a), иначе y = c.
guide.thresholds4=Формула window пропускает вход, только пока он лежит строго между a и b; вне этого окна она возвращает c.
guide.thresholds5=Порог скрывает мелкий шум и реагирует только на сильный сигнал, поэтому организм может плыть дальше и остановиться у стены.
guide.thresholds6=На этом уровне разрешены только листья, мышцы, нейроны и хвосты.
guide.thresholds7=Соберите организм, движение которого переключается по порогу, пройдите обе двери и доберитесь до дальнего конца.

guide.timepulse1=Выберите в нейроне формулу time, impulse или spike: их сигнал зависит от часов, а не от входа.
guide.timepulse2=time возвращает время симуляции в секундах плюс номер клетки в её организме, поэтому два нейрона time никогда не начинают ровно в один момент.
guide.timepulse3=impulse(a) возвращает 1 в течение a секунд после того, как вход достиг 1, а потом снова 0. a - длина импульса.
guide.timepulse4=spike(a) возвращает 1 на один тик, когда вход скачком вырастает хотя бы на a, и 0 в остальное время. a - величина скачка.
guide.timepulse5=time задаёт ритм, impulse держит действие какое-то время, а spike реагирует на одиночное событие, например касание.
guide.timepulse6=На этом уровне разрешены только листья, мышцы, нейроны и хвосты. Пройдите трое ворот и доберитесь до конца.

guide.memory1=Выберите в нейроне формулу remember или decay: они дают ему память о прошлых тиках.
guide.memory2=remember хранит последний положительный вход и продолжает его возвращать: положительный вход обновляет память, отрицательный сбрасывает её в 0.
guide.memory3=decay держит пик и даёт ему спадать: сильный вход поднимает память, потом она каждый тик уменьшается на a и остаётся между b и c.
guide.memory4=Память позволяет сигналу пережить касание, которое его вызвало, - это удобно для мышцы, которая должна тянуть и после того, как глаз отвёл взгляд.
guide.memory5=На этом уровне разрешены только листья, мышцы, нейроны и хвосты. Пройдите коридор и обе камеры до конца.

guide.power1=Выберите в нейроне формулу степени или модуля: они меняют форму сигнала, ничего не запоминая.
guide.power2=Формула степени возводит вход в степень a: y = x^a. При a = 2 слабый сигнал остаётся слабым, а сильный побеждает; при a = 0.5 наоборот.
guide.power3=У отрицательного входа с дробным показателем нет вещественной степени, поэтому нейрон возвращает 0. Формула модуля этого избегает: y = |x|.
guide.power4=Модуль отбрасывает знак, поэтому сигнал, который качается в обе стороны, превращается в толчок в одну сторону.
guide.power5=На этом уровне разрешены только листья, мышцы, нейроны и хвосты. Протиснитесь через узкую середину воронки и доберитесь до конца.

guide.random1=Выберите в нейроне формулу random: она превращает вход в повторяемое случайное значение от a до b.
guide.random2=Это хэш входа, а не бросок монеты: один и тот же вход всегда даёт один и тот же выход, а плавно меняющийся вход выглядит как шум.
guide.random3=Так весь мир остаётся детерминированным, и записанная игра повторяется бит в бит.
guide.random4=На этом уровне разрешены только листья, мышцы, нейроны и хвосты. Пробирайтесь между разбросанными стенами и доберитесь до конца.

guide.fat1=Жир (Fat) - мягкая клетка-хранилище: вмещает до 10 энергии, вдвое больше листа.
guide.fat2=Сам он ничего не делает: у него нет сигнала, он не двигается и не вырабатывает энергию.
guide.fat3=Энергия перетекает по физическим связям от клетки, заполненной сильнее относительно своей ёмкости, к менее заполненной, поэтому жир забирает излишек у клеток, которые вырабатывают или поглощают энергию, и отдаёт его, когда телу нужно.
guide.fat4=Его связи мягче обычных, поэтому жир работает и как подушка между твёрдыми частями.
guide.fat5=Попробуйте: дайте всасывателю наполнить жир, потом добавьте мышцу и посмотрите, как жир её кормит.
guide.fat6=На этом уровне соберите тело с запасом жира и доберитесь до правой стороны коридора.

guide.bone1=Кость (Bone) - скелет тела: она жёсткая, а её связи очень жёсткие.
guide.bone2=Её собственная жёсткость вдвое больше обычной, а связи в 16 раз жёстче обычных, поэтому кость держит форму тела под нагрузкой.
guide.bone3=Она вмещает всего 3 энергии и сама ничего не делает: у неё нет сигнала, она не двигается и не вырабатывает энергию.
guide.bone4=Кости - каркас для челюстей, плавников и длинных тел; без них мышцы скручивали бы тело в комок.
guide.bone5=Попробуйте: соберите из костей челюсть из двух клеток, протяните поперёк неё мышцу и посмотрите, как челюсть открывается и закрывается.
guide.bone6=На этом уровне пройдите через узкую щель в стене и доберитесь до правой стороны.

guide.zygote1=Зигота (Zygote) - зародыш организма: каждый геном начинается с одной зиготы.
guide.zygote2=Сама она ничего не делает; первая стадия генома делит и мутирует её в тело.
guide.zygote3=Она получает от солнца 0.06 энергии за тик, до 10, и ничего не тратит на действия, поэтому может дождаться первого деления.
guide.zygote4=Продюсер, срабатывая, откладывает новую зиготу, и эта зигота начинает отдельный организм.
guide.zygote5=Попробуйте: начните геном с одной зиготы и посмотрите, как она растёт до первого деления.
guide.zygote6=На этом уровне вырастите из одной зиготы организм из 8 клеток.

guide.touchtrigger1=Датчик касания (Touch trigger) - датчик столкновений: он прибавляет к своему сигналу каждый раз, когда в него что-то упирается.
guide.touchtrigger2=Прибавка равна перекрытию, делённому на радиус клетки, поэтому лёгкое касание даёт слабый сигнал, а глубокое вдавливание - сильный.
guide.touchtrigger3=При сложении входов (так по умолчанию) вход обнуляется каждый тик, поэтому постоянное касание даёт постоянный сигнал; формула клетки превращает его в выход.
guide.touchtrigger4=С формулой по умолчанию y = ax + b при a = 1, b = 0 выход равен самому давлению.
guide.touchtrigger5=Попробуйте: поставьте датчик касания на нос, подключите его к хвосту и заставьте организм отплывать от стены.
guide.touchtrigger6=На этом уровне пройдите извилистый коридор и доберитесь до правой стороны.

guide.controller1=Контроллер (Controller) - датчик клавиши: он превращает нажатие клавиши в нейросигнал.
guide.controller2=Клавишу выберите в окне клетки: цифры от 0 до 9, W A S D, стрелки или пробел.
guide.controller3=Формула получает 1, пока клавиша зажата, и 0, когда она отпущена; формула по умолчанию y = ax + b при a = 1, b = 0 даёт ровно это.
guide.controller4=Возьмите формулу spike, чтобы получать один короткий импульс на нажатие, а не сигнал, который держится, пока клавиша зажата.
guide.controller5=Попробуйте: подключите контроллер на W к хвосту и управляйте организмом вручную.
guide.controller6=На этом уровне ведите организм клавишами и доберитесь до правой стороны.

guide.chameleon1=Хамелеон (Chameleon) - клетка цвета: она красит себя в цвет, упакованный в её сигнал.
guide.chameleon2=Сигнал - это упакованное число: красный - младшие 8 бит, зелёный - следующие 8, синий - ещё 8, каждый от 0 до 255.
guide.chameleon3=Формулы red, green и blue превращают канал от 0 до 1 в эти части; сложите их по дороге в хамелеон.
guide.chameleon4=Оставьте у самого хамелеона формулу y = x (a = 1, b = 0, c = 0), чтобы он пропускал упакованное число без изменений.
guide.chameleon5=На этом уровне нужно заставить организм плыть в другую сторону; организм движется в сторону, противоположную красному цвету.

guide.synapse1=Синапс (Synapse) - обучаемая связь: он стоит между входной клеткой и нейроном и сам меняет свой вес.
guide.synapse2=Ему нужна ровно одна связь на вход и одна на выход, и выходная связь должна заканчиваться на нейроне; при любом другом подключении синапс краснеет и молчит.
guide.synapse3=Его выход - вес, умноженный на вход; начальный вес - случайное значение меньше 0.2.
guide.synapse4=Если вход сработал раньше нейрона, вес растёт на скорость обучения; если нейрон сработал первым, вес падает на величину депрессии.
guide.synapse5=Затухание задаёт, как быстро забывается старая пара спайков; когда вес доходит до 0, синапс отмирает.
guide.synapse6=Попробуйте: поставьте синапс между датчиком касания и нейроном, который управляет мышцей, и дайте организму научиться реагировать на касание.
guide.synapse7=На этом уровне обучите синапс и пройдите коридор до правой стороны.

guide.producer1=Продюсер (Producer) откладывает новый организм: срабатывая, он создаёт перед собой зиготу.
guide.producer2=Он срабатывает, только когда его энергия полна, а сигнал не меньше 1.
guide.producer3=После срабатывания он тратит всю энергию и ждёт, прежде чем отложить снова; ожидание растёт с числом действий клеток в геноме.
guide.producer4=Потомок - отдельный организм с тем же геномом, поэтому продюсер может расселить вид по миру.
guide.producer5=Попробуйте: наполните продюсер энергией от листьев, подайте импульс на его сигнал и посмотрите, как перед ним появится маленькая зигота.
guide.producer6=На этом уровне вырастите колонию из 12 клеток.

guide.sticky1=Липучка (Sticky) - временный клей: она притягивает всё, чего касается.
guide.sticky2=Сила притяжения задаётся нейросигналом от 0 до 1; без сигнала липучка ничего не делает.
guide.sticky3=Она действует на стены, еду и другие организмы, но не на клетки, связанные с её собственным телом, потому что связанные клетки никогда не сталкиваются.
guide.sticky4=Клей ещё и гасит относительную скорость, поэтому прилипшая клетка не отскакивает.
guide.sticky5=Попробуйте: прилепите клетку к стене, подтяните тело мышцей, потом отпустите клей - и организм поползёт.
guide.sticky6=На этом уровне с помощью клея пройдите зигзаг и доберитесь до правой стороны.

guide.sucker1=Всасыватель (Sucker) - фильтратор: он собирает частицы еды, которые его касаются.
guide.sucker2=Частица внутри его рта удаляется и превращается в энергию; частица чуть снаружи притягивается ко рту.
guide.sucker3=Он не отталкивает другие клетки, поэтому его можно встроить в тело или прижать к облаку еды.
guide.sucker4=У него нет нейроуправления, и он работает всё время.
guide.sucker5=Попробуйте: поставьте всасыватель в облако еды и посмотрите, как растёт его энергия.
guide.sucker6=На этом уровне соберите еду и вырастите организм из 6 клеток.

guide.excreta1=Выделитель (Excreta) роняет еду: он превращает свою энергию в маленький шарик в ту сторону, куда смотрит.
guide.excreta2=Ему нужно не меньше 4 энергии и положительный нейросигнал; каждый шарик стоит 4 энергии.
guide.excreta3=Шарик принимает цвет клетки, поэтому разные выделители могут помечать разные виды еды.
guide.excreta4=С его помощью можно кормить другие организмы, приманивать всасыватель или оставлять след из еды.
guide.excreta5=Попробуйте: наполните лист энергией, подключите нейрон time к выделителю и посмотрите, как появится цепочка шариков.
guide.excreta6=На этом уровне соберите организм из 8 клеток и не дайте ему голодать.

guide.pumper1=Насос (Pumper) при касании перекачивает в себя энергию из другой клетки.
guide.pumper2=Каждое касание переносит 0.03 энергии из другой клетки, пока у насоса есть место, а у другой клетки - хотя бы столько энергии.
guide.pumper3=У него нет нейроуправления и формулы: он качает всякий раз, когда сталкивается.
guide.pumper4=Связанные с ним клетки своего тела никогда с ним не сталкиваются, поэтому он высасывает только клетки других организмов или несвязанных частей.
guide.pumper5=Попробуйте: прижмите насос к чужой клетке и посмотрите, как энергия перетекает в ваше тело.
guide.pumper6=На этом уровне соберите организм из 8 клеток.

guide.punisher1=Каратель (Punisher) - клетка-оружие: он уничтожает чужие клетки, которые его касаются.
guide.punisher2=Клетка другого организма удаляется сразу; клетки своего организма и другие каратели в безопасности.
guide.punisher3=У него нет нейроуправления, и он не тратит энергию, поэтому срабатывает, как только коснётся врага.
guide.punisher4=Один каратель может проесть тело врага клетка за клеткой, но не достанет клетку, которой ни разу не коснётся.
guide.punisher5=Попробуйте: протараньте карателем другой организм и посмотрите, как исчезают его клетки.
guide.punisher6=На этом уровне соберите организм из 8 клеток с карателем.

guide.pheromones1=Обычно организмы не могут общаться друг с другом - именно поэтому и появились феромоны.
guide.pheromones2=Феромоны - вещества, которые позволяют организмам передавать сигналы на расстояние.
guide.pheromones3=Они распространяются медленно, пока не достигнут своего наибольшего радиуса.
guide.pheromones4=Клетка PheromoneEmitter умеет их выделять, а клетка PheromoneSensor - улавливать.
guide.pheromones5=Сейчас доступно около 32 феромонов, но у некоторых из них особое назначение.
guide.pheromones6=Феромон 0 выделяет еда. Феромон 11 отвечает за рост стволовых клеток. Феромон 18 выделяют повреждённые клетки.
guide.pheromones7=На этом уровне есть организм без глаз, который чувствует феромон 1 и плывёт к нему.
guide.pheromones8=Создайте организм, который выделяет феромон 1, и подождите, пока тот организм сам приплывёт к вам.
