tutorial.welcome.title = Редактор генома
tutorial.welcome.text = Организм растёт из одной клетки, зиготы. Геном - это список стадий роста. На каждой стадии любая клетка может поделиться (рядом появится новая клетка) или мутировать (сменить тип, цвет или настройки).\n\nЗадания шага видны внизу этой панели. Когда все выполнены, становится доступна кнопка «Далее».\n\nНа ПК: наведи мышь на любую кнопку, и всплывёт подсказка. На телефоне: зажми кнопку пальцем. Подсказки выключаются в настройках.

tutorial.camera.title = Камера
tutorial.camera.text = ПК: зажми левую кнопку мыши на пустом месте и тяни, чтобы двигать камеру. Колесо мыши приближает и отдаляет.\nТелефон: тяни пальцем по пустому месту, а приближай двумя пальцами (щипком).

tutorial.timeline.title = Стадии роста
tutorial.timeline.text = Внизу экрана - шкала времени. Каждое деление шкалы - стадия роста. Кнопки «<» и «>» переходят на стадию назад и вперёд, «<<» и «>>» - в начало и в конец. Ползунок тоже двигает время. На ПК пробел переносит в конец.\n\nНа первой стадии зигота уже делится: из неё растёт лист. Полупрозрачная клетка - та, что появится на следующей стадии. Перейди на следующую стадию кнопкой «>».

tutorial.first_divide.title = Первое деление
tutorial.first_divide.text = Нажми на клетку (ПК: левая кнопка мыши, телефон: касание). Откроется окно «Разделить или мутировать» - выбери «Разделить».\n\nВ окне клетки вверху список типов: выбери, какой будет новая клетка, и нажми «Разделить». Новая клетка появится рядом, полупрозрачной: она вырастет на следующей стадии.

tutorial.divide_leaf.title = Подели 5 листьев
tutorial.divide_leaf.text = Leaf (лист) копит энергию от солнца - это основа питания организма.\n\nНа одной стадии клетка делится только один раз. Чтобы делиться дальше, переходи на следующую стадию кнопкой «>»: там клеток уже больше, и каждая снова может поделиться.

tutorial.repeat.title = Повтор действия
tutorial.repeat.text = Чтобы не открывать окно каждый раз, последнее действие можно повторить.\nПК: нажми на клетку правой кнопкой мыши.\nТелефон: включи вверху кнопку «Последнее действие» и касайся клеток; потом выключи её.\n\nПовторяется то, что ты сделал последним: деление с теми же настройками, мутация, изменение или удаление.

tutorial.move.title = Перемещение клетки
tutorial.move.text = Только что добавленную клетку (полупрозрачную, на её стадии) можно передвинуть: зажми её и тяни. Отпусти - клетка встанет на новое место, а связи с соседями пересчитаются.\n\nКнопка «Симметрия» вверху задаёт, как раскладываются новые и перенесённые клетки: зеркально или по сетке.

tutorial.undo.title = Отмена и повтор
tutorial.undo.text = Ошибся - не страшно. Кнопка «Отменить» внизу (на ПК ещё Ctrl+Z) отменяет последнюю правку генома, «Повторить» (Ctrl+Y) возвращает её.\n\nОтмени что-нибудь и верни обратно.

tutorial.mutate.title = Мутация: 2 Leaf в Fat
tutorial.mutate.text = Мутация меняет клетку, которая уже выросла. Нажми на обычную (не полупрозрачную) клетку Leaf. Если откроется выбор, выбери «Мутировать». В списке типов выбери Fat и нажми «Мутировать».\n\nFat (жир) хранит вдвое больше энергии. В окне мутации слева видно, какая клетка сейчас, справа - какой станет. Правый клик (повтор) тоже сработает.

tutorial.color.title = Цвет клетки
tutorial.color.text = В окне клетки (при делении, мутации или изменении) есть кнопка «Цвет клетки». Выбери цвет и подтверди, потом нажми «Разделить», «Мутировать» или «Изменить».\n\nЦвет видят глаза других организмов (клетка Eye), а хамелеон умеет менять его сам.

tutorial.remove.title = Удаление
tutorial.remove.text = Удалить можно клетку, которая появляется на этой стадии: нажми на полупрозрачную клетку, откроется окно с кнопками «Изменить» и «Удалить». Удаление убирает клетку и всё, что из неё потом выросло.\n\nМутацию отменяют так: нажми на клетку на той стадии, где она мутирует, и нажми «Отменить мутацию».

tutorial.neural_links.title = Нейросвязи
tutorial.neural_links.text = Нейросвязь передаёт сигнал от одной клетки к другой.\nПК: зажми Ctrl, нажми на клетку-источник, затем на клетку-приёмник. Стрелка покажет, куда идёт сигнал. Отпусти Ctrl.\nТелефон: включи вверху кнопку «Нейро-связи», коснись источника, потом приёмника, затем выключи кнопку.\n\nПроведи связи последовательно, цепочкой: от клетки A к B, от B к C, от C к D. Сигнал умеет так ходить: каждый тик он проходит по одной связи дальше, и от A до D дойдёт за 3 тика.

tutorial.link_color.title = Цвет и удаление связи
tutorial.link_color.text = Кнопка «Цвет нейросвязи» вверху задаёт цвет новых связей, чтобы не путаться в проводке. Выбери цвет и проведи связь.\n\nЧтобы удалить связь, проведи её ещё раз между теми же клетками (Ctrl + клик по источнику, затем по приёмнику).

tutorial.signals.title = Как работают сигналы
tutorial.signals.text = Нейронные клетки каждый тик собирают входящие сигналы x: складывают или перемножают (выбор «Сложение / Умножение»). Потом считают y по своей формуле, например y = ax + b, и отдают y дальше по своим связям.\n\nДатчики сами создают сигнал: Controller (клавиша игрока), Eye (что видит), Touch trigger (касание), Pheromone sensor (запах). Исполнители делают что-то по сигналу: Tail плывёт, Muscle сжимается, Chameleon меняет цвет.\n\nДальше соберём Франкенштейна. Форма не важна, важно, что из чего состоит и как соединено.

tutorial.controller.title = Управление: Controller и Tail
tutorial.controller.text = Сделай клетку Controller (делением или мутацией). В её окне выбери клавишу, по умолчанию W. Пока клавиша зажата, Controller выдаёт сигнал 1.\n\nСделай клетку Tail. Это направленная клетка: ползунок «Угол» поворачивает её стрелку. Хвост толкает организм в сторону, противоположную стрелке.\n\nСоедини нейросвязью Controller и Tail: Ctrl + клик по Controller, затем по Tail.

tutorial.clock.title = Часы: нейроны t и cos
tutorial.clock.text = Сделай клетку Neuron и выбери ей формулу «y = t»: она выдаёт время в секундах.\n\nСделай второй Neuron с формулой «y = c * cos(ax + b)». Поставь a = 5 (частота) и c = 1 (размах): при c = 0 выход всегда 0.\n\nСоедини нейросвязью нейрон t с нейроном cos: получится сигнал, который качается от -1 до 1.

tutorial.muscles.title = Мышцы
tutorial.muscles.text = Сделай хотя бы две клетки Muscle. Мышца сжимается или растягивается по сигналу от -1 до 1.\n\nПроведи нейросвязи от нейрона cos к мышцам (можно цепочкой: сигнал идёт через мышцу дальше). Организм начнёт дёргаться в такт.

tutorial.chameleon.title = Мигалка: Chameleon
tutorial.chameleon.text = Сделай клетку Chameleon и выбери ей каналы цвета, например только R. По сигналу 0 она чёрная, по сигналу 1 - выбранного цвета (R+G - жёлтая, все три - белая).\n\nПроведи к ней сигнал от нейрона cos: хамелеон начнёт мигать.

tutorial.frankenstein.title = Франкенштейн
tutorial.frankenstein.text = Проверим всё сразу: если что-то отвалилось, пока ты доделывал остальное, задание это покажет.\n\nСохрани геном: кнопка «Сохранить геном» вверху, введи имя и нажми «Сохранить в файл».

tutorial.finish.title = Готово!
tutorial.finish.text = Ты собрал организм, который управляется клавишей, дёргается и мигает.\n\nКак его испытать: «Сохранить геном» -> «Сохранить и протестировать». В симуляции включи кнопку «Controller Keys» и зажми W.\n\nОписание каждой клетки - в Гайде, во вкладке «Клетки». Нажми «Завершить», чтобы выйти в меню.

