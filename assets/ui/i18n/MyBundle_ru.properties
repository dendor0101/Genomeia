cell.motor_neuron.description = Мотонейрон: отдаёт свой выход каждой Muscle своего кластера без нейросвязей. Кластер - все Muscle, связанные друг с другом и с MotorNeuron физическими связями во взрослом теле. Стрелка задаёт направление волокон: кластер сжимается и растягивается только вдоль стрелки, а поперёк держит размер. Сигнал действует так, будто к каждой Muscle проведена нейросвязь; кластер не делится, даже если тело разорвалось.
guide.lab.motor_neuron=Два тела из Muscle с MotorNeuron в центре, нейросвязей нет. Стрелка слева лежит вдоль тела, справа - поперёк: при одном и том же сигнале левое тело меняет ширину, правое - высоту. Muscle за Leaf справа не в кластере и не слушается.
guide.lab.metric.lengthOutside=Коэффициент длины Muscle за Leaf
guide.lab.metric.widthLeft=Ширина левого тела (доля покоя)
guide.lab.metric.heightLeft=Высота левого тела (доля покоя)
guide.lab.metric.widthRight=Ширина правого тела (доля покоя)
guide.lab.metric.heightRight=Высота правого тела (доля покоя)
button.worldSettings=Настройки мира
worldRules.title=Настройки мира
worldRules.subtitle=Меняются сразу, прямо в идущем мире. Наведите на пункт или зажмите его название, чтобы узнать, что он значит.
worldRules.close=Закрыть
worldRules.tab.environment=Среда
worldRules.tab.environment.hint=Гравитация, вода, трение, свет и еда
worldRules.tab.organisms=Организмы
worldRules.tab.organisms.hint=Мягкость тел и обмен энергией по связям
worldRules.tab.cells=Клетки
worldRules.tab.cells.hint=Запас энергии, цена действия и мягкость каждого типа клетки, а у жгутика, насоса и производителя - их сила
worldRules.resetAll=Сбросить всё
worldRules.resetAll.hint=Вернуть все настройки мира к стандарту, как в новом мире
worldRules.resetOne=Вернуть к стандарту: {0}
worldRules.standard=Стандарт: {0}
worldRules.footer=Настройки сохраняются вместе с миром.
worldRules.gravity=Гравитация
worldRules.gravity.hint=Тянет всё вниз по экрану: организмы, еду, оторванные клетки. 0: мир виден сверху, как обычно. Число: ускорение в клетках за секунду в квадрате.
worldRules.viscosity=Вязкость среды
worldRules.viscosity.hint=Насколько густая среда. Гасит любое движение одинаково во все стороны: больше, и всё быстрее останавливается, а еда не уплывает; 0, и тела скользят почти без торможения.
worldRules.waterDrag=Сопротивление воды
worldRules.waterDrag.hint=Вода сопротивляется краям тела, которые движутся поперёк себя. От неё отталкиваются мышцы, когда организм гребёт: больше, и гребок сильнее, но тормозит быстрее; 0, и мышцам не от чего оттолкнуться.
worldRules.friction=Трение
worldRules.friction.hint=Трение при касании: насколько тела цепляются друг за друга и за стенки, вместо того чтобы скользить. 0: скользят как по льду.
worldRules.light=Свет
worldRules.light.hint=Сколько энергии лист получает от света за тик. 0: темнота, листья ничего не копят.
worldRules.foodEnergy=Энергия еды
worldRules.foodEnergy.hint=Сколько энергии даёт съеденная еда. Столько же стоит выделителю выбросить кусочек еды.
worldRules.softness=Мягкость тел
worldRules.softness.hint=Мягкость ткани у всех организмов: связи между клетками легче тянутся и сжимаются. Больше: тела мнутся и их легче порвать; меньше: тела твёрже.
worldRules.tailForce=Сила жгутика
worldRules.tailForce.hint=Как сильно толкает жгутик. От неё зависит скорость организмов с жгутиками.
worldRules.linkTransfer=Обмен энергией
worldRules.linkTransfer.hint=Как быстро энергия перетекает между соседними клетками по связям. 0: каждая клетка живёт своим запасом.
worldRules.pumpRate=Сила насоса
worldRules.pumpRate.hint=Сколько энергии насос забирает за тик у клетки, которой касается.
worldRules.producerPause=Пауза производителя
worldRules.producerPause.hint=Сколько производитель ждёт между потомками: тиков на каждую клетку генома. Больше: потомки появляются реже.
worldRules.maxEnergy=Запас энергии
worldRules.maxEnergy.hint=Сколько энергии может держать клетка этого типа. Уже живущие клетки получают новый запас сразу.
worldRules.actionCost=Цена действия
worldRules.actionCost.hint=Сколько энергии клетка этого типа тратит за тик на свою работу: сокращение, взгляд, толчок.
worldRules.cellSoftness=Мягкость клетки
worldRules.cellSoftness.hint=Мягкость ткани вокруг клеток этого типа: ×1 обычная, жир по умолчанию ×5. Умножается на общую мягкость тел.
