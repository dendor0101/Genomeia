guide.tutorial.text = Обучение проходит прямо в редакторе генома. Справа будет панель с заданием: что сделать и как. Задание засчитывается само, когда ты его выполнишь, после этого жми «Далее». В конце ты соберёшь своего Франкенштейна: организм, который плывёт по клавише W, дёргает мышцами и мигает.
