# About the game
about.title = Об игре
about.intro.title = Genomeia - жизнь из клеток
about.intro = Биологическая песочница о создании организмов и эволюции. Собирайте тело из клеток в редакторе генома, настраивайте нейронные связи и поведение, выпускайте существ в мир и наблюдайте за их взаимодействием. Экспериментируйте с движением, питанием, феромонами и обучением нейросетей.\nИгра находится в ранней альфе и активно развивается. Исходный код открыт; ваши идеи, организмы и сообщения об ошибках помогают делать Genomeia лучше.
about.community = Новости, сообщество и исходный код
about.link.youtube = YouTube - видео о разработке
about.link.discord = Discord - сообщество
about.link.tiktok = TikTok - короткие видео
about.link.itch = itch.io - скачать игру
about.link.github = GitHub - исходный код
about.link.donate = Поддержать на itch.io
about.roadmap = Планы на 0.2.5
about.roadmap.note = Это направления разработки, а не обещание сроков: состав обновления может меняться.
about.plan.1 = 1. Масштабная доработка редактора: отладка нейросетей, запуск организма на любой стадии, проверка вариантов роста и постановка клетки кликом с автоматическим выбором родителя. Пока форма и рост организма будут задаваться редактором - как альтернатива субгеномам и морфогенезу.
about.plan.2 = 2. Удобный редактор карт и уровней: текст на карте, массовая расстановка частиц и клеток, условия и логика через код или блок-схемы.
about.plan.3 = 3. Поддержка модов.
about.plan.4 = 4. Веб-версия игры.
about.plan.5 = 5. Версии для iOS и macOS.
about.plan.6 = 6. Сервер для наполнения библиотеки геномов.
about.plan.7 = 7. Клетки, издающие звуки и распространяющие звуковую волну через систему феромонов.
about.plan.8 = 8. Клетка без коллизий для создания полостей и хранения веществ, например плазмы или желудочной кислоты.
about.plan.9 = 9. Более реалистичное зрение.
about.donate.note = На itch.io можно выбрать сумму поддержки при скачивании. Для перевода в криптовалюте используйте адрес или QR-код ниже; сеть указана рядом с названием кошелька. Спасибо за поддержку!

