about.title = Tentang game
about.intro.title = Genomeia - kehidupan dari sel
about.intro = Game eksperimen biologi tentang penciptaan organisme dan evolusi. Susun tubuh dari sel dalam editor genom, atur koneksi saraf dan perilaku, lepaskan makhluk ke dunia, lalu amati interaksinya. Bereksperimenlah dengan gerakan, makanan, feromon, dan pembelajaran jaringan saraf.\nGame ini masih dalam tahap alfa awal dan aktif dikembangkan. Kode sumbernya terbuka; ide, organisme, dan laporan bug Anda membantu meningkatkan Genomeia.
about.community = Berita, komunitas, dan kode sumber
about.link.youtube = YouTube - video pengembangan
about.link.discord = Discord - komunitas
about.link.tiktok = TikTok - video pendek
about.link.itch = itch.io - unduh game
about.link.github = GitHub - kode sumber
about.link.donate = Dukung di itch.io
about.roadmap = Rencana untuk 0.2.5
about.roadmap.note = Ini arah pengembangan, bukan janji tanggal; cakupan pembaruan dapat berubah.
about.plan.1 = 1. Penyempurnaan besar editor: debug jaringan saraf, menjalankan organisme pada tahap apa pun, menguji variasi pertumbuhan, dan menempatkan sel dengan klik serta pemilihan induk otomatis. Untuk sementara, bentuk dan pertumbuhan organisme ditentukan editor sebagai alternatif subgenom dan morfogenesis.
about.plan.2 = 2. Editor peta dan level yang nyaman: teks pada peta, penempatan banyak partikel dan sel, serta kondisi dan logika melalui kode atau diagram alur.
about.plan.3 = 3. Dukungan mod.
about.plan.4 = 4. Versi web.
about.plan.5 = 5. Versi iOS dan macOS.
about.plan.6 = 6. Server untuk mengisi pustaka genom.
about.plan.7 = 7. Sel yang menghasilkan suara dan menyebarkan gelombang suara melalui sistem feromon.
about.plan.8 = 8. Sel tanpa tabrakan untuk membuat rongga dan menyimpan zat seperti plasma atau asam lambung.
about.plan.9 = 9. Penglihatan yang lebih realistis.
about.donate.note = Di itch.io Anda dapat memilih jumlah dukungan saat mengunduh. Untuk mata uang kripto, gunakan alamat atau kode QR di bawah; jaringan tercantum di samping nama dompet. Terima kasih atas dukungan Anda!

