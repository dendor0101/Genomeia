cell.leaf.description = Mengumpulkan energi dari matahari sampai penuh. Sumber makanan utama organisme.
cell.fat.description = Penyimpanan: menampung hingga 10 energi, dua kali sel biasa. Lunak.
cell.bone.description = Sel keras dengan tautan sangat kaku: kerangka tubuh. Menyimpan sedikit energi.
cell.tail.description = Berenang: dengan sinyal 0 sampai 1 mendorong organisme berlawanan dengan arah panahnya. Mempercepat dan melambat dengan halus.
cell.controller.description = Sensor tombol pemain. Selama tombol yang dipilih ditahan, sinyal mentahnya 1, jika tidak 0; lalu melewati rumus sel.
cell.muscle.description = Berkontraksi dan meregang dengan sinyal -1 sampai 1: tautannya ke tetangga memendek atau memanjang hingga setengahnya.
cell.sucker.description = Menarik makanan di dekatnya dan menyerapnya saat bersentuhan, mendapat energi. Partikel lain menembusnya.
cell.excreta.description = Berarah. Selama sinyal di atas 0 dan energi cukup, ia mengeluarkan makanan berwarna sama di sepanjang panahnya.
cell.punisher.description = Membunuh sel organisme lain saat bersentuhan, kecuali Bone dan Punisher lain. Setiap pembunuhan menghabiskan seluruh energinya.
cell.pumper.description = Saat bersentuhan, menyedot energi dari sel asing sampai penuh.
cell.zygote.description = Sel pertama organisme, seluruh tubuh tumbuh darinya. Perlahan mengumpulkan energi dari matahari.
cell.producer.description = Reproduksi: dengan energi penuh dan sinyal 1, sesekali mengeluarkan zigot yang tumbuh menjadi organisme baru dengan genom yang sama.
cell.neuron.description = Mengumpulkan sinyal masuk, menghitung keluaran dengan rumus (y = ax + b, sin, cos, sigmoid, dan lainnya) lalu meneruskannya.
cell.suction_cup.description = Mencengkeram permukaan dengan sinyal 0 sampai 1: makin kuat sinyal, makin erat cengkeramannya.
cell.sticky.description = Dengan sinyal 0 sampai 1 menarik dan menahan sel yang disentuhnya.
cell.chameleon.description = Berganti warna sesuai sinyal: 0 hitam, 1 warna dari kanal R, G, B yang dipilih (R saja merah, ketiganya putih).
cell.eye.description = Sensor berarah: melihat sepanjang panahnya dan mengeluarkan kecerahan benda pertama yang dilihat pada kanal warna yang dipilih.
cell.touch_trigger.description = Sensor sentuhan: makin keras ditekan, makin besar sinyalnya.
cell.synapse.description = Tautan yang belajar: meneruskan sinyal ke Neuron dengan bobot dan mengubah bobot saat masukan dan neuron aktif bersamaan. Butuh tepat satu tautan masuk dan satu tautan keluar ke Neuron.
cell.pheromone_emitter.description = Mengeluarkan feromon jenis terpilih saat sinyal naik di atas 0.
cell.pheromone_sensor.description = Mencium feromon jenis terpilih di dekatnya: makin dekat dan segar, makin besar sinyalnya (hingga 1).

# --- Стенд формул ---
guide.tab.formulas = Rumus
guide.cell.formulasLink = Rumus neuron
guide.formulas.text = Di sini kamu bisa mencoba satu neuron. Setiap tick ia mengumpulkan sinyal masuk menjadi satu angka x (menjumlahkan atau mengalikan), menghitung keluaran y dengan rumusnya, lalu meneruskannya lewat tautan. Geser penggeser: grafik dan angka langsung berubah.
guide.formulas.inputs = Sinyal masuk
guide.formulas.input = Masukan {0}
guide.formulas.addInput = Tambah masukan
guide.formulas.removeInput = Kurangi masukan
guide.formulas.neuron = Neuron
guide.formulas.curve = Garis kuning adalah keluaran y untuk setiap masukan x dari -10 sampai 10. Tanda adalah masukan dan keluaran saat ini.
guide.formulas.overTime = Rumus ini tidak hanya bergantung pada x, tetapi juga pada waktu atau memori neuron, jadi grafik menampilkan 5 detik terakhir: garis biru adalah masukan x, garis kuning adalah keluaran y.
guide.formulas.all = Semua rumus
formula.linear.description = Garis lurus: y = a * x + b. a adalah kemiringan (seberapa kuat sinyal diperbesar, tanda minus membaliknya), b adalah pergeseran. Dengan a = 1 dan b = 0 neuron hanya meneruskan sinyal.
formula.sin.description = Gelombang sinus: y = c * sin(a * x + b). c adalah amplitudo (jika c = 0 keluaran selalu 0), a frekuensi, b pergeseran. Bersama jam (y = t) menghasilkan ritme.
formula.cos.description = Gelombang kosinus: sama seperti sinus, bergeser seperempat periode. y = c * cos(a * x + b). Pada x = 0 keluarannya sama dengan c.
formula.sigmoid.description = Tangga halus dari 0 ke 1: y = 1 / (1 + e^-(a * x + b)) + c. a adalah kecuraman, b letak tangga, c menggesernya naik atau turun. Berguna untuk mengubah sinyal apa pun menjadi "ya / tidak" tanpa lonjakan tajam.
formula.step_le.description = Tangga: jika x <= a keluarannya b, selain itu c. Ambang penyalaan.
formula.step_lt.description = Tangga: jika x < a keluarannya b, selain itu c. Bedanya dengan yang sebelumnya hanya tepat di ambang x = a.
formula.time.description = Jam: keluarannya adalah waktu dunia dalam detik, masukan tidak berpengaruh. Di dalam game ditambah nomor sel, jadi setiap neuron jam punya fase berbeda. Sambungkan ke sinus atau kosinus untuk mendapat ritme.
formula.impulse.description = Impuls: saat masukan x mencapai 1 atau lebih, neuron mengeluarkan 1 selama a detik, lalu 0. Selama impuls berjalan, masukan baru tidak memperpanjangnya.
formula.in_range.description = Jendela: jika x di antara a dan b (tanpa ujungnya), keluarannya x, selain itu c. Hanya meloloskan sinyal dengan kekuatan yang pas.
formula.pow.description = Pangkat: y = x pangkat a. x negatif dengan pangkat pecahan tidak terdefinisi, maka keluarannya 0.
formula.remember.description = Memori: masukan x positif diingat dan dikeluarkan. Selama masukan 0, neuron menyimpan angka terakhir. Masukan negatif menghapus memori dan keluaran menjadi 0.
formula.random.description = Angka acak dari a sampai b yang bergantung pada masukan: x yang sama selalu memberi y yang sama, sedangkan x yang berdekatan memberi nilai yang sangat berbeda. Beri masukan jam untuk mendapat derau.
formula.energy.description = Seberapa kenyang sel: energinya dibagi maksimum, dari 0 sampai 1. Masukan tidak berpengaruh. Di stan uji neuron terisi setengah.
formula.controller.description = Tombol pemain nomor a: selama ditahan keluarannya 1, selain itu keluaran mengulang masukan x. Usang: untuk kendali ada sel Controller.
formula.decay.description = Puncak yang meluruh: masukan kuat (di atas b dan di atas nilai saat ini) diingat, lalu setiap tick keluaran turun sebesar a sampai mencapai b. Keluaran selalu di antara b dan c. Lonjakan singkat menjadi ekor panjang.
formula.spike.description = Pendeteksi lonjakan: keluarannya 1 hanya pada tick ketika masukan naik sekaligus sebesar a atau lebih, selain itu 0. Sinyal datar tidak menghasilkan apa-apa.
formula.abs.description = Nilai mutlak: y = |x|. Sinyal negatif menjadi positif.
formula.links_amount.description = Berapa banyak tautan fisik sel dengan tetangganya. Masukan tidak berpengaruh. Dari situ sel tahu apakah ia di tepi tubuh atau di dalam. Di stan uji neuron punya 4 tautan.
