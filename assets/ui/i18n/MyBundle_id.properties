guide.tutorial.text = Tutorial berjalan langsung di editor genom. Di kanan ada panel berisi tugas: apa yang harus dilakukan dan caranya. Tugas selesai sendiri begitu kamu melakukannya, lalu tekan "Lanjut". Di akhir kamu akan merakit Frankenstein sendiri: organisme yang berenang dengan tombol W, menggerakkan ototnya, dan berkedip.
guide.tutorial.steps = Isi tutorial
guide.tutorial.start = Mulai tutorial
guide.cell.energy = Energi hingga {0}
guide.cell.neural = neural
