guide.lab.metric.heightLeft=Tinggi tubuh kiri (bagian dari keadaan diam)
guide.lab.metric.widthRight=Lebar tubuh kanan (bagian dari keadaan diam)
guide.lab.metric.heightRight=Tinggi tubuh kanan (bagian dari keadaan diam)
