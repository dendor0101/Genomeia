guide.lab.leaf=Ubah cahaya dan lihat energi Leaf bertambah. Kosongkan energinya untuk mengulang.
guide.lab.fat=Leaf memberi energi kepada Fat yang terhubung. Kosongkan Fat dan lihat energinya terisi lagi.
guide.lab.bone=Tarik ujung tubuh Bone di atas, lalu tubuh Fat di bawah. Bandingkan perubahan bentuknya.
guide.lab.tail=Beri sinyal pada Tail untuk menarik Leaf. Penggeser arah memutar Tail.
guide.lab.controller=Pilih W, A, S atau D lalu tahan tombol itu atau tombol di bawah. Controller mengirim sinyal saraf ke Tail.
guide.lab.muscle=Sinyal -1 memendekkan Muscle; +1 memanjangkannya. Tarik ujung tubuh dan bandingkan lebarnya.
guide.lab.sucker=Tambahkan makanan lalu dekatkan Sucker. Makanan juga bisa diseret.
guide.lab.excreta=Sinyal positif membuat Excreta menghasilkan makanan. Nol menghentikannya.
guide.lab.punisher=Dekatkan Punisher ke Fat. Membunuh memerlukan energi penuh; Leaf membantu mengisinya. Bone terlindungi.
guide.lab.pumper=Tekan Fat kanan ke Pumper untuk mengisi Fat yang terhubung di kiri. Donor mati saat energinya turun di bawah nol. Setelah itu, kamu bisa menambahkan donor baru.
guide.lab.zygote=Zygote tumbuh menjadi dua Leaf. Matikan cahaya di awal untuk menunda pertumbuhan.
guide.lab.producer=+1 mengaktifkan Producer; 0 menghentikan kelahiran baru. Leaf memberi energi dan keturunannya tumbuh menjadi dua Leaf.
guide.lab.neuron=Ubah masukan, rumus, dan koefisien Neuron. Keluaran ada di bawah adegan; grafik ada di Rumus. Dengan rumus lif atur a ke 0.1: neuron mulai menimbun masukan dan melepaskan spike.
guide.lab.suction_cup=Tarik SuctionCup pada sinyal 0, lalu +1. Sinyal lebih tinggi membuatnya lebih sulit bergerak.
guide.lab.sticky=Tempelkan Sticky ke Fat dan beri +1. Coba pisahkan, lalu ulangi dengan 0.
guide.lab.chameleon=Sinyal mengatur kecerahan Chameleon. Pilih R, G atau B; R dan G menghasilkan kuning.
guide.lab.eye=Putar Eye menuju sel berwarna. Keluarannya adalah rata-rata kecerahan kanal RGB terpilih dari sasaran pertama.
guide.lab.touch_trigger=Tekan Fat ke TouchTrigger. Semakin besar tumpang tindih, semakin tinggi sinyalnya.
guide.lab.synapse=Neuron kiri mengirim spike tiap 120 tick lewat Synapse ke Neuron kanan (lif, ambang 0.6). Guru membuat neuron kanan aktif beberapa tick setelah masukan: jeda positif memperkuat Synapse, jeda negatif melemahkannya. Saat bobot melewati 0.6, matikan guru: neuron kanan akan aktif sendiri dari masukan - sinapsis sudah belajar.
guide.lab.pheromone_emitter=Beri sinyal ke PheromoneEmitter lalu dekatkan PheromoneSensor. Kanal keduanya harus sama.
guide.lab.pheromone_sensor=Pindahkan PheromoneSensor terhadap PheromoneEmitter. Ubah kanal sensor: kanal lain tidak terdeteksi.
