# Гайды
guide.win=Level selesai!
guide.loose=Anda kalah. Coba lagi?
guide.luck=Semoga berhasil!
guide.time=Anda punya lima menit untuk membangun organisme.
guide.needcell=Organisme harus berisi sel yang diajarkan di level ini.

guide.leaf1=Daun (Leaf) menghasilkan energi untuk bagian organisme lainnya dan tidak meminta apa pun sebagai gantinya.
guide.leaf2=Tujuan Anda adalah membuat organisme yang terdiri dari 10 sel daun.

guide.tail1=Ekor (Tail) adalah sel yang memungkinkan organisme bergerak.
guide.tail2=Kekuatan ekor diatur oleh keluaran y.
guide.tail3=Agar ekor bekerja terus-menerus, atur parameter b menjadi 1.
guide.tail4=Kecepatan dapat diatur dalam rentang 0 sampai 1.
guide.tail5=Di level ini, Anda harus mencapai sisi kanan peta.

guide.eye1=Mata (Eye) adalah sel yang bereaksi terhadap warna tertentu.
guide.eye2=Mata memancarkan sinar lurus, dan jika sesuatu masuk ke sinar itu, mata mengenali warnanya.
guide.eye3=Pada mata, Anda bisa mengatur sudut, jarak sinar, dan warna yang membuatnya bereaksi.
guide.eye4=Mata menghasilkan impuls yang sama dengan rata-rata aritmetika warna objek.
guide.eye5=Dengan mata, Anda bisa membuat organisme yang mampu menghindari dinding atau organisme lain!
guide.eye6=Untuk menyelesaikan level ini, Anda harus melewati labirin kecil.
guide.eye7=Jangan lupa bahwa mata dan ekor bisa dihubungkan langsung dengan koneksi saraf.

guide.muscle1=Otot (Muscle) adalah sel yang bisa mengubah ukurannya dan dengan begitu mengubah bentuk organisme.
guide.muscle2=Ukuran otot bergantung pada sinyal saraf yang dikirim kepadanya.
guide.muscle3=Saat sinyal masukan >0, otot membesar; saat <0, otot mengecil.
guide.muscle4=Sinyal dibatasi ke [-1; 1], sehingga panjang otot berkisar dari setengah hingga satu setengah kali panjang normalnya.
guide.muscle5=Untuk menyelesaikan level ini, buat organisme dari otot dan daun yang mampu melewati celah sempit.
guide.muscle6=Jangan lupa bahwa Anda bisa mengatur sinyal secara langsung dengan mengubah parameter b pada sel.

guide.neuron1=Neuron adalah sel yang meneruskan sinyal di antara sel-sel lain dalam organisme.
guide.neuron2=Neuron tidak punya aksi sendiri: ia menerima sinyal melalui koneksi saraf dan meneruskan hasilnya.
guide.neuron3=Hasilnya dihitung dengan rumus aktivasi, secara bawaan y = ax + b: a menskalakan masukan, b menambahkan sinyal tetap.
guide.neuron4=Atur b, dan neuron akan mengirim nilai itu meskipun tidak ada yang terhubung ke masukannya.
guide.neuron5=Di komputer, tahan Ctrl lalu klik satu sel, kemudian sel lainnya, untuk membuat koneksi saraf di antara keduanya.
guide.neuron6=Neuron bisa dirangkai, dan masukannya bisa dijumlahkan atau dikalikan: neuron dengan rumus time yang terhubung ke neuron dengan rumus sin memberi sinyal yang berubah secara berkala.
guide.neuron7=Neuron menghabiskan energi setiap tick, jadi buat rangkaiannya tetap pendek.
guide.neuron8=Di level ini hanya daun, otot, neuron, dan ekor yang diizinkan.
guide.neuron9=Untuk menyelesaikan level ini, buat tubuh ramping dengan ekor, kendalikan ekor lewat neuron, dan berenanglah melewati celah ke bagian bawah kanal.

guide.suctioncup1=Mangkuk isap (Suction cup) adalah sel yang mengubah seberapa kuat organisme menahan gerakan di dalam air.
guide.suctioncup2=Daya cengkeramnya diatur oleh sinyal saraf yang diterimanya: 0 berarti tanpa cengkeraman, 1 cengkeraman terkuat, dan nilai di atas 1 dihitung sebagai 1.
guide.suctioncup3=Cengkeraman saja tidak menggerakkan organisme: lepaskan mangkuk isap, tarik ke depan dengan otot, cengkeram lagi, dan organisme pun merayap.
guide.suctioncup4=Agar cengkeraman bergantian, sinyal harus berubah seiring waktu: rangkai neuron dengan rumus time ke neuron dengan rumus sin.
guide.suctioncup5=Hubungkan sinyal itu ke mangkuk isap dan ke otot. Atur a otot menjadi -1 agar otot berkontraksi saat mangkuk isap mencengkeram.
guide.suctioncup6=Di level ini hanya daun, otot, neuron, dan mangkuk isap yang diizinkan. Ekor dilarang.
guide.suctioncup7=Capai ujung lorong dengan organisme yang dibangun dari sel-sel ini.

guide.smooth1=Pilih rumus sin atau cos pada neuron: keduanya mengubah nilai menjadi gelombang halus antara -1 dan 1.
guide.smooth2=Parameternya sama: a mengatur frekuensi, b menggeser gelombang di sepanjang sumbu masukan, dan c mengatur amplitudo.
guide.smooth3=sin dimulai dari 0 dan cos dimulai dari 1, jadi gunakan cos saat sinyal harus sudah tinggi pada waktu nol.
guide.smooth4=Trik yang biasa dipakai adalah memasukkan waktu ke neuron sin: keluarannya akan naik dan turun terus tanpa sensor apa pun.
guide.smooth5=Di level ini hanya daun, otot, neuron, dan ekor yang diizinkan.
guide.smooth6=Buat tubuh dengan ekor atau otot yang digerakkan oleh gelombang dan ikuti lorong berkelok sampai ujungnya.

guide.thresholds1=Pilih rumus ambang pada neuron: rumus ini mengubah masukan yang halus menjadi keputusan yang tegas.
guide.thresholds2=Rumus sigmoid memampatkan masukan ke 0..1: y = 1/(1+exp(-(ax+b))) + c. a mengatur kecuraman, b menggeser titik naiknya kurva, dan c menggeser hasilnya.
guide.thresholds3=Dua rumus tangga mengembalikan b selama masukan berada di satu sisi a dan c di sisi lainnya: y = b untuk x <= a (ketat: x < a) dan y = c selain itu.
guide.thresholds4=Rumus window meneruskan masukan hanya selama nilainya berada di antara a dan b (tanpa a dan b sendiri); di luar jendela itu rumus mengembalikan c.
guide.thresholds5=Ambang menyembunyikan derau kecil dan hanya bereaksi pada sinyal kuat, sehingga organisme bisa terus berenang lalu berhenti di depan dinding.
guide.thresholds6=Di level ini hanya daun, otot, neuron, dan ekor yang diizinkan.
guide.thresholds7=Buat organisme yang gerakannya berganti berdasarkan ambang, lewati kedua pintu, dan capai ujung terjauh.

guide.timepulse1=Pilih rumus time, impulse, atau spike pada neuron: sinyalnya bergantung pada jam, bukan pada masukan.
guide.timepulse2=time mengembalikan waktu simulasi dalam detik ditambah indeks sel di dalam organismenya, sehingga dua neuron time tidak pernah mulai tepat bersamaan.
guide.timepulse3=impulse(a) mengembalikan 1 selama a detik setelah masukannya mencapai 1, lalu kembali ke 0. a adalah panjang pulsa.
guide.timepulse4=spike(a) mengembalikan 1 selama satu tick saat masukannya melonjak naik setidaknya sebesar a, dan 0 selain itu. a adalah besar lonjakan.
guide.timepulse5=time memberi ritme, impulse menahan aksi selama beberapa saat, dan spike bereaksi terhadap satu kejadian seperti sentuhan.
guide.timepulse6=Di level ini hanya daun, otot, neuron, dan ekor yang diizinkan. Lewati tiga gerbang dan capai ujungnya.

guide.memory1=Pilih remember atau decay pada neuron: keduanya memberi neuron ingatan tentang tick sebelumnya.
guide.memory2=remember menyimpan masukan positif terakhir dan terus mengembalikannya: masukan positif memperbarui ingatan, masukan negatif mengosongkannya menjadi 0.
guide.memory3=decay menahan puncak lalu membiarkannya turun: masukan kuat menaikkan ingatan, lalu ingatan turun sebesar a setiap tick dan tetap di antara b dan c.
guide.memory4=Ingatan membuat sinyal bertahan lebih lama daripada sentuhan yang memicunya, berguna untuk otot yang harus terus menarik setelah mata berpaling.
guide.memory5=Di level ini hanya daun, otot, neuron, dan ekor yang diizinkan. Seberangi lorong dan kedua ruangan sampai ujung.

guide.power1=Pilih rumus pangkat atau nilai mutlak pada neuron: keduanya mengubah bentuk sinyal tanpa mengingat apa pun.
guide.power2=Rumus pangkat memangkatkan masukan dengan a: y = x^a. Dengan a = 2 sinyal lemah tetap lemah dan sinyal kuat menang; dengan a = 0.5 terjadi sebaliknya.
guide.power3=Masukan negatif dengan pangkat pecahan tidak punya hasil real, sehingga neuron mengembalikan 0. Rumus nilai mutlak menghindarinya: y = |x|.
guide.power4=Nilai mutlak membuang tanda, sehingga sinyal yang berayun ke dua arah menjadi dorongan satu arah.
guide.power5=Di level ini hanya daun, otot, neuron, dan ekor yang diizinkan. Selip melewati bagian tengah corong yang sempit dan capai ujungnya.

guide.random1=Pilih rumus random pada neuron: rumus ini mengubah masukan menjadi nilai acak yang dapat diulang antara a dan b.
guide.random2=Ini adalah hash dari masukan, bukan lemparan koin: masukan yang sama selalu memberi keluaran yang sama, dan masukan yang berubah perlahan tampak seperti derau.
guide.random3=Dengan begitu seluruh dunia tetap deterministik, dan permainan yang direkam diputar ulang bit demi bit.
guide.random4=Di level ini hanya daun, otot, neuron, dan ekor yang diizinkan. Meliuklah di antara dinding yang tersebar dan capai ujungnya.

guide.fat1=Lemak (Fat) adalah sel penyimpan yang lunak: menampung hingga 10 energi, dua kali lipat daun.
guide.fat2=Lemak tidak melakukan apa pun sendiri: tidak punya sinyal, tidak bergerak, dan tidak menghasilkan energi.
guide.fat3=Energi mengalir lewat koneksi fisik dari sel yang lebih penuh relatif terhadap kapasitasnya ke sel yang lebih kosong, sehingga lemak mengambil kelebihan dari sel yang menghasilkan atau menyerap energi dan mengembalikannya saat tubuh membutuhkan.
guide.fat4=Koneksinya lebih lunak dari biasanya, sehingga lemak juga berfungsi sebagai bantalan di antara bagian yang keras.
guide.fat5=Coba: biarkan penyerap mengisi sel lemak, lalu tambahkan otot dan lihat lemak memberinya makan.
guide.fat6=Di level ini, buat tubuh dengan cadangan lemak dan capai sisi kanan lorong.

guide.bone1=Tulang (Bone) adalah kerangka tubuh: tulang kaku dan koneksinya sangat kaku.
guide.bone2=Kekakuannya dua kali kekakuan sel biasa dan koneksinya 16 kali lebih kaku daripada koneksi biasa, sehingga tulang menjaga bentuk tubuh saat menahan beban.
guide.bone3=Tulang hanya menampung 3 energi dan tidak melakukan apa pun sendiri: tidak punya sinyal, tidak bergerak, dan tidak menghasilkan energi.
guide.bone4=Tulang adalah rangka untuk rahang, sirip, dan tubuh panjang; tanpanya otot akan menekuk tubuh menjadi bola.
guide.bone5=Coba: buat rahang dua sel dari tulang, pasang otot melintanginya, dan lihat rahang membuka dan menutup.
guide.bone6=Di level ini, lewati celah sempit di dinding dan capai sisi kanan.

guide.zygote1=Zigot (Zygote) adalah benih organisme: setiap genom dimulai dari satu zigot.
guide.zygote2=Zigot tidak bertindak sendiri; tahap pertama genom membelah dan memutasinya menjadi tubuh.
guide.zygote3=Zigot mengambil 0.06 energi per tick dari sinar matahari, hingga 10, dan tidak menghabiskan apa pun untuk aksi, sehingga bisa menunggu pembelahan pertama.
guide.zygote4=Produsen menaruh zigot baru saat aktif, dan zigot itu memulai organisme terpisah.
guide.zygote5=Coba: mulai genom dengan satu zigot dan lihat zigot tumbuh sebelum pembelahan pertama.
guide.zygote6=Di level ini, tumbuhkan organisme berisi 8 sel dari satu zigot.

guide.touchtrigger1=Sensor sentuh (Touch trigger) adalah sensor benturan: ia menambah sinyalnya setiap kali ada sesuatu yang menekannya.
guide.touchtrigger2=Nilai tambahannya adalah tumpang tindih dibagi jari-jari sel, sehingga sentuhan ringan memberi sinyal kecil dan dorongan dalam memberi sinyal besar.
guide.touchtrigger3=Dengan penjumlahan masukan bawaan, masukan dikosongkan setiap tick, sehingga sentuhan yang tetap memberi sinyal yang tetap; rumus sel mengubahnya menjadi keluaran.
guide.touchtrigger4=Dengan rumus bawaan y = ax + b dan a = 1, b = 0, keluarannya adalah tekanan itu sendiri.
guide.touchtrigger5=Coba: pasang sensor sentuh di hidung, hubungkan ke ekor, dan buat organisme mundur dari dinding.
guide.touchtrigger6=Di level ini, ikuti lorong berkelok dan capai sisi kanan.

guide.controller1=Pengendali (Controller) adalah sensor tombol: ia mengubah tekanan tombol menjadi sinyal saraf.
guide.controller2=Pilih tombol di jendela sel: angka 0 sampai 9, W A S D, tombol panah, atau spasi.
guide.controller3=Rumus menerima 1 selama tombol ditekan dan 0 saat dilepas; rumus bawaan y = ax + b dengan a = 1, b = 0 memberi persis itu.
guide.controller4=Gunakan rumus spike untuk mendapatkan satu pulsa pendek per tekanan, bukan sinyal yang bertahan selama tombol ditekan.
guide.controller5=Coba: hubungkan pengendali pada W ke ekor dan kemudikan organisme secara manual.
guide.controller6=Di level ini, kemudikan organisme dengan tombol dan capai sisi kanan.

guide.chameleon1=Bunglon (Chameleon) adalah sel warna: ia mewarnai dirinya dengan warna yang dikemas dalam sinyalnya.
guide.chameleon2=Sinyalnya adalah angka yang dikemas: merah adalah 8 bit terendah, hijau 8 bit berikutnya, dan biru 8 bit berikutnya, masing-masing dari 0 sampai 255.
guide.chameleon3=Rumus red, green, dan blue mengubah kanal 0 sampai 1 menjadi bagian-bagian itu; jumlahkan semuanya sebelum masuk ke bunglon.
guide.chameleon4=Biarkan rumus bunglon sendiri tetap y = x (a = 1, b = 0, c = 0) agar angka yang dikemas diteruskan tanpa berubah.
guide.chameleon5=Di level ini, Anda harus membuat organisme berenang ke arah lain; organisme bergerak ke arah yang berlawanan dengan warna merah.

guide.synapse1=Sinapsis (Synapse) adalah koneksi yang bisa belajar: ia berada di antara sel masukan dan neuron serta mengubah bobotnya sendiri.
guide.synapse2=Sinapsis membutuhkan tepat satu koneksi masuk dan satu koneksi keluar, dan koneksi keluarnya harus berakhir di neuron; sambungan lain membuat sinapsis merah dan diam.
guide.synapse3=Keluarannya adalah bobot dikali masukan, dengan bobot awal berupa nilai acak di bawah 0.2.
guide.synapse4=Jika masukan aktif sebelum neuron, bobot naik sebesar laju belajar; jika neuron aktif lebih dulu, bobot turun sebesar laju depresi.
guide.synapse5=Laju peluruhan menentukan seberapa cepat pasangan spike lama dilupakan; bobot yang mencapai 0 membuat sinapsis mati.
guide.synapse6=Coba: pasang sinapsis di antara sensor sentuh dan neuron yang menggerakkan otot, lalu biarkan organisme belajar bereaksi terhadap sentuhan.
guide.synapse7=Di level ini, latih sinapsis dan seberangi lorong ke sisi kanan.

guide.producer1=Produsen (Producer) menaruh organisme baru: saat aktif, ia membuat zigot di depannya.
guide.producer2=Produsen hanya aktif saat energinya penuh dan sinyalnya minimal 1.
guide.producer3=Setelah aktif, ia menghabiskan seluruh energinya dan menunggu sebelum bisa menaruh lagi; waktu tunggu bertambah seiring jumlah aksi sel dalam genom.
guide.producer4=Keturunannya adalah organisme terpisah dengan genom yang sama, sehingga produsen bisa menyebarkan spesies ke seluruh dunia.
guide.producer5=Coba: isi produsen dengan energi dari daun, beri pulsa pada sinyalnya, dan lihat zigot kecil muncul di depannya.
guide.producer6=Di level ini, tumbuhkan koloni berisi 12 sel.

guide.sticky1=Sel lengket (Sticky) adalah lem sementara: ia menarik apa pun yang disentuhnya.
guide.sticky2=Kekuatan tarikannya diatur oleh sinyal saraf dari 0 sampai 1; tanpa sinyal ia tidak melakukan apa-apa.
guide.sticky3=Sel ini bekerja pada dinding, makanan, dan organisme lain, tetapi tidak pada sel yang terhubung dengan tubuhnya sendiri, karena sel yang terhubung tidak pernah berbenturan.
guide.sticky4=Lem juga meredam kecepatan relatif, sehingga sel yang menempel tidak memantul.
guide.sticky5=Coba: tempelkan sel ke dinding, tarik dengan otot, lalu lepaskan lem untuk merayap.
guide.sticky6=Di level ini, gunakan lem untuk melewati zig-zag dan capai sisi kanan.

guide.sucker1=Penyerap (Sucker) adalah penyaring makanan: ia mengumpulkan partikel makanan yang menyentuhnya.
guide.sucker2=Partikel di dalam mulutnya dihapus dan diubah menjadi energi; partikel yang berada tepat di luar ditarik ke arah mulut.
guide.sucker3=Penyerap tidak mendorong sel lain, sehingga bisa dipadatkan ke dalam tubuh atau ditekan ke awan makanan.
guide.sucker4=Penyerap tidak punya kendali saraf dan bekerja terus-menerus.
guide.sucker5=Coba: tempatkan penyerap di awan makanan dan lihat energinya naik.
guide.sucker6=Di level ini, kumpulkan makanan dan buat organisme berisi 6 sel.

guide.excreta1=Ekskreta (Excreta) menjatuhkan makanan: ia mengubah energinya menjadi butiran kecil ke arah yang dihadapinya.
guide.excreta2=Sel ini membutuhkan setidaknya 4 energi dan sinyal saraf positif; setiap butiran memakan 4 energi.
guide.excreta3=Butiran mengambil warna sel, sehingga sel ekskreta yang berbeda bisa menandai jenis makanan yang berbeda.
guide.excreta4=Gunakan untuk memberi makan organisme lain, memancing penyerap, atau meninggalkan jejak makanan.
guide.excreta5=Coba: isi daun dengan energi, hubungkan neuron time ke ekskreta, dan lihat deretan butiran muncul.
guide.excreta6=Di level ini, buat organisme berisi 8 sel dan jaga agar tetap kenyang.

guide.pumper1=Pompa (Pumper) memindahkan energi dari sel lain ke dirinya saat bersentuhan.
guide.pumper2=Setiap sentuhan memindahkan 0.03 energi dari sel lain selama pompa masih punya ruang dan sel lain punya setidaknya sebanyak itu.
guide.pumper3=Pompa tidak punya kendali saraf dan rumus: ia memompa setiap kali berbenturan.
guide.pumper4=Sel yang terhubung dengannya tidak pernah berbenturan dengannya, sehingga pompa hanya menguras sel dari organisme lain atau bagian yang tidak terhubung.
guide.pumper5=Coba: tekan pompa ke sel asing dan lihat energi mengalir ke tubuh Anda.
guide.pumper6=Di level ini, buat organisme berisi 8 sel.

guide.punisher1=Penghukum (Punisher) adalah sel senjata: ia menghancurkan sel asing yang menyentuhnya.
guide.punisher2=Sel dari organisme lain langsung dihapus; sel dari organismenya sendiri dan penghukum lain aman.
guide.punisher3=Penghukum tidak punya kendali saraf dan tidak memakan energi, sehingga langsung bekerja begitu menyentuh musuh.
guide.punisher4=Satu penghukum bisa menggerogoti tubuh musuh sel demi sel, tetapi tidak bisa mencapai sel yang tidak pernah disentuhnya.
guide.punisher5=Coba: tabrakkan penghukum ke organisme lain dan lihat sel-selnya menghilang.
guide.punisher6=Di level ini, buat organisme berisi 8 sel dengan penghukum.

guide.pheromones1=Dalam kondisi normal organisme tidak bisa berkomunikasi satu sama lain; justru karena itulah feromon muncul.
guide.pheromones2=Feromon adalah zat yang memungkinkan organisme mengirim sinyal dari kejauhan.
guide.pheromones3=Feromon menyebar perlahan hingga mencapai radius maksimumnya.
guide.pheromones4=Sel PheromoneEmitter bisa menghasilkannya, sedangkan sel PheromoneSensor bisa mendeteksinya.
guide.pheromones5=Saat ini tersedia sekitar 32 feromon, tetapi beberapa di antaranya punya tujuan khusus.
guide.pheromones6=Feromon 0 dihasilkan oleh makanan. Feromon 11 bertanggung jawab atas pertumbuhan sel punca. Feromon 18 dihasilkan oleh sel yang rusak.
guide.pheromones7=Di level ini ada organisme tanpa mata yang bisa merasakan feromon 1 dan bergerak ke arahnya.
guide.pheromones8=Buat organisme yang menghasilkan feromon tipe 1, lalu tunggu organisme itu berenang menghampiri Anda dengan sendirinya.

