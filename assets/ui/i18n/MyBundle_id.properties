tutorial.progress = Tutorial, langkah {0} dari {1}
tutorial.next = Lanjut
tutorial.finish = Selesai
tutorial.next.locked = Selesaikan dulu tugas langkah ini

tutorial.welcome.title = Editor genom
tutorial.welcome.text = Organisme tumbuh dari satu sel, zigot. Genom adalah daftar tahap pertumbuhan. Di setiap tahap, sel mana pun bisa membelah (sel baru muncul di sebelahnya) atau bermutasi (mengganti jenis, warna, atau pengaturan).\n\nTugas langkah ada di bagian bawah panel ini. Jika semuanya selesai, tombol "Lanjut" aktif.\n\nPC: arahkan mouse ke tombol mana pun untuk melihat petunjuk. Ponsel: tekan dan tahan tombol. Petunjuk bisa dimatikan di pengaturan.

tutorial.camera.title = Kamera
tutorial.camera.text = PC: tahan tombol kiri mouse di tempat kosong lalu seret untuk menggeser kamera. Roda mouse memperbesar dan memperkecil.\nPonsel: seret satu jari di tempat kosong, cubit dengan dua jari untuk zoom.

tutorial.timeline.title = Tahap pertumbuhan
tutorial.timeline.text = Garis waktu ada di bawah layar. Setiap langkahnya adalah tahap pertumbuhan. Tombol "<" dan ">" mundur dan maju satu tahap, "<<" dan ">>" melompat ke awal dan akhir. Penggeser juga menggerakkan waktu. Di PC, Spasi melompat ke akhir.\n\nDi tahap pertama zigot sudah membelah dan menumbuhkan daun. Sel semi-transparan adalah sel yang muncul di tahap berikutnya. Pindah ke tahap berikutnya dengan tombol ">".

tutorial.first_divide.title = Pembelahan pertama
tutorial.first_divide.text = Klik sebuah sel (PC: tombol kiri mouse, ponsel: ketuk). Jendela "Belah atau mutasi" terbuka: pilih "Belah".\n\nDi atas jendela sel ada daftar jenis sel: pilih jenis sel baru lalu tekan "Belah". Sel baru muncul di sebelahnya, semi-transparan: ia tumbuh di tahap berikutnya.

tutorial.divide_leaf.title = Belah 5 daun
tutorial.divide_leaf.text = Daun (Leaf) mengumpulkan energi dari matahari: ia memberi makan seluruh organisme.\n\nSatu sel hanya membelah sekali per tahap. Untuk terus membelah, pindah ke tahap berikutnya dengan ">": di sana selnya lebih banyak dan masing-masing bisa membelah lagi.

tutorial.repeat.title = Ulangi tindakan
tutorial.repeat.text = Tidak perlu membuka jendela setiap kali: tindakan terakhir bisa diulang.\nPC: klik kanan pada sel.\nPonsel: nyalakan tombol "Lakukan tindakan terakhir" di atas lalu ketuk sel; setelah itu matikan.\n\nYang diulang adalah tindakan terakhirmu: pembelahan dengan pengaturan yang sama, mutasi, perubahan, atau penghapusan.

tutorial.move.title = Pindahkan sel
tutorial.move.text = Sel yang baru ditambahkan (semi-transparan, di tahapnya sendiri) bisa dipindahkan: tekan lalu seret. Saat dilepas, sel menempati posisi baru dan tautan ke tetangganya dihitung ulang.\n\nTombol "Simetri" di atas menentukan cara sel baru dan sel yang dipindah ditempatkan: dicerminkan atau mengikuti grid.

tutorial.undo.title = Urungkan dan ulangi
tutorial.undo.text = Salah? Tidak masalah. Tombol "Urungkan" di bawah (Ctrl+Z di PC) membatalkan suntingan genom terakhir, "Ulangi" (Ctrl+Y) mengembalikannya.\n\nUrungkan sesuatu lalu kembalikan.

tutorial.mutate.title = Mutasi: 2 Leaf menjadi Fat
tutorial.mutate.text = Mutasi mengubah sel yang sudah tumbuh. Klik sel Leaf biasa (bukan yang semi-transparan). Jika muncul pilihan, pilih "Mutasi". Di daftar jenis pilih Fat lalu tekan "Mutasi".\n\nLemak (Fat) menyimpan energi dua kali lipat. Jendela mutasi menunjukkan sel sekarang di kiri dan hasilnya di kanan. Klik kanan (ulangi) juga bisa.

tutorial.color.title = Warna sel
tutorial.color.text = Jendela sel (saat membelah, bermutasi, atau mengubah) punya tombol "Warna sel". Pilih warna dan konfirmasi, lalu tekan "Belah", "Mutasi", atau "Ubah".\n\nMata organisme lain (sel Eye) melihat warna, dan bunglon bisa mengubah warnanya sendiri.

tutorial.remove.title = Penghapusan
tutorial.remove.text = Sel yang muncul di tahap ini bisa dihapus: klik sel semi-transparan, lalu terbuka jendela dengan "Ubah" dan "Hapus". Hapus membuang sel itu beserta semua yang tumbuh darinya kemudian.\n\nUntuk membatalkan mutasi, klik sel di tahap ia bermutasi lalu tekan "Batalkan mutasi".

tutorial.neural_links.title = Tautan neural
tutorial.neural_links.text = Tautan neural membawa sinyal dari satu sel ke sel lain.\nPC: tahan Ctrl, klik sel sumber, lalu sel tujuan. Panah menunjukkan arah sinyal. Lepaskan Ctrl.\nPonsel: nyalakan tombol "Penghubungan neural" di atas, ketuk sumber, lalu tujuan, kemudian matikan tombolnya.\n\nBuat tautan berurutan seperti rantai: dari sel A ke B, dari B ke C, dari C ke D. Sinyal bisa berjalan seperti itu: setiap tick ia maju satu tautan, jadi dari A ke D butuh 3 tick.

tutorial.link_color.title = Warna dan penghapusan tautan
tutorial.link_color.text = Tombol "Warna tautan neural" di atas mengatur warna tautan baru, agar rangkaian lebih mudah diikuti. Pilih warna lalu buat tautan.\n\nUntuk menghapus tautan, buat lagi tautan di antara sel yang sama (Ctrl + klik sumber, lalu tujuan).

tutorial.signals.title = Cara kerja sinyal
tutorial.signals.text = Setiap tick sel neural mengumpulkan sinyal masuk x: menjumlahkan atau mengalikannya ("Tambahkan / Kalikan"). Lalu menghitung y dengan rumusnya, misalnya y = ax + b, dan meneruskan y lewat tautannya.\n\nSensor membuat sinyal sendiri: Controller (tombol pemain), Eye (apa yang dilihat), Touch trigger (sentuhan), Pheromone sensor (bau). Aktuator melakukan sesuatu berdasarkan sinyal: Tail berenang, Muscle berkontraksi, Chameleon berganti warna.\n\nSekarang mari rakit Frankenstein. Bentuk tidak penting, yang penting isinya dan cara menyambungkannya.

tutorial.controller.title = Kendali: Controller dan Tail
tutorial.controller.text = Buat sel Controller (dengan membelah atau mutasi). Di jendelanya pilih tombol, W secara bawaan. Selama tombol ditahan, Controller mengeluarkan 1.\n\nBuat sel Tail. Ini sel berarah: penggeser "Sudut" memutar panahnya. Ekor mendorong organisme berlawanan dengan arah panah.\n\nSambungkan Controller ke Tail dengan tautan neural: Ctrl + klik Controller, lalu Tail.

tutorial.clock.title = Jam: neuron t dan cos
tutorial.clock.text = Buat sel Neuron dan beri rumus "y = t": ia mengeluarkan waktu dalam detik.\n\nBuat Neuron kedua dengan rumus "y = c * cos(ax + b)". Atur a = 5 (frekuensi) dan c = 1 (amplitudo): jika c = 0, keluarannya selalu 0.\n\nSambungkan neuron t ke neuron cos: kamu mendapat sinyal yang berayun dari -1 sampai 1.

tutorial.muscles.title = Otot
tutorial.muscles.text = Buat setidaknya dua sel Muscle. Otot berkontraksi atau meregang dengan sinyal dari -1 sampai 1.\n\nBuat tautan neural dari neuron cos ke otot-otot (berantai juga bisa: sinyal diteruskan lewat otot). Organisme mulai bergerak berirama.

tutorial.chameleon.title = Lampu kedip: Chameleon
tutorial.chameleon.text = Buat sel Chameleon dan pilih kanal warnanya, misalnya hanya R. Pada sinyal 0 ia hitam, pada sinyal 1 berwarna pilihanmu (R+G kuning, ketiganya putih).\n\nAlirkan sinyal neuron cos ke sel ini: bunglon mulai berkedip.

tutorial.frankenstein.title = Frankenstein
tutorial.frankenstein.text = Mari periksa semuanya sekaligus: jika ada yang rusak saat kamu menyelesaikan bagian lain, tugas akan menunjukkannya.\n\nSimpan genom: tombol "Simpan Genom" di atas, masukkan nama, lalu tekan "Simpan ke file".

tutorial.finish.title = Selesai!
tutorial.finish.text = Kamu sudah membuat organisme yang dikendalikan tombol, bergerak, dan berkedip.\n\nCara mencobanya: "Simpan Genom" lalu "Simpan & test". Di simulasi nyalakan tombol "Controller Keys" dan tahan W.\n\nSetiap sel dijelaskan di Panduan, tab "Sel". Tekan "Selesai" untuk kembali ke menu.

