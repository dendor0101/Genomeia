worldRules.resetAll=Atur ulang semua
worldRules.resetAll.hint=Kembalikan semua pengaturan dunia ke standar dunia baru
worldRules.resetOne=Kembali ke standar: {0}
worldRules.standard=Standar: {0}
worldRules.footer=Pengaturan disimpan bersama dunia.
worldRules.gravity=Gravitasi
worldRules.gravity.hint=Menarik semuanya ke bawah layar: organisme, makanan, sel yang lepas. 0: dunia dilihat dari atas, seperti biasa. Angkanya adalah percepatan dalam sel per detik kuadrat.
worldRules.viscosity=Kekentalan medium
worldRules.viscosity.hint=Seberapa kental mediumnya. Meredam semua gerakan sama ke segala arah: lebih tinggi, semuanya lebih cepat berhenti dan makanan tidak hanyut; 0, tubuh meluncur hampir tanpa melambat.
worldRules.waterDrag=Hambatan air
worldRules.waterDrag.hint=Air menahan tepi tubuh yang bergerak melintang. Otot mendorong air ini saat organisme berenang: lebih tinggi, kayuhan lebih kuat tetapi cepat melambat; 0, otot tidak punya tumpuan.
worldRules.friction=Gesekan
worldRules.friction.hint=Gesekan saat bersentuhan: seberapa kuat tubuh saling mencengkeram dan menahan dinding alih-alih tergelincir. 0: licin seperti es.
worldRules.light=Cahaya
worldRules.light.hint=Berapa energi yang didapat daun dari cahaya per tik. 0: gelap, daun tidak menyimpan apa pun.
worldRules.foodEnergy=Energi makanan
worldRules.foodEnergy.hint=Berapa energi yang diberikan makanan yang dimakan. Sebanyak itu pula biaya sel ekskreta untuk mengeluarkan sepotong makanan.
worldRules.softness=Kelembutan tubuh
worldRules.softness.hint=Kelembutan jaringan semua organisme: ikatan antarsel lebih mudah meregang dan menyusut. Lebih tinggi: tubuh mudah penyok dan robek; lebih rendah: tubuh lebih kokoh.
worldRules.tailForce=Kekuatan flagel
worldRules.tailForce.hint=Seberapa kuat flagel mendorong. Menentukan kecepatan organisme berflagel.
worldRules.linkTransfer=Pertukaran energi
worldRules.linkTransfer.hint=Seberapa cepat energi mengalir antarsel tetangga lewat ikatan. 0: tiap sel hidup dari cadangannya sendiri.
worldRules.pumpRate=Kekuatan pompa
worldRules.pumpRate.hint=Berapa energi yang diambil pompa per tik dari sel yang disentuhnya.
worldRules.producerPause=Jeda produsen
worldRules.producerPause.hint=Berapa lama produsen menunggu di antara keturunan: tik per sel genom. Lebih tinggi: keturunan lebih jarang muncul.
worldRules.maxEnergy=Kapasitas energi
worldRules.maxEnergy.hint=Berapa energi yang bisa ditampung sel jenis ini. Sel yang sudah hidup langsung mendapat kapasitas baru.
worldRules.actionCost=Biaya aksi
worldRules.actionCost.hint=Berapa energi yang dipakai sel jenis ini per tik untuk kerjanya: berkontraksi, melihat, mendorong.
worldRules.cellSoftness=Kelembutan sel
worldRules.cellSoftness.hint=Kelembutan jaringan di sekitar sel jenis ini: ×1 normal, lemak ×5 secara bawaan. Dikalikan dengan kelembutan tubuh umum.
