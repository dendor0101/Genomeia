cell.motor_neuron.description = Neuron motorik: mengirim keluarannya ke setiap Muscle dalam klasternya tanpa tautan saraf. Klaster adalah semua Muscle yang terhubung satu sama lain dan dengan MotorNeuron lewat tautan fisik pada tubuh dewasa. Panahnya menentukan arah serat: klaster mengerut dan meregang hanya searah panah dan menjaga ukurannya ke arah melintang. Sinyal bekerja seolah setiap Muscle punya tautan saraf sendiri; klaster tidak terpecah meski tubuh robek.
guide.lab.motor_neuron=Dua tubuh dari Muscle dengan MotorNeuron di tengah, tanpa tautan saraf. Panah kiri searah tubuh, panah kanan melintang: dengan sinyal yang sama tubuh kiri berubah lebar dan tubuh kanan berubah tinggi. Muscle di balik Leaf di kanan tidak termasuk klaster dan tidak bereaksi.
guide.lab.metric.lengthOutside=Faktor panjang Muscle di balik Leaf
