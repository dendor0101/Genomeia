#Гайды
guide.win=Level completed!
guide.loose=You lost. Try again?
guide.luck=Good luck!
guide.time=You have five minutes to build the organism.
guide.needcell=The organism must contain the cell this level teaches.

guide.leaf1=A leaf cell generates energy for the rest of the organism; it requires nothing in return.
guide.leaf2=Your goal is to create an organism consisting of 10 leaf cells.

guide.tail1=A Tail is a cellular structure that allows an organism to move.
guide.tail2=The force of the Tail's action is regulated by the 'y' output.
guide.tail3=To create a Tail that operates continuously, the parameter b must be set to 1.
guide.tail4=the speed is adjustable within the range of 0–1 value
guide.tail5=In this level, you need to reach the right side of the map.

guide.eye1=The eye is a cell that reacts to specific colors.
guide.eye2=The eye emits a straight beam, and if something enters this beam, the eye reveals its color.
guide.eye3=In it, you can configure the angle, the beam distance, and which colors it reacts to.
guide.eye4=The eye produces an impulse equal to the arithmetic mean of the object's colors.
guide.eye5=With the help of eyes, one can create organisms capable of avoiding walls or other organisms!
guide.eye6=To complete this level, you need to navigate a small maze.
guide.eye7=Don't forget that the eyes and flagella can be linked directly via a neural connection.

guide.muscle1=A muscle is a cell capable of changing its size, thereby altering the shape of the organism.
guide.muscle2=The size of a muscle depends on the neural signal sent to it.
guide.muscle3=When the input signal is >0, the muscle enlarges; when it is <0, it shrinks.
guide.muscle4=The signal is clamped to [-1; 1], so the muscle ranges from half to one and a half of its normal length.
guide.muscle5=To complete this level, you need to create an organism made of muscles and leaves that is capable of passing through a small gap.
guide.muscle6=Don't forget that you can set a signal directly by changing the 'b' parameter in the cell.

guide.neuron1=A neuron is a cell that carries signals between the other cells of an organism.
guide.neuron2=It has no action of its own: it receives signals through neural links and sends the result further.
guide.neuron3=The result is calculated by the activation formula, y = ax + b by default: a scales the input, b adds a constant signal.
guide.neuron4=Set b and the neuron sends that value even when nothing is linked to its input.
guide.neuron5=On a computer, hold Ctrl and click one cell, then the other one, to create a neural link between them.
guide.neuron6=Neurons can be chained, and their inputs can be added or multiplied: a neuron with the time formula linked to a neuron with the sine formula gives a signal that changes periodically.
guide.neuron7=A neuron spends energy on every tick, so keep the chain short.
guide.neuron8=In this level only leaves, muscles, neurons and tails are allowed.
guide.neuron9=To complete this level, build a narrow body with a tail, drive the tail through a neuron and swim through the gap to the lower part of the channel.

guide.suctioncup1=A suction cup is a cell that changes how strongly the organism resists moving through the water.
guide.suctioncup2=Its grip is set by the neural signal it receives: 0 is no grip, 1 is the strongest grip, and values above 1 count as 1.
guide.suctioncup3=Grip alone does not move the organism: release the cup, pull forward with muscles, grip again, and the organism crawls.
guide.suctioncup4=To make the grip alternate, the signal must change over time: chain a neuron with the time formula to a neuron with the sine formula.
guide.suctioncup5=Link that signal to the suction cups and to the muscles. Set the muscle's a to -1 so it contracts while the cups hold.
guide.suctioncup6=In this level only leaves, muscles, neurons and suction cups are allowed. Tails are forbidden.
guide.suctioncup7=Reach the end of the corridor with an organism built from these cells.

guide.smooth1=Pick the sine or cosine formula on a neuron: both turn a value into a smooth wave between -1 and 1.
guide.smooth2=Their parameters are the same: a sets the frequency, b shifts the wave along the input axis, and c sets the amplitude.
guide.smooth3=sin starts at 0 and cos starts at 1, so cos is the one to use when the signal must already be high at time zero.
guide.smooth4=The usual trick is to feed time into a sine neuron: its output then rises and falls forever without any sensor.
guide.smooth5=In this level only leaves, muscles, neurons and tails are allowed.
guide.smooth6=Build a body with a tail or muscles driven by a wave and follow the winding corridor to its end.

guide.thresholds1=Pick a threshold formula on a neuron: it turns a smooth input into a sharp decision.
guide.thresholds2=The sigmoid formula squashes the input into 0..1: y = 1/(1+exp(-(ax+b))) + c. a sets the steepness, b moves the point where the curve rises, and c shifts the result.
guide.thresholds3=The two step formulas return b while the input is on one side of a and c on the other: y = b for x <= a (strict: x < a) and y = c otherwise.
guide.thresholds4=The window formula keeps the input only while it lies strictly between a and b; outside that window it returns c.
guide.thresholds5=A threshold hides small noise and reacts only to a strong signal, so an organism can swim on and stop at a wall.
guide.thresholds6=In this level only leaves, muscles, neurons and tails are allowed.
guide.thresholds7=Build an organism whose motion switches on a threshold, pass both doors and reach the far end.

guide.timepulse1=Pick the time, impulse or spike formula on a neuron: their signal depends on the clock, not on the input.
guide.timepulse2=time returns the simulation time in seconds plus the index of the cell in its organism, so two time neurons never start at exactly the same moment.
guide.timepulse3=impulse(a) returns 1 for a seconds after its input has reached 1, then drops back to 0. a is the pulse length.
guide.timepulse4=spike(a) returns 1 for a single tick when its input jumps up by at least a, and 0 otherwise. a is the jump size.
guide.timepulse5=time gives a rhythm, impulse holds an action for a while, and spike reacts to a single event such as a touch.
guide.timepulse6=In this level only leaves, muscles, neurons and tails are allowed. Pass the three gates and reach the end.

guide.memory1=Pick remember or decay on a neuron: they give it a memory of past ticks.
guide.memory2=remember stores the last positive input and keeps returning it: a positive input refreshes the memory, a negative one clears it to 0.
guide.memory3=decay holds a peak and lets it fall: a strong input lifts the memory, then it drops by a every tick and stays between b and c.
guide.memory4=A memory makes a signal outlive the touch that started it, which is handy for a muscle that must keep pulling after an eye has looked away.
guide.memory5=In this level only leaves, muscles, neurons and tails are allowed. Cross the corridor and both chambers to the end.

guide.power1=Pick the power or absolute-value formula on a neuron: they reshape a signal without remembering anything.
guide.power2=The power formula raises the input to a: y = x^a. With a = 2 a weak signal stays weak and a strong one wins; with a = 0.5 the opposite happens.
guide.power3=A negative input with a fractional exponent has no real power, so the neuron returns 0. The absolute-value formula avoids that: y = |x|.
guide.power4=The absolute-value formula strips the sign, so a signal that swings both ways becomes a one-sided push.
guide.power5=In this level only leaves, muscles, neurons and tails are allowed. Squeeze through the narrow middle of the funnel and reach the end.

guide.random1=Pick the random formula on a neuron: it turns its input into a repeatable random value between a and b.
guide.random2=It is a hash of the input, not a coin toss: the same input always gives the same output, and an input that changes smoothly looks like noise.
guide.random3=That keeps the whole world deterministic, so a recorded game replays bit for bit.
guide.random4=In this level only leaves, muscles, neurons and tails are allowed. Weave between the scattered walls and reach the end.

# Гайды: остальные клетки. Уровни к ним пока не сделаны, поэтому последняя строка —
# не цель уровня, а опыт, который можно повторить в песочнице.

guide.fat1=A fat cell is a soft storage cell: it holds up to 10 energy, twice as much as a leaf.
guide.fat2=It does nothing on its own: it has no signal, does not move and does not make energy.
guide.fat3=Energy flows along physical links from a cell that is fuller relative to its own capacity to one that is emptier, so fat takes the surplus from the cells that make or absorb energy and gives it back when the body needs it.
guide.fat4=Its links are softer than usual, so a fat cell also works as a cushion between hard parts.
guide.fat5=Try it: let a sucker fill a fat cell, then add a muscle and watch the fat feed it.
guide.fat6=In this level, build a body with a fat store and reach the right side of the corridor.

guide.bone1=A bone cell is the skeleton of the body: it is stiff and its links are very stiff.
guide.bone2=Its own stiffness is twice the usual cell stiffness and its links are 16 times stiffer than normal links, so a bone keeps the shape of the body under load.
guide.bone3=It holds only 3 energy and does nothing on its own: it has no signal, does not move and does not make energy.
guide.bone4=Bones are the frame for jaws, fins and long bodies; without them muscles would bend the body into a ball.
guide.bone5=Try it: build a two-cell jaw from bones, link a muscle across it and watch the jaw open and close.
guide.bone6=In this level, pass the narrow gap in the wall and reach the right side.

guide.zygote1=A zygote is the seed of an organism: every genome starts as one zygote.
guide.zygote2=It does not act by itself; the first stage of the genome divides and mutates it into the body.
guide.zygote3=It takes 0.06 energy per tick from sunlight, up to 10, and spends nothing on actions, so it can wait for the first division.
guide.zygote4=A producer lays a new zygote when it fires, and that zygote starts a separate organism.
guide.zygote5=Try it: start a genome with a single zygote and watch it grow before the first division.
guide.zygote6=In this level, grow an organism of 8 cells from a single zygote.

guide.touchtrigger1=A touch trigger is a bump sensor: it adds to its signal whenever something presses into it.
guide.touchtrigger2=The added value is the overlap divided by the cell radius, so a light touch gives a small signal and a deep push gives a large one.
guide.touchtrigger3=With the default addition of inputs, the input is cleared every tick, so a steady touch gives a steady signal; the cell's formula turns it into the output.
guide.touchtrigger4=With the default y = ax + b and a = 1, b = 0 the output is the pressure itself.
guide.touchtrigger5=Try it: put a touch trigger on the nose, link it to a tail and make the organism back away from a wall.
guide.touchtrigger6=In this level, follow the winding corridor and reach the right side.

guide.controller1=A controller is a key sensor: it turns a key press into a neural signal.
guide.controller2=Choose the key in the cell dialog: digits 0 to 9, W A S D, the arrow keys or space.
guide.controller3=The formula receives 1 while the key is held and 0 while it is released; the default y = ax + b with a = 1, b = 0 gives exactly that.
guide.controller4=Use the spike formula to get one short pulse per press instead of a signal that lasts while the key is down.
guide.controller5=Try it: link a controller on W to a tail and drive the organism by hand.
guide.controller6=In this level, drive the organism with the keys and reach the right side.

guide.chameleon1=A chameleon is a color cell: it paints itself with the color packed into its signal.
guide.chameleon2=The signal is a packed number: red is the lowest 8 bits, green the next 8 and blue the next 8, each from 0 to 255.
guide.chameleon3=The red, green and blue formulas turn a 0 to 1 channel into those parts; sum them on the way into the chameleon.
guide.chameleon4=Keep the chameleon's own formula at y = x (a = 1, b = 0, c = 0) so it passes the packed number through unchanged.
guide.chameleon5=In this level, you need to make the organism swim in the other direction; the organism moves in the direction opposite to the red color.

guide.synapse1=A synapse is a learnable connection: it sits between an input cell and a neuron and changes its own weight.
guide.synapse2=It needs exactly one link in and one link out, and the outgoing link must end on a neuron; any other wiring turns the synapse red and silent.
guide.synapse3=Its output is weight times input, with weight starting at a random value below 0.2.
guide.synapse4=If the input fires before the neuron, the weight grows by the learning rate; if the neuron fires first, the weight falls by the depression rate.
guide.synapse5=The decay rate sets how fast an old spike pair is forgotten; weight that reaches 0 kills the synapse.
guide.synapse6=Try it: put a synapse between a touch trigger and a neuron that drives a muscle, and let the organism learn to react to touch.
guide.synapse7=In this level, train the synapse and cross the corridor to the right side.

guide.producer1=A producer lays a new organism: when it fires, it creates a zygote in front of itself.
guide.producer2=It fires only when its energy is full and its signal is at least 1.
guide.producer3=After firing it spends all its energy and waits before it can lay again; the wait grows with the number of cell actions in the genome.
guide.producer4=The child is a separate organism with the same genome, so a producer can spread a species through the world.
guide.producer5=Try it: fill a producer with leaves, pulse its signal and watch a small zygote appear in front.
guide.producer6=In this level, grow a colony of 12 cells.

guide.sticky1=A sticky cell is a temporary glue: it pulls on whatever it touches.
guide.sticky2=The pull is set by its neural signal from 0 to 1; with no signal it does nothing.
guide.sticky3=It works on walls, food and other organisms, but not on the cells linked into its own body, because linked cells never collide.
guide.sticky4=The glue also damps the relative speed, so a stuck cell does not bounce.
guide.sticky5=Try it: stick a cell to a wall, pull with a muscle, then release the glue to crawl.
guide.sticky6=In this level, use the glue to pass the zigzag and reach the right side.

guide.sucker1=A sucker is a filter feeder: it collects food particles that touch it.
guide.sucker2=A particle inside its mouth is deleted and turned into energy; a particle just outside is pulled toward the mouth.
guide.sucker3=It does not push other cells away, so it can be packed into a body or pressed against a food cloud.
guide.sucker4=It has no neural control and works all the time.
guide.sucker5=Try it: park a sucker in a cloud of food and watch its energy rise.
guide.sucker6=In this level, collect food and build an organism of 6 cells.

guide.excreta1=An excreta cell drops food: it turns its energy into a small pellet in the direction it faces.
guide.excreta2=It needs at least 4 energy and a positive neural signal; each pellet costs 4 energy.
guide.excreta3=The pellet takes the color of the cell, so different excreta cells can mark different food types.
guide.excreta4=Use it to feed other organisms, to bait a sucker or to leave a trail of food.
guide.excreta5=Try it: fill a leaf, link a time neuron to an excreta and watch a line of pellets appear.
guide.excreta6=In this level, build an organism of 8 cells and keep it fed.

guide.pumper1=A pumper moves energy from another cell into itself on contact.
guide.pumper2=Each touch moves 0.03 energy from the other cell while the pumper has room and the other cell has at least that much.
guide.pumper3=It has no neural control and no formula: it pumps whenever it collides.
guide.pumper4=Its own linked cells never collide with it, so it drains only cells from other organisms or unlinked parts.
guide.pumper5=Try it: press a pumper against a foreign cell and watch the energy flow into your body.
guide.pumper6=In this level, build an organism of 8 cells.

guide.punisher1=A punisher is a weapon cell: it destroys foreign cells that touch it.
guide.punisher2=A cell of another organism is removed at once; cells of its own organism and other punishers are safe.
guide.punisher3=It has no neural control and no energy cost, so it works as soon as it touches an enemy.
guide.punisher4=One punisher can eat through an enemy body cell by cell, but it cannot reach a cell it never touches.
guide.punisher5=Try it: ram a punisher into another organism and watch its cells disappear.
guide.punisher6=In this level, build an organism of 8 cells with a punisher.

guide.pheromones1=Under normal conditions, organisms cannot communicate with one another; that is precisely why pheromones evolved.
guide.pheromones2=Pheromones are substances that allow organisms to transmit signals over a distance.
guide.pheromones3=They spread slowly, reaching their maximum radius.
guide.pheromones4=The PheromoneEmitter cell can produce them, while the PheromoneSensor cell can detect them.
guide.pheromones5=There are currently about 32 pheromones available, but some of them have a specific purpose.
guide.pheromones6=Pheromone 0 is produced by food. Pheromone 11 is responsible for stem cell growth. Pheromone 18 is produced by damaged cells.
guide.pheromones7=On this level, there is an organism that lacks eyes but can sense pheromone 1 and moves toward it.
guide.pheromones8=Create an organism that produces a type 1 pheromone, and wait for the organism to swim to you on its own.
