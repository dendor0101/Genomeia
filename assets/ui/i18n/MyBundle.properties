guide.title = Guide
guide.tab.tutorial = Tutorial
guide.tab.cells = Cells
guide.tutorial.text = The tutorial runs right inside the genome editor. A panel on the right shows the current task: what to do and how. A task completes by itself as soon as you do it, then press "Next". At the end you will build your own Frankenstein: an organism that swims on the W key, twitches its muscles and blinks.
guide.tutorial.steps = What the tutorial covers
guide.tutorial.start = Start tutorial
guide.cell.energy = Energy up to {0}
guide.cell.neural = neural
guide.cell.directed = directed
guide.cell.contact = acts on contact
guide.cell.notCollidable = does not collide
guide.cell.noDescription = No description yet.

tutorial.progress = Tutorial, step {0} of {1}
tutorial.next = Next
tutorial.finish = Finish
tutorial.next.locked = Complete the tasks of this step first

tutorial.welcome.title = Genome editor
tutorial.welcome.text = An organism grows from a single cell, the zygote. A genome is a list of growth stages. At every stage any cell can divide (a new cell appears next to it) or mutate (change its type, color or settings).\n\nThe tasks of a step are listed at the bottom of this panel. When all of them are done, the "Next" button unlocks.\n\nPC: hover the mouse over any button to see a hint. Phone: press and hold a button. Hints can be turned off in the settings.

tutorial.camera.title = Camera
tutorial.camera.text = PC: hold the left mouse button on an empty spot and drag to move the camera. The mouse wheel zooms in and out.\nPhone: drag one finger over an empty spot, pinch with two fingers to zoom.

tutorial.timeline.title = Growth stages
tutorial.timeline.text = The timeline is at the bottom of the screen. Each step of it is a growth stage. The "<" and ">" buttons go one stage back and forward, "<<" and ">>" jump to the start and the end. The slider moves through time too. On PC, Space jumps to the end.\n\nAt the first stage the zygote already divides and grows a leaf. A semi-transparent cell is one that appears at the next stage. Go to the next stage with the ">" button.

tutorial.first_divide.title = First division
tutorial.first_divide.text = Click a cell (PC: left mouse button, phone: tap). The "Divide or mutate" window opens: choose "Divide".\n\nAt the top of the cell window is the list of cell types: choose what the new cell will be and press "Divide". The new cell appears next to it, semi-transparent: it will grow at the next stage.

tutorial.divide_leaf.title = Divide 5 leaves
tutorial.divide_leaf.text = A Leaf collects energy from the sun: it feeds the whole organism.\n\nA cell divides only once per stage. To keep dividing, go to the next stage with ">": there are more cells there, and each can divide again.

tutorial.repeat.title = Repeat an action
tutorial.repeat.text = You do not have to open the window every time: the last action can be repeated.\nPC: right-click a cell.\nPhone: turn on the "Perform last action" button at the top and tap cells, then turn it off.\n\nWhatever you did last is repeated: a division with the same settings, a mutation, a change or a removal.

tutorial.move.title = Move a cell
tutorial.move.text = A cell you have just added (semi-transparent, at its own stage) can be moved: press it and drag. When you let go, the cell takes the new place and its links to neighbours are recalculated.\n\nThe "Symmetry" button at the top sets how new and moved cells are placed: mirrored or on a grid.

tutorial.undo.title = Undo and redo
tutorial.undo.text = Made a mistake? No problem. The "Undo" button at the bottom (Ctrl+Z on PC) undoes the last genome edit, "Redo" (Ctrl+Y) brings it back.\n\nUndo something and bring it back.

tutorial.mutate.title = Mutation: 2 Leaf into Fat
tutorial.mutate.text = A mutation changes a cell that has already grown. Click a regular (not semi-transparent) Leaf cell. If a choice appears, pick "Mutate". Choose Fat in the type list and press "Mutate".\n\nFat stores twice as much energy. The mutation window shows the cell as it is now on the left and what it will become on the right. Right-click (repeat) works too.

tutorial.color.title = Cell color
tutorial.color.text = The cell window (when dividing, mutating or changing) has a "Cell Color" button. Pick a color and confirm, then press "Divide", "Mutate" or "Change".\n\nThe eyes of other organisms (the Eye cell) see colors, and a chameleon can change its own.

tutorial.remove.title = Removal
tutorial.remove.text = You can remove a cell that appears at this stage: click a semi-transparent cell and a window with "Change" and "Remove" opens. Removal deletes the cell and everything that later grows from it.\n\nTo cancel a mutation, click the cell at the stage where it mutates and press "Cancel mutation".

tutorial.neural_links.title = Neural links
tutorial.neural_links.text = A neural link carries a signal from one cell to another.\nPC: hold Ctrl, click the source cell, then the target cell. The arrow shows where the signal goes. Release Ctrl.\nPhone: turn on the "Neural-linking" button at the top, tap the source, then the target, then turn the button off.\n\nDraw the links one after another, as a chain: from cell A to B, from B to C, from C to D. A signal can travel along such a chain: every tick it moves one link further, so from A to D it takes 3 ticks.

tutorial.link_color.title = Link color and removal
tutorial.link_color.text = The "Neural link color" button at the top sets the color of new links, so the wiring is easier to follow. Pick a color and draw a link.\n\nTo remove a link, draw it again between the same cells (Ctrl + click on the source, then on the target).

tutorial.signals.title = How signals work
tutorial.signals.text = Every tick a neural cell collects its incoming signals x: adds or multiplies them ("Addition / Multiplication"). Then it computes y with its formula, for example y = ax + b, and passes y on through its links.\n\nSensors make a signal by themselves: Controller (a player key), Eye (what it sees), Touch trigger (touch), Pheromone sensor (smell). Actuators do something on a signal: Tail swims, Muscle contracts, Chameleon changes color.\n\nNow let us build a Frankenstein. The shape does not matter, only what it is made of and how it is wired.

tutorial.controller.title = Control: Controller and Tail
tutorial.controller.text = Make a Controller cell (by division or mutation). In its window choose a key, W by default. While the key is held, the Controller outputs 1.\n\nMake a Tail cell. It is a directed cell: the "Angle" slider turns its arrow. The tail pushes the organism opposite to the arrow.\n\nConnect the Controller to the Tail with a neural link: Ctrl + click on the Controller, then on the Tail.

tutorial.clock.title = Clock: t and cos neurons
tutorial.clock.text = Make a Neuron cell and give it the formula "y = t": it outputs the time in seconds.\n\nMake a second Neuron with the formula "y = c * cos(ax + b)". Set a = 5 (frequency) and c = 1 (amplitude): with c = 0 the output is always 0.\n\nConnect the t neuron to the cos neuron: you get a signal that swings from -1 to 1.

tutorial.muscles.title = Muscles
tutorial.muscles.text = Make at least two Muscle cells. A muscle contracts or stretches on a signal from -1 to 1.\n\nDraw neural links from the cos neuron to the muscles (a chain works too: the signal passes through a muscle further on). The organism starts twitching in rhythm.

tutorial.chameleon.title = Blinker: Chameleon
tutorial.chameleon.text = Make a Chameleon cell and choose its color channels, for example only R. At signal 0 it is black, at signal 1 it has the chosen color (R+G is yellow, all three are white).\n\nBring the signal of the cos neuron to it: the chameleon starts blinking.

tutorial.frankenstein.title = Frankenstein
tutorial.frankenstein.text = Let us check everything at once: if something broke while you were finishing the rest, the tasks will show it.\n\nSave the genome: the "Save Genome" button at the top, enter a name and press "Save to file".

tutorial.finish.title = Done!
tutorial.finish.text = You have built an organism that is controlled by a key, twitches and blinks.\n\nHow to try it: "Save Genome" then "Save and test". In the simulation turn on the "Controller Keys" button and hold W.\n\nEvery cell is described in the Guide, on the "Cells" tab. Press "Finish" to go to the menu.

