cell.leaf.description = Collects energy from the sun until it is full. The organism's main food source.
cell.fat.description = Storage: holds up to 10 energy, twice as much as a regular cell. Soft.
cell.bone.description = A hard cell with very stiff links: the frame of the body. Holds little energy.
cell.tail.description = Swims: on a signal from 0 to 1 it pushes the organism opposite to its arrow. Speeds up and slows down smoothly.
cell.controller.description = Player key sensor. While the chosen key is held, the raw signal is 1, otherwise 0; then it goes through the cell formula.
cell.muscle.description = Contracts and stretches on a signal from -1 to 1: its links to neighbours get shorter or longer by up to half.
cell.sucker.description = Pulls nearby food in and absorbs it on contact, gaining energy. Other particles pass through it.
cell.excreta.description = Directed. While the signal is above 0 and there is enough energy, it releases food of its own color along its arrow.
cell.punisher.description = Kills cells of other organisms on contact, except Bone and other Punishers. Each kill costs its full energy.
cell.pumper.description = On contact it drains energy from a foreign cell until it is full.
cell.zygote.description = The first cell of an organism, the whole body grows from it. Slowly collects energy from the sun by itself.
cell.producer.description = Reproduction: with full energy and a signal of 1 it releases a zygote from time to time, and a new organism grows from it with the same genome.
cell.neuron.description = Collects incoming signals, computes its output with a formula (y = ax + b, sin, cos, sigmoid and others) and passes it on.
cell.suction_cup.description = Grips the surface on a signal from 0 to 1: the stronger the signal, the firmer the grip.
cell.sticky.description = On a signal from 0 to 1 it pulls in and holds the cells it touches.
cell.chameleon.description = Changes color by signal: 0 is black, 1 is the color of the chosen R, G, B channels (R alone is red, all three are white).
cell.eye.description = Directed sensor: looks along its arrow and outputs the brightness of the first thing it sees in the chosen color channels.
cell.touch_trigger.description = Touch sensor: the harder it is pressed, the bigger the signal.
cell.synapse.description = A learning link: passes a signal into a Neuron with a weight and changes the weight when the input and the neuron fire together. Needs exactly one incoming link and one outgoing link into a Neuron.
cell.pheromone_emitter.description = Releases a pheromone of the chosen type when the signal rises above 0.
cell.pheromone_sensor.description = Smells the pheromone of the chosen type nearby: the closer and fresher, the bigger the signal (up to 1).

# --- Стенд формул ---
guide.tab.formulas = Formulas
guide.cell.formulasLink = Neuron formulas
guide.formulas.text = Here you can play with a single neuron. Every tick it gathers its input signals into one number x (adds or multiplies them), computes the output y with its formula and passes it on through its links. Move the sliders: the graph and the numbers change right away.
guide.formulas.inputs = Input signals
guide.formulas.input = Input {0}
guide.formulas.addInput = Add an input
guide.formulas.removeInput = Remove an input
guide.formulas.neuron = Neuron
guide.formulas.curve = The yellow line is the output y for any input x from -10 to 10. The marker is the current input and output.
guide.formulas.overTime = This formula depends not only on x but also on time or on the memory of the neuron, so the graph shows the last 5 seconds: the blue line is the input x, the yellow one is the output y.
guide.formulas.all = All formulas
formula.linear.description = A straight line: y = a * x + b. a is the slope (how much to amplify the signal, a minus flips it), b is the offset. With a = 1 and b = 0 the neuron just passes the signal on.
formula.sin.description = A sine wave: y = c * sin(a * x + b). c is the amplitude (with c = 0 the output is always 0), a is the frequency, b is the shift. Together with a clock (y = t) it makes a rhythm.
formula.cos.description = A cosine wave: the same as the sine, shifted by a quarter of a period. y = c * cos(a * x + b). At x = 0 the output equals c.
formula.sigmoid.description = A smooth step from 0 to 1: y = 1 / (1 + e^-(a * x + b)) + c. a is the steepness, b is where the step is, c moves it up or down. Handy to turn any signal into "yes / no" without a sharp jump.
formula.step_le.description = A step: if x <= a the output is b, otherwise c. A switch-on threshold.
formula.step_lt.description = A step: if x < a the output is b, otherwise c. It differs from the previous one only exactly at the threshold x = a.
formula.time.description = A clock: the output is the world time in seconds, the input does not matter. In the game the cell number is added to it, so different clock neurons have different phases. Connect it to a sine or cosine to get a rhythm.
formula.impulse.description = An impulse: when the input x reaches 1 or more, the neuron outputs 1 for a seconds, then 0. While the impulse lasts, new inputs do not extend it.
formula.in_range.description = A window: if x is between a and b (not including the ends), the output equals x, otherwise c. Lets through only signals of the right strength.
formula.pow.description = A power: y = x to the power of a. A negative x with a fractional power is undefined, then the output is 0.
formula.remember.description = Memory: a positive input x is remembered and sent to the output. While the input is 0, the neuron keeps the last number. A negative input erases the memory and the output becomes 0.
formula.random.description = A random number from a to b that depends on the input: the same x always gives the same y, while neighbouring x give completely different ones. Feed it a clock to get noise.
formula.energy.description = How full the cell is: its energy divided by the maximum, from 0 to 1. The input does not matter. On the stand the neuron is half full.
formula.controller.description = The player key number a: while it is held the output is 1, otherwise the output repeats the input x. Outdated: use the Controller cell for control.
formula.decay.description = A peak with decay: a strong input (above b and above the current value) is remembered, then every tick the output drops by a until it reaches b. The output always stays between b and c. A short burst becomes a long tail.
formula.spike.description = A jump detector: the output is 1 only on the tick when the input grew by a or more at once, otherwise 0. A steady signal gives nothing.
formula.abs.description = Absolute value: y = |x|. A negative signal becomes positive.
formula.links_amount.description = How many physical links the cell has to its neighbours. The input does not matter. It tells the cell whether it is at the edge of the body or inside. On the stand the neuron has 4 links.
