bug.text.crashPrevious=Esto NO es un cierre nuevo. El juego se cerró la última vez que jugaste; el informe se guardó y se muestra ahora que el juego funciona de nuevo. Describe qué estabas haciendo y envíalo: me ayudará mucho a corregir el error.
