# Гайды
guide.win=¡Nivel completado!
guide.loose=Has perdido. ¿Intentarlo de nuevo?
guide.luck=¡Buena suerte!
guide.time=Tienes cinco minutos para construir el organismo.
guide.needcell=El organismo debe contener la célula que enseña este nivel.

guide.leaf1=La hoja (Leaf) genera energía para el resto del organismo y no pide nada a cambio.
guide.leaf2=Tu objetivo es crear un organismo formado por 10 hojas.

guide.tail1=La cola (Tail) es una célula que permite al organismo moverse.
guide.tail2=La fuerza de la cola se regula con su salida y.
guide.tail3=Para que la cola funcione sin parar, pon el parámetro b en 1.
guide.tail4=La velocidad se ajusta en el rango de 0 a 1.
guide.tail5=En este nivel tienes que llegar al lado derecho del mapa.

guide.eye1=El ojo (Eye) es una célula que reacciona a ciertos colores.
guide.eye2=El ojo emite un rayo recto y, si algo entra en el rayo, el ojo detecta su color.
guide.eye3=En el ojo puedes configurar el ángulo, la distancia del rayo y los colores a los que reacciona.
guide.eye4=El ojo produce un impulso igual a la media aritmética de los colores del objeto.
guide.eye5=¡Con ojos puedes crear organismos capaces de esquivar paredes u otros organismos!
guide.eye6=Para completar este nivel tienes que atravesar un pequeño laberinto.
guide.eye7=No olvides que los ojos y las colas se pueden unir directamente con una conexión neuronal.

guide.muscle1=El músculo (Muscle) es una célula capaz de cambiar de tamaño y así cambiar la forma del organismo.
guide.muscle2=El tamaño del músculo depende de la señal neuronal que recibe.
guide.muscle3=Cuando la señal de entrada es >0, el músculo crece; cuando es <0, se encoge.
guide.muscle4=La señal se limita a [-1; 1], así que el músculo va de la mitad a una vez y media de su longitud normal.
guide.muscle5=Para completar este nivel, crea un organismo de músculos y hojas capaz de pasar por una rendija estrecha.
guide.muscle6=No olvides que puedes fijar una señal directamente cambiando el parámetro b de la célula.

guide.neuron1=La neurona (Neuron) es una célula que transmite señales entre las demás células del organismo.
guide.neuron2=No tiene acción propia: recibe señales por las conexiones neuronales y envía el resultado más allá.
guide.neuron3=El resultado se calcula con la fórmula de activación, por defecto y = ax + b: a escala la entrada y b añade una señal constante.
guide.neuron4=Fija b y la neurona enviará ese valor aunque no haya nada conectado a su entrada.
guide.neuron5=En el ordenador, mantén Ctrl y haz clic en una célula y luego en la otra para crear una conexión neuronal entre ellas.
guide.neuron6=Las neuronas se pueden encadenar y sus entradas se pueden sumar o multiplicar: una neurona con la fórmula time conectada a una neurona con la fórmula sin da una señal que cambia periódicamente.
guide.neuron7=La neurona gasta energía en cada tick, así que mantén la cadena corta.
guide.neuron8=En este nivel solo se permiten hojas, músculos, neuronas y colas.
guide.neuron9=Para completar este nivel, construye un cuerpo estrecho con cola, controla la cola con una neurona y nada a través de la rendija hasta la parte inferior del canal.

guide.suctioncup1=La ventosa (Suction cup) es una célula que cambia cuánto se resiste el organismo a moverse por el agua.
guide.suctioncup2=Su agarre lo fija la señal neuronal que recibe: 0 es sin agarre, 1 es el agarre más fuerte y los valores mayores que 1 cuentan como 1.
guide.suctioncup3=El agarre por sí solo no mueve el organismo: suelta la ventosa, tira hacia delante con los músculos, vuelve a agarrar y el organismo se arrastra.
guide.suctioncup4=Para que el agarre se alterne, la señal debe cambiar con el tiempo: encadena una neurona con la fórmula time a una neurona con la fórmula sin.
guide.suctioncup5=Conecta esa señal a las ventosas y a los músculos. Pon a = -1 en el músculo para que se contraiga mientras las ventosas sujetan.
guide.suctioncup6=En este nivel solo se permiten hojas, músculos, neuronas y ventosas. Las colas están prohibidas.
guide.suctioncup7=Llega al final del pasillo con un organismo hecho de estas células.

guide.smooth1=Elige la fórmula sin o cos en una neurona: las dos convierten un valor en una onda suave entre -1 y 1.
guide.smooth2=Sus parámetros son los mismos: a fija la frecuencia, b desplaza la onda a lo largo del eje de entrada y c fija la amplitud.
guide.smooth3=sin empieza en 0 y cos empieza en 1, así que usa cos cuando la señal deba ser alta ya en el instante cero.
guide.smooth4=El truco habitual es meter el tiempo en una neurona sin: su salida sube y baja sin fin sin ningún sensor.
guide.smooth5=En este nivel solo se permiten hojas, músculos, neuronas y colas.
guide.smooth6=Construye un cuerpo con cola o músculos movidos por una onda y recorre el pasillo sinuoso hasta el final.

guide.thresholds1=Elige una fórmula de umbral en una neurona: convierte una entrada suave en una decisión tajante.
guide.thresholds2=La fórmula sigmoid comprime la entrada en 0..1: y = 1/(1+exp(-(ax+b))) + c. a fija la pendiente, b mueve el punto donde sube la curva y c desplaza el resultado.
guide.thresholds3=Las dos fórmulas de escalón devuelven b mientras la entrada está a un lado de a y c al otro: y = b para x <= a (estricta: x < a) e y = c en otro caso.
guide.thresholds4=La fórmula window deja pasar la entrada solo mientras está estrictamente entre a y b; fuera de esa ventana devuelve c.
guide.thresholds5=Un umbral oculta el ruido pequeño y solo reacciona a una señal fuerte, así que un organismo puede seguir nadando y detenerse ante una pared.
guide.thresholds6=En este nivel solo se permiten hojas, músculos, neuronas y colas.
guide.thresholds7=Construye un organismo cuyo movimiento cambie con un umbral, pasa las dos puertas y llega al otro extremo.

guide.timepulse1=Elige la fórmula time, impulse o spike en una neurona: su señal depende del reloj, no de la entrada.
guide.timepulse2=time devuelve el tiempo de simulación en segundos más el índice de la célula en su organismo, así que dos neuronas time nunca empiezan exactamente a la vez.
guide.timepulse3=impulse(a) devuelve 1 durante a segundos después de que su entrada llegue a 1 y luego vuelve a 0. a es la duración del pulso.
guide.timepulse4=spike(a) devuelve 1 durante un solo tick cuando su entrada sube de golpe al menos a, y 0 en otro caso. a es el tamaño del salto.
guide.timepulse5=time da un ritmo, impulse mantiene una acción durante un rato y spike reacciona a un solo suceso, como un toque.
guide.timepulse6=En este nivel solo se permiten hojas, músculos, neuronas y colas. Pasa las tres puertas y llega al final.

guide.memory1=Elige remember o decay en una neurona: le dan memoria de los ticks anteriores.
guide.memory2=remember guarda la última entrada positiva y la sigue devolviendo: una entrada positiva renueva la memoria y una negativa la pone a 0.
guide.memory3=decay mantiene un pico y lo deja caer: una entrada fuerte sube la memoria, luego baja a en cada tick y se queda entre b y c.
guide.memory4=La memoria hace que una señal dure más que el toque que la provocó, algo útil para un músculo que debe seguir tirando después de que un ojo haya dejado de mirar.
guide.memory5=En este nivel solo se permiten hojas, músculos, neuronas y colas. Cruza el pasillo y las dos cámaras hasta el final.

guide.power1=Elige la fórmula de potencia o de valor absoluto en una neurona: cambian la forma de la señal sin recordar nada.
guide.power2=La fórmula de potencia eleva la entrada a a: y = x^a. Con a = 2 una señal débil sigue débil y una fuerte gana; con a = 0.5 ocurre lo contrario.
guide.power3=Una entrada negativa con un exponente fraccionario no tiene potencia real, así que la neurona devuelve 0. La fórmula de valor absoluto lo evita: y = |x|.
guide.power4=El valor absoluto quita el signo, así que una señal que oscila hacia ambos lados se convierte en un empuje en un solo sentido.
guide.power5=En este nivel solo se permiten hojas, músculos, neuronas y colas. Pasa por el centro estrecho del embudo y llega al final.

guide.random1=Elige la fórmula random en una neurona: convierte su entrada en un valor aleatorio repetible entre a y b.
guide.random2=Es un hash de la entrada, no un lanzamiento de moneda: la misma entrada siempre da la misma salida, y una entrada que cambia suavemente parece ruido.
guide.random3=Así todo el mundo sigue siendo determinista y una partida grabada se repite bit a bit.
guide.random4=En este nivel solo se permiten hojas, músculos, neuronas y colas. Avanza entre las paredes dispersas y llega al final.

guide.fat1=La grasa (Fat) es una célula blanda de almacenamiento: guarda hasta 10 de energía, el doble que una hoja.
guide.fat2=Por sí sola no hace nada: no tiene señal, no se mueve y no produce energía.
guide.fat3=La energía fluye por las conexiones físicas desde una célula más llena respecto a su capacidad hacia otra más vacía, así que la grasa toma el excedente de las células que producen o absorben energía y lo devuelve cuando el cuerpo lo necesita.
guide.fat4=Sus conexiones son más blandas de lo normal, así que la grasa también sirve de cojín entre partes duras.
guide.fat5=Pruébalo: deja que un succionador llene una célula de grasa, luego añade un músculo y mira cómo la grasa lo alimenta.
guide.fat6=En este nivel, construye un cuerpo con reserva de grasa y llega al lado derecho del pasillo.

guide.bone1=El hueso (Bone) es el esqueleto del cuerpo: es rígido y sus conexiones son muy rígidas.
guide.bone2=Su propia rigidez es el doble de la normal y sus conexiones son 16 veces más rígidas que las normales, así que el hueso mantiene la forma del cuerpo bajo carga.
guide.bone3=Solo guarda 3 de energía y por sí solo no hace nada: no tiene señal, no se mueve y no produce energía.
guide.bone4=Los huesos son el armazón de mandíbulas, aletas y cuerpos largos; sin ellos los músculos doblarían el cuerpo hasta hacerlo una bola.
guide.bone5=Pruébalo: construye con huesos una mandíbula de dos células, une un músculo de lado a lado y mira cómo la mandíbula se abre y se cierra.
guide.bone6=En este nivel, pasa por la rendija estrecha de la pared y llega al lado derecho.

guide.zygote1=El cigoto (Zygote) es la semilla del organismo: todo genoma empieza con un cigoto.
guide.zygote2=No actúa por sí mismo; la primera etapa del genoma lo divide y lo muta hasta formar el cuerpo.
guide.zygote3=Toma 0.06 de energía por tick de la luz del sol, hasta 10, y no gasta nada en acciones, así que puede esperar a la primera división.
guide.zygote4=Un productor pone un nuevo cigoto cuando se activa, y ese cigoto da lugar a un organismo aparte.
guide.zygote5=Pruébalo: empieza un genoma con un solo cigoto y mira cómo crece antes de la primera división.
guide.zygote6=En este nivel, haz crecer un organismo de 8 células a partir de un solo cigoto.

guide.touchtrigger1=El sensor de contacto (Touch trigger) detecta choques: suma a su señal cada vez que algo lo presiona.
guide.touchtrigger2=El valor añadido es el solapamiento dividido por el radio de la célula, así que un toque ligero da una señal pequeña y un empujón profundo, una grande.
guide.touchtrigger3=Con la suma de entradas por defecto, la entrada se borra en cada tick, así que un contacto constante da una señal constante; la fórmula de la célula la convierte en la salida.
guide.touchtrigger4=Con la fórmula por defecto y = ax + b y a = 1, b = 0, la salida es la propia presión.
guide.touchtrigger5=Pruébalo: pon un sensor de contacto en la nariz, conéctalo a una cola y haz que el organismo se aparte de una pared.
guide.touchtrigger6=En este nivel, recorre el pasillo sinuoso y llega al lado derecho.

guide.controller1=El controlador (Controller) es un sensor de teclas: convierte la pulsación de una tecla en una señal neuronal.
guide.controller2=Elige la tecla en la ventana de la célula: dígitos del 0 al 9, W A S D, las flechas o la barra espaciadora.
guide.controller3=La fórmula recibe 1 mientras la tecla está pulsada y 0 cuando se suelta; la fórmula por defecto y = ax + b con a = 1, b = 0 da exactamente eso.
guide.controller4=Usa la fórmula spike para obtener un pulso corto por pulsación en lugar de una señal que dura mientras la tecla está pulsada.
guide.controller5=Pruébalo: conecta un controlador en W a una cola y dirige el organismo a mano.
guide.controller6=En este nivel, dirige el organismo con las teclas y llega al lado derecho.

guide.chameleon1=El camaleón (Chameleon) es una célula de color: se pinta con el color empaquetado en su señal.
guide.chameleon2=La señal es un número empaquetado: el rojo son los 8 bits más bajos, el verde los 8 siguientes y el azul los 8 siguientes, cada uno de 0 a 255.
guide.chameleon3=Las fórmulas red, green y blue convierten un canal de 0 a 1 en esas partes; súmalas de camino al camaleón.
guide.chameleon4=Deja la fórmula del propio camaleón en y = x (a = 1, b = 0, c = 0) para que pase el número empaquetado sin cambios.
guide.chameleon5=En este nivel tienes que hacer que el organismo nade en la otra dirección; el organismo se mueve en la dirección opuesta al color rojo.

guide.synapse1=La sinapsis (Synapse) es una conexión que aprende: se sitúa entre una célula de entrada y una neurona y cambia su propio peso.
guide.synapse2=Necesita exactamente una conexión de entrada y una de salida, y la de salida debe terminar en una neurona; con cualquier otro cableado la sinapsis se pone roja y se queda en silencio.
guide.synapse3=Su salida es el peso por la entrada, y el peso empieza con un valor aleatorio menor que 0.2.
guide.synapse4=Si la entrada se activa antes que la neurona, el peso crece según la tasa de aprendizaje; si la neurona se activa primero, el peso baja según la tasa de depresión.
guide.synapse5=La tasa de olvido fija lo rápido que se olvida un par de picos antiguo; si el peso llega a 0, la sinapsis muere.
guide.synapse6=Pruébalo: pon una sinapsis entre un sensor de contacto y una neurona que mueve un músculo, y deja que el organismo aprenda a reaccionar al contacto.
guide.synapse7=En este nivel, entrena la sinapsis y cruza el pasillo hasta el lado derecho.

guide.producer1=El productor (Producer) pone un nuevo organismo: cuando se activa, crea un cigoto delante de sí.
guide.producer2=Solo se activa cuando su energía está llena y su señal es al menos 1.
guide.producer3=Tras activarse gasta toda su energía y espera antes de poder poner otro; la espera crece con el número de acciones de células del genoma.
guide.producer4=La cría es un organismo aparte con el mismo genoma, así que un productor puede extender una especie por el mundo.
guide.producer5=Pruébalo: llena un productor con energía de hojas, envía un pulso a su señal y mira cómo aparece un pequeño cigoto delante.
guide.producer6=En este nivel, haz crecer una colonia de 12 células.

guide.sticky1=La célula pegajosa (Sticky) es un pegamento temporal: tira de todo lo que toca.
guide.sticky2=La fuerza la fija su señal neuronal, de 0 a 1; sin señal no hace nada.
guide.sticky3=Funciona con paredes, comida y otros organismos, pero no con las células unidas a su propio cuerpo, porque las células conectadas nunca chocan.
guide.sticky4=El pegamento también amortigua la velocidad relativa, así que una célula pegada no rebota.
guide.sticky5=Pruébalo: pega una célula a una pared, tira con un músculo y luego suelta el pegamento para avanzar arrastrándote.
guide.sticky6=En este nivel, usa el pegamento para superar el zigzag y llegar al lado derecho.

guide.sucker1=El succionador (Sucker) es un filtrador: recoge las partículas de comida que lo tocan.
guide.sucker2=Una partícula dentro de su boca se elimina y se convierte en energía; una partícula justo fuera es atraída hacia la boca.
guide.sucker3=No empuja a otras células, así que se puede meter dentro de un cuerpo o apretar contra una nube de comida.
guide.sucker4=No tiene control neuronal y funciona todo el tiempo.
guide.sucker5=Pruébalo: deja un succionador en una nube de comida y mira cómo sube su energía.
guide.sucker6=En este nivel, recoge comida y construye un organismo de 6 células.

guide.excreta1=El excretor (Excreta) suelta comida: convierte su energía en una pequeña bolita en la dirección a la que mira.
guide.excreta2=Necesita al menos 4 de energía y una señal neuronal positiva; cada bolita cuesta 4 de energía.
guide.excreta3=La bolita toma el color de la célula, así que distintos excretores pueden marcar distintos tipos de comida.
guide.excreta4=Úsalo para alimentar a otros organismos, atraer a un succionador o dejar un rastro de comida.
guide.excreta5=Pruébalo: llena una hoja, conecta una neurona time a un excretor y mira cómo aparece una fila de bolitas.
guide.excreta6=En este nivel, construye un organismo de 8 células y mantenlo alimentado.

guide.pumper1=La bomba (Pumper) pasa energía de otra célula a sí misma al tocarla.
guide.pumper2=Cada toque mueve 0.03 de energía de la otra célula mientras la bomba tenga espacio y la otra célula tenga al menos esa cantidad.
guide.pumper3=No tiene control neuronal ni fórmula: bombea cada vez que choca.
guide.pumper4=Las células conectadas a ella nunca chocan con ella, así que solo vacía células de otros organismos o de partes no conectadas.
guide.pumper5=Pruébalo: aprieta una bomba contra una célula ajena y mira cómo la energía fluye hacia tu cuerpo.
guide.pumper6=En este nivel, construye un organismo de 8 células.

guide.punisher1=El castigador (Punisher) es una célula arma: destruye las células ajenas que lo tocan.
guide.punisher2=Una célula de otro organismo se elimina al instante; las células de su propio organismo y otros castigadores están a salvo.
guide.punisher3=No tiene control neuronal ni coste de energía, así que actúa en cuanto toca a un enemigo.
guide.punisher4=Un castigador puede devorar el cuerpo enemigo célula a célula, pero no alcanza una célula que nunca toca.
guide.punisher5=Pruébalo: embiste otro organismo con un castigador y mira cómo desaparecen sus células.
guide.punisher6=En este nivel, construye un organismo de 8 células con un castigador.

guide.pheromones1=En condiciones normales los organismos no pueden comunicarse entre sí; precisamente por eso surgieron las feromonas.
guide.pheromones2=Las feromonas son sustancias que permiten a los organismos transmitir señales a distancia.
guide.pheromones3=Se extienden despacio hasta alcanzar su radio máximo.
guide.pheromones4=La célula PheromoneEmitter puede producirlas y la célula PheromoneSensor puede detectarlas.
guide.pheromones5=Ahora hay unas 32 feromonas, pero algunas tienen un propósito especial.
guide.pheromones6=La feromona 0 la produce la comida. La feromona 11 se encarga del crecimiento de las células madre. La feromona 18 la producen las células dañadas.
guide.pheromones7=En este nivel hay un organismo sin ojos que percibe la feromona 1 y se mueve hacia ella.
guide.pheromones8=Crea un organismo que produzca la feromona 1 y espera a que el otro organismo nade hacia ti por sí solo.

