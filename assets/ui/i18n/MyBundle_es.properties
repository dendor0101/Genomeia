cell.motor_neuron.description = Motoneurona: envía su salida a cada Muscle de su grupo, sin enlaces neuronales. El grupo son todas las Muscle unidas entre sí y con la MotorNeuron por enlaces físicos en el cuerpo adulto. Su flecha fija la dirección de las fibras: el grupo se contrae y se estira solo a lo largo de la flecha y mantiene su tamaño a lo ancho. La señal actúa como si un enlace neuronal llegara a cada Muscle; el grupo no se divide aunque el cuerpo se rompa.
guide.lab.motor_neuron=Dos cuerpos de Muscle con una MotorNeuron en el centro, sin enlaces neuronales. La flecha de la izquierda va a lo largo del cuerpo y la de la derecha a lo ancho: con la misma señal el cuerpo izquierdo cambia de ancho y el derecho de alto. La Muscle detrás de la Leaf a la derecha no está en el grupo y no reacciona.
