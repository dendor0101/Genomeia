# About the game
about.title = Acerca del juego
about.intro.title = Genomeia - vida a partir de células
about.intro = Un juego de experimentación biológica sobre la creación de organismos y la evolución. Construye cuerpos con células en el editor de genomas, configura conexiones neuronales y comportamientos, libera criaturas en el mundo y observa cómo interactúan. Experimenta con el movimiento, la alimentación, las feromonas y el aprendizaje neuronal.\nEl juego está en alfa temprana y en desarrollo activo. Su código es abierto; tus ideas, organismos e informes de errores ayudan a mejorar Genomeia.
about.community = Noticias, comunidad y código fuente
about.link.youtube = YouTube - vídeos de desarrollo
about.link.discord = Discord - comunidad
about.link.tiktok = TikTok - vídeos cortos
about.link.itch = itch.io - descargar el juego
about.link.github = GitHub - código fuente
about.link.donate = Apoyar en itch.io
about.roadmap = Planes para 0.2.5
about.roadmap.note = Son líneas de desarrollo, no fechas prometidas; el alcance puede cambiar.
about.plan.1 = 1. Gran mejora del editor: depurar redes neuronales, iniciar organismos en cualquier etapa, probar variantes de crecimiento y colocar células con un clic eligiendo el progenitor automáticamente. Por ahora, el editor definirá la forma y el crecimiento como alternativa a los subgenomas y la morfogénesis.
about.plan.2 = 2. Editor cómodo de mapas y niveles: texto, colocación masiva de partículas y células, condiciones y lógica mediante código o diagramas de flujo.
about.plan.3 = 3. Compatibilidad con mods.
about.plan.4 = 4. Versión web.
about.plan.5 = 5. Versiones para iOS y macOS.
about.plan.6 = 6. Servidor para ampliar la biblioteca de genomas.
about.plan.7 = 7. Células que emitan sonidos y propaguen ondas sonoras mediante el sistema de feromonas.
about.plan.8 = 8. Célula sin colisiones para crear cavidades y almacenar sustancias como plasma o ácido gástrico.
about.plan.9 = 9. Visión más realista.
about.donate.note = En itch.io puedes elegir una aportación al descargar. Para criptomonedas, utiliza una dirección o un código QR de abajo; la red figura junto al nombre de la cartera. ¡Gracias por tu apoyo!

