cell.leaf.description = Recoge energía del sol hasta llenarse. La principal fuente de alimento del organismo.
cell.fat.description = Almacén: guarda hasta 10 de energía, el doble que una célula normal. Blanda.
cell.bone.description = Una célula dura con enlaces muy rígidos: el armazón del cuerpo. Guarda poca energía.
cell.tail.description = Nada: con una señal de 0 a 1 empuja al organismo en sentido contrario a su flecha. Acelera y frena suavemente.
cell.controller.description = Sensor de una tecla del jugador. Mientras la tecla elegida está pulsada, la señal es 1, si no 0; luego pasa por la fórmula de la célula.
cell.muscle.description = Se contrae y se estira con una señal de -1 a 1: sus enlaces con las vecinas se acortan o alargan hasta la mitad.
cell.sucker.description = Atrae la comida cercana y la absorbe al tocarla, ganando energía. Otras partículas la atraviesan.
cell.excreta.description = Dirigida. Mientras la señal es mayor que 0 y hay energía, suelta comida de su color a lo largo de su flecha.
cell.punisher.description = Mata células de otros organismos al tocarlas, salvo Bone y otros Punisher. Cada muerte le cuesta toda su energía.
cell.pumper.description = Al tocar una célula ajena le quita energía hasta llenarse.
cell.zygote.description = La primera célula del organismo, de ella crece todo el cuerpo. Recoge poco a poco energía del sol.
cell.producer.description = Reproducción: con la energía llena y una señal de 1, suelta de vez en cuando un cigoto del que crece un organismo nuevo con el mismo genoma.
cell.neuron.description = Junta las señales de entrada, calcula su salida con una fórmula (y = ax + b, sin, cos, sigmoid y otras) y la pasa.
cell.suction_cup.description = Se agarra a la superficie con una señal de 0 a 1: cuanto más fuerte la señal, más firme el agarre.
cell.sticky.description = Con una señal de 0 a 1 atrae y sujeta las células que toca.
cell.chameleon.description = Cambia de color con la señal: 0 es negro, 1 es el color de los canales R, G, B elegidos (solo R es rojo, los tres son blanco).
cell.eye.description = Sensor dirigido: mira a lo largo de su flecha y da el brillo de lo primero que ve en los canales de color elegidos.
cell.touch_trigger.description = Sensor de contacto: cuanto más lo aprietan, mayor es la señal.
cell.synapse.description = Un enlace que aprende: pasa la señal a una Neuron con un peso y cambia el peso cuando la entrada y la neurona se activan juntas. Necesita exactamente un enlace de entrada y uno de salida hacia una Neuron.
cell.pheromone_emitter.description = Suelta una feromona del tipo elegido cuando la señal sube por encima de 0.
cell.pheromone_sensor.description = Huele la feromona del tipo elegido cerca: cuanto más cerca y más fresca, mayor la señal (hasta 1).

# --- Стенд формул ---
guide.tab.formulas = Fórmulas
guide.cell.formulasLink = Fórmulas de la neurona
guide.formulas.text = Aquí puedes probar una sola neurona. En cada tick junta sus señales de entrada en un número x (las suma o las multiplica), calcula la salida y con su fórmula y la pasa por sus enlaces. Mueve los deslizadores: el gráfico y los números cambian al instante.
guide.formulas.inputs = Señales de entrada
guide.formulas.input = Entrada {0}
guide.formulas.addInput = Añadir una entrada
guide.formulas.removeInput = Quitar una entrada
guide.formulas.neuron = Neurona
guide.formulas.curve = La línea amarilla es la salida y para cualquier entrada x de -10 a 10. La marca es la entrada y la salida actuales.
guide.formulas.overTime = Esta fórmula no depende solo de x, sino también del tiempo o de la memoria de la neurona, así que el gráfico muestra los últimos 5 segundos: la línea azul es la entrada x, la amarilla es la salida y.
guide.formulas.all = Todas las fórmulas
formula.linear.description = Una recta: y = a * x + b. a es la pendiente (cuánto amplificar la señal, un signo menos la invierte), b es el desplazamiento. Con a = 1 y b = 0 la neurona solo pasa la señal.
formula.sin.description = Una onda seno: y = c * sin(a * x + b). c es la amplitud (con c = 0 la salida siempre es 0), a es la frecuencia, b el desfase. Junto con un reloj (y = t) crea un ritmo.
formula.cos.description = Una onda coseno: igual que el seno, desplazada un cuarto de periodo. y = c * cos(a * x + b). Con x = 0 la salida es c.
formula.sigmoid.description = Un escalón suave de 0 a 1: y = 1 / (1 + e^-(a * x + b)) + c. a es la pendiente, b dónde está el escalón, c lo sube o baja. Útil para convertir cualquier señal en «sí / no» sin un salto brusco.
formula.step_le.description = Un escalón: si x <= a la salida es b, si no c. Un umbral de activación.
formula.step_lt.description = Un escalón: si x < a la salida es b, si no c. Solo se diferencia del anterior justo en el umbral x = a.
formula.time.description = Un reloj: la salida es el tiempo del mundo en segundos, la entrada no importa. En el juego se le suma el número de la célula, así que cada neurona reloj tiene su propia fase. Conéctala a un seno o coseno para obtener un ritmo.
formula.impulse.description = Un impulso: cuando la entrada x llega a 1 o más, la neurona da 1 durante a segundos y luego 0. Mientras dura el impulso, nuevas entradas no lo alargan.
formula.in_range.description = Una ventana: si x está entre a y b (sin incluir los extremos), la salida es x, si no c. Deja pasar solo señales de la fuerza adecuada.
formula.pow.description = Una potencia: y = x elevado a a. Una x negativa con potencia fraccionaria no está definida, entonces la salida es 0.
formula.remember.description = Memoria: una entrada x positiva se recuerda y sale por la salida. Mientras la entrada es 0, la neurona conserva el último número. Una entrada negativa borra la memoria y la salida pasa a 0.
formula.random.description = Un número aleatorio de a a b que depende de la entrada: la misma x siempre da la misma y, y las x vecinas dan valores muy distintos. Dale un reloj para obtener ruido.
formula.energy.description = Cuán llena está la célula: su energía dividida por el máximo, de 0 a 1. La entrada no importa. En el banco de pruebas la neurona está a la mitad.
formula.controller.description = La tecla del jugador número a: mientras está pulsada la salida es 1, si no repite la entrada x. Obsoleta: para el control existe la célula Controller.
formula.decay.description = Un pico con caída: una entrada fuerte (mayor que b y que el valor actual) se recuerda, y luego en cada tick la salida baja a hasta llegar a b. La salida siempre está entre b y c. Un estallido corto se vuelve una cola larga.
formula.spike.description = Un detector de saltos: la salida es 1 solo en el tick en que la entrada creció de golpe a o más, si no 0. Una señal constante no da nada.
formula.abs.description = Valor absoluto: y = |x|. Una señal negativa se vuelve positiva.
formula.links_amount.description = Cuántos enlaces físicos tiene la célula con sus vecinas. La entrada no importa. Así la célula sabe si está en el borde del cuerpo o dentro. En el banco de pruebas la neurona tiene 4 enlaces.
