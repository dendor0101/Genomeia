cell.delay.description = Línea de retardo: entrega su entrada de hace el número elegido de ticks. Sustituye una cadena de neuronas que solo sirven para retrasar una señal, por ejemplo en un detector de movimiento: retrasa un sensor y multiplícalo por otro.
