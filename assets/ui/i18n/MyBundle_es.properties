guide.tab.tutorial = Tutorial
guide.tab.cells = Células
guide.tutorial.text = El tutorial se hace dentro del editor de genoma. A la derecha verás un panel con la tarea: qué hacer y cómo. La tarea se cumple sola en cuanto la haces, luego pulsa «Siguiente». Al final armarás tu propio Frankenstein: un organismo que nada con la tecla W, mueve sus músculos y parpadea.
