guide.lab.leaf=Cambia la luz y observa la energía de Leaf. Vacíala para repetir.
guide.lab.fat=Leaf alimenta a la Fat conectada. Vacía Fat y observa cómo se recarga.
guide.lab.bone=Tira de un extremo del cuerpo de Bone y luego del de Fat. Compara cómo se deforman.
guide.lab.tail=Envía una señal a Tail para que arrastre a Leaf. El control de dirección gira Tail.
guide.lab.controller=Elige W, A, S o D y mantén esa tecla o el botón de abajo. Controller envía una señal neuronal a Tail.
guide.lab.muscle=La señal -1 contrae Muscle; +1 la estira. Tira de un extremo y compara la anchura.
guide.lab.sucker=Añade comida y acerca Sucker. También puedes arrastrar la comida.
guide.lab.excreta=Una señal positiva hace que Excreta produzca comida. Cero detiene la producción.
guide.lab.punisher=Acerca Punisher a Fat. Necesita toda su energía para matar; Leaf ayuda a recargarla. Bone está protegida.
guide.lab.pumper=Empuja la Fat derecha contra Pumper para alimentar a la Fat conectada de la izquierda. La donante muere cuando su energía baja de cero. Entonces puedes añadir otra.
guide.lab.zygote=Zygote crece hasta formar dos Leaf. Quita la luz al principio para retrasar el crecimiento.
guide.lab.producer=+1 activa Producer; 0 detiene nuevos nacimientos. Leaf lo alimenta y sus descendientes forman dos Leaf.
guide.lab.neuron=Cambia la entrada, la fórmula y los coeficientes de Neuron. La salida está bajo la escena; los gráficos están en Fórmulas. Con la fórmula lif pon a en 0.1: la neurona empieza a acumular la entrada y a lanzar picos.
guide.lab.suction_cup=Tira de SuctionCup con señal 0 y después +1. Una señal mayor dificulta moverla.
guide.lab.sticky=Junta Sticky con Fat y aplica +1. Intenta separarlas y repite con 0.
guide.lab.chameleon=La señal fija el brillo de Chameleon. Elige R, G o B; R y G juntos dan amarillo.
guide.lab.eye=Gira Eye hacia las células de colores. La salida es el brillo medio de los canales RGB elegidos del primer objetivo.
guide.lab.touch_trigger=Empuja Fat contra TouchTrigger. Cuanto más se solapen, mayor será la señal.
guide.lab.synapse=La Neuron izquierda manda un pico cada 120 ticks a través de Synapse a la Neuron derecha (lif, umbral 0.6). El maestro hace que la neurona derecha se active el número de ticks elegido después de la entrada: un retraso positivo refuerza Synapse, uno negativo la debilita. Cuando el peso pase de 0.6, apaga el maestro: la neurona derecha se activará sola con la entrada - la sinapsis ha aprendido.
guide.lab.pheromone_emitter=Activa PheromoneEmitter y acerca PheromoneSensor. Sus canales deben coincidir.
guide.lab.pheromone_sensor=Mueve PheromoneSensor respecto a PheromoneEmitter. Cambia su canal: no detecta otros canales.
guide.lab.drain=Descargar la célula estudiada
guide.lab.add.sucker=Añadir comida
guide.lab.add.punisher=Añadir objetivo
guide.lab.add.pumper=Añadir Fat
