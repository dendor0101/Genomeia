tutorial.progress = Tutorial, paso {0} de {1}
tutorial.next = Siguiente
tutorial.finish = Terminar
tutorial.next.locked = Primero cumple las tareas de este paso

tutorial.welcome.title = Editor de genoma
tutorial.welcome.text = Un organismo crece a partir de una sola célula, el cigoto. El genoma es una lista de etapas de crecimiento. En cada etapa cualquier célula puede dividirse (aparece una célula nueva a su lado) o mutar (cambiar de tipo, color o ajustes).\n\nLas tareas del paso están abajo en este panel. Cuando las cumples todas, se activa el botón «Siguiente».\n\nPC: pasa el ratón sobre cualquier botón para ver una pista. Teléfono: mantén pulsado el botón. Las pistas se desactivan en los ajustes.

tutorial.camera.title = Cámara
tutorial.camera.text = PC: mantén el botón izquierdo del ratón en un lugar vacío y arrastra para mover la cámara. La rueda del ratón acerca y aleja.\nTeléfono: arrastra un dedo por un lugar vacío y pellizca con dos dedos para acercar.

tutorial.timeline.title = Etapas de crecimiento
tutorial.timeline.text = Abajo está la línea de tiempo. Cada paso de ella es una etapa de crecimiento. Los botones «<» y «>» van una etapa atrás y adelante, «<<» y «>>» saltan al inicio y al final. El deslizador también mueve el tiempo. En PC, Espacio salta al final.\n\nEn la primera etapa el cigoto ya se divide y crea una hoja. Una célula semitransparente es la que aparecerá en la siguiente etapa. Pasa a la siguiente etapa con el botón «>».

tutorial.first_divide.title = Primera división
tutorial.first_divide.text = Pulsa una célula (PC: botón izquierdo, teléfono: toque). Se abre la ventana «Dividir o mutar»: elige «Dividir».\n\nArriba en la ventana de la célula está la lista de tipos: elige cómo será la célula nueva y pulsa «Dividir». La célula nueva aparece al lado, semitransparente: crecerá en la siguiente etapa.

tutorial.divide_leaf.title = Divide 5 hojas
tutorial.divide_leaf.text = La hoja (Leaf) recoge energía del sol: alimenta a todo el organismo.\n\nUna célula se divide solo una vez por etapa. Para seguir dividiendo, pasa a la siguiente etapa con «>»: allí hay más células y cada una puede dividirse otra vez.

tutorial.repeat.title = Repetir una acción
tutorial.repeat.text = No hace falta abrir la ventana cada vez: la última acción se puede repetir.\nPC: haz clic derecho en una célula.\nTeléfono: activa arriba el botón «Realizar última acción» y toca células; luego desactívalo.\n\nSe repite lo último que hiciste: una división con los mismos ajustes, una mutación, un cambio o un borrado.

tutorial.move.title = Mover una célula
tutorial.move.text = Una célula recién añadida (semitransparente, en su propia etapa) se puede mover: púlsala y arrástrala. Al soltarla, la célula ocupa el nuevo lugar y sus enlaces con las vecinas se recalculan.\n\nEl botón «Simetría» de arriba define cómo se colocan las células nuevas y movidas: en espejo o en una cuadrícula.

tutorial.undo.title = Deshacer y rehacer
tutorial.undo.text = ¿Te equivocaste? No pasa nada. El botón «Deshacer» de abajo (Ctrl+Z en PC) deshace la última edición del genoma, «Rehacer» (Ctrl+Y) la devuelve.\n\nDeshaz algo y devuélvelo.

tutorial.mutate.title = Mutación: 2 Leaf en Fat
tutorial.mutate.text = Una mutación cambia una célula que ya creció. Pulsa una célula Leaf normal (no semitransparente). Si aparece una elección, elige «Mutar». En la lista de tipos elige Fat y pulsa «Mutar».\n\nLa grasa (Fat) guarda el doble de energía. La ventana de mutación muestra a la izquierda la célula actual y a la derecha en qué se convertirá. El clic derecho (repetir) también funciona.

tutorial.color.title = Color de la célula
tutorial.color.text = La ventana de la célula (al dividir, mutar o cambiar) tiene el botón «Color de la célula». Elige un color y confirma, luego pulsa «Dividir», «Mutar» o «Cambiar».\n\nLos ojos de otros organismos (la célula Eye) ven los colores, y un camaleón puede cambiar el suyo.

tutorial.remove.title = Borrado
tutorial.remove.text = Se puede borrar una célula que aparece en esta etapa: pulsa una célula semitransparente y se abre una ventana con «Cambiar» y «Eliminar». Eliminar borra la célula y todo lo que crece de ella después.\n\nPara cancelar una mutación, pulsa la célula en la etapa en la que muta y pulsa «Cancelar mutación».

tutorial.neural_links.title = Enlaces neurales
tutorial.neural_links.text = Un enlace neural lleva una señal de una célula a otra.\nPC: mantén Ctrl, haz clic en la célula de origen y luego en la de destino. La flecha muestra hacia dónde va la señal. Suelta Ctrl.\nTeléfono: activa arriba el botón «Enlace neural», toca el origen, luego el destino, y desactiva el botón.\n\nTraza los enlaces uno tras otro, en cadena: de la célula A a la B, de la B a la C, de la C a la D. La señal puede viajar así: en cada tick avanza un enlace, y de A a D tarda 3 ticks.

tutorial.link_color.title = Color y borrado del enlace
tutorial.link_color.text = El botón «Color del enlace neural» de arriba define el color de los enlaces nuevos, para seguir mejor el cableado. Elige un color y traza un enlace.\n\nPara borrar un enlace, trázalo otra vez entre las mismas células (Ctrl + clic en el origen y luego en el destino).

tutorial.signals.title = Cómo funcionan las señales
tutorial.signals.text = En cada tick una célula neural junta sus señales de entrada x: las suma o las multiplica («Adición / Multiplicación»). Luego calcula y con su fórmula, por ejemplo y = ax + b, y pasa y por sus enlaces.\n\nLos sensores crean la señal por sí mismos: Controller (una tecla del jugador), Eye (lo que ve), Touch trigger (el contacto), Pheromone sensor (el olor). Los actuadores hacen algo con la señal: Tail nada, Muscle se contrae, Chameleon cambia de color.\n\nAhora armemos un Frankenstein. La forma no importa, solo de qué está hecho y cómo está conectado.

tutorial.controller.title = Control: Controller y Tail
tutorial.controller.text = Crea una célula Controller (dividiendo o mutando). En su ventana elige una tecla, W por defecto. Mientras la tecla está pulsada, el Controller da 1.\n\nCrea una célula Tail. Es una célula dirigida: el deslizador «Ángulo» gira su flecha. La cola empuja al organismo en sentido contrario a la flecha.\n\nConecta el Controller con la Tail con un enlace neural: Ctrl + clic en el Controller y luego en la Tail.

tutorial.clock.title = Reloj: neuronas t y cos
tutorial.clock.text = Crea una célula Neuron y dale la fórmula «y = t»: da el tiempo en segundos.\n\nCrea una segunda Neuron con la fórmula «y = c * cos(ax + b)». Pon a = 5 (frecuencia) y c = 1 (amplitud): con c = 0 la salida siempre es 0.\n\nConecta la neurona t con la neurona cos: obtienes una señal que oscila de -1 a 1.

tutorial.muscles.title = Músculos
tutorial.muscles.text = Crea al menos dos células Muscle. Un músculo se contrae o se estira con una señal de -1 a 1.\n\nTraza enlaces neurales desde la neurona cos hasta los músculos (también vale en cadena: la señal pasa a través del músculo). El organismo empieza a moverse al ritmo.

tutorial.chameleon.title = Intermitente: Chameleon
tutorial.chameleon.text = Crea una célula Chameleon y elige sus canales de color, por ejemplo solo R. Con señal 0 es negra, con señal 1 tiene el color elegido (R+G es amarillo, los tres son blanco).\n\nLleva hasta ella la señal de la neurona cos: el camaleón empieza a parpadear.

tutorial.frankenstein.title = Frankenstein
tutorial.frankenstein.text = Comprobemos todo a la vez: si algo se rompió mientras terminabas lo demás, las tareas lo mostrarán.\n\nGuarda el genoma: botón «Guardar Genoma» arriba, escribe un nombre y pulsa «Guardar en archivo».

tutorial.finish.title = ¡Listo!
tutorial.finish.text = Has creado un organismo que se controla con una tecla, se mueve y parpadea.\n\nCómo probarlo: «Guardar Genoma» y luego «Guardar y probar». En la simulación activa el botón «Controller Keys» y mantén W.\n\nCada célula está descrita en la Guía, pestaña «Células». Pulsa «Terminar» para volver al menú.

