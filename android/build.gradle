
buildscript {
  repositories {
    mavenCentral()
    google()
  }
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
  namespace = "io.github.some_example_name"
  compileSdk 36
  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.setSrcDirs(['src/main/java', 'src/main/kotlin'])
      aidl.setSrcDirs(['src/main/java', 'src/main/kotlin'])
      renderscript.setSrcDirs(['src/main/java', 'src/main/kotlin'])
      res.setSrcDirs(['res'])
      assets.setSrcDirs(['../assets'])
      jniLibs.setSrcDirs(['libs'])
    }
  }
  packagingOptions {
		resources {
			excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES',
                   'META-INF/dependencies.txt', '**/*.gwt.xml']
			pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/license.txt', 'META-INF/LGPL2.1',
                     'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/notice.txt']
		}
  }
  defaultConfig {
    applicationId 'io.github.some_example_name'
    minSdkVersion 21
    targetSdkVersion 36
    versionCode 1
    versionName "1.0"
    manifestPlaceholders = [appLabel: '@string/app_name']
  }
  compileOptions {
    sourceCompatibility "21"
    targetCompatibility "21"
    coreLibraryDesugaringEnabled = true
  }
  buildTypes {
    shaderTest {
      initWith debug
      applicationIdSuffix '.shadertest'
      versionNameSuffix '-shader-test'
      manifestPlaceholders = [appLabel: 'Genomeia Shader Test']
      matchingFallbacks = ['debug']
      signingConfig signingConfigs.debug
    }
    // Стенд замера настоящей игры на телефоне (src/perf, PhonePerfLauncher). Ставится рядом с игрой.
    // Не отлаживаемая: в отлаживаемом приложении ART не встраивает методы, и замер врал бы.
    perf {
      initWith debug
      debuggable false
      applicationIdSuffix '.perf'
      versionNameSuffix '-perf'
      manifestPlaceholders = [appLabel: 'Genomeia Perf']
      matchingFallbacks = ['debug']
      signingConfig signingConfigs.debug
    }
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), 'proguard-rules.pro'
    }
    // Проверка релизной сборки на телефоне (R8 и всё остальное — как у release), но подписана отладочным ключом и
    // ставится рядом с игрой: установленную игру игрока не трогает. Со стендом замера (src/perf) — та же сцена и тот
    // же хэш мира, что у perf, но после R8: am start -n io.github.some_example_name.rc/io.github.some_example_name
    // .android.PhonePerfLauncher … (ключи — в PhonePerfLauncher).
    releaseCheck {
      initWith release
      applicationIdSuffix '.rc'
      versionNameSuffix '-rc'
      manifestPlaceholders = [appLabel: 'Genomeia RC']
      matchingFallbacks = ['release']
      signingConfig signingConfigs.debug
    }
  }
  sourceSets {
    releaseCheck {
      java.srcDirs += ['src/perf/java']
      manifest.srcFile 'src/perf/AndroidManifest.xml'
    }
  }

  kotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)

}

repositories {
  // needed for AAPT2, may be needed for other tools
  google()
}

configurations { natives }

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  implementation 'androidx.core:core:1.13.1'

  implementation project(':core')

  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

  implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
  implementation "games.spooky.gdx:gdx-nativefilechooser-android:2.4.0"

}

// Called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
tasks.register('copyAndroidNatives') {
  doFirst {
    file("libs/armeabi-v7a/").mkdirs()
    file("libs/arm64-v8a/").mkdirs()
    file("libs/x86_64/").mkdirs()
    file("libs/x86/").mkdirs()

    configurations.natives.copy().files.each { jar ->
      def outputDir = null
      if(jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
      if(jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
      if(jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
      if(jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
      if(outputDir != null) {
        copy {
          from zipTree(jar)
          into outputDir
          include "*.so"
        }
      }
    }
  }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
  packageTask.dependsOn 'copyAndroidNatives'
}

// ФИЗИКА НА RUST ДЛЯ ТЕЛЕФОНОВ (RUST_PORT.md, «Rust в игре»): библиотека arm64-v8a кладётся в APK рядом с natives libGDX,
// лаунчер включает движок Rust, если она загрузилась (AndroidLauncher, RustEngine). Нет cargo или NDK, или -PnoRust —
// APK без неё: игра на Kotlin с теми же битами. armeabi-v7a и x86 без Rust — тоже на Kotlin.
evaluationDependsOn(':physics')
def physicsProject = project(':physics')
if (!project.hasProperty('noRust') && physicsProject.ext.has('rustAndroidAvailable') && physicsProject.ext.rustAndroidAvailable) {
  tasks.named('copyAndroidNatives') {
    dependsOn ':physics:cargoBuildAndroid'
    doLast {
      copy {
        from physicsProject.ext.physicsAndroidLib
        into file('libs/arm64-v8a')
      }
    }
  }
} else {
  logger.lifecycle('APK без физики на Rust: нет cargo или NDK (или -PnoRust) — игра на телефоне пойдёт на Kotlin')
  // Прежняя сборка могла оставить библиотеку в libs/ (папка не в git): без неё APK обязан быть честно без Rust.
  tasks.named('copyAndroidNatives') { doLast { delete file('libs/arm64-v8a/libgenomeia_physics_jni.so') } }
}

tasks.register('run', Exec) {
  def path
  def localProperties = project.file("../local.properties")
  if (localProperties.exists()) {
    Properties properties = new Properties()
    localProperties.withInputStream { instr ->
      properties.load(instr)
    }
    def sdkDir = properties.getProperty('sdk.dir')
    if (sdkDir) {
      path = sdkDir
    } else {
      path = "$System.env.ANDROID_SDK_ROOT"
    }
  } else {
    path = "$System.env.ANDROID_SDK_ROOT"
  }

  def adb = path + "/platform-tools/adb"
  commandLine "$adb", 'shell', 'am', 'start', '-n', 'io.github.some_example_name/io.github.some_example_name.android.AndroidLauncher'
}

eclipse.project.name = appName + "-android"
