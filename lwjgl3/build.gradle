
buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath "io.github.fourlastor:construo:2.1.0"
    if(enableGraalNative == 'true') {
      classpath "org.graalvm.buildtools.native:org.graalvm.buildtools.native.gradle.plugin:0.9.28"
    }
  }
}
plugins {
  id "application"
}
apply plugin: 'io.github.fourlastor.construo'
apply plugin: 'org.jetbrains.kotlin.jvm'


import io.github.fourlastor.construo.Target

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
application.mainClass = 'io.github.some_example_name.lwjgl3.Lwjgl3Launcher'
application.applicationName = appName
eclipse.project.name = appName + '-lwjgl3'
java.sourceCompatibility = 21
java.targetCompatibility = 21
if (JavaVersion.current().isJava9Compatible()) {
        compileJava.options.release.set(21)
}
kotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)

dependencies {
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
  implementation project(':core')
  // Сущности симуляции держат списки fastutil, а у core он implementation — без этой строки
  // проверки из verification (saveRoundTrip) не видят типов aliveList. В сборку не добавляет ничего:
  // в рантайме он и так приходит через core.
  implementation "it.unimi.dsi:fastutil:8.5.16"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-backend-lwjgl3:$graalHelperVersion"

  }
  // Forces LWJGL3 to use at least $lwjgl3Version, currently 3.4.1, to avoid warnings on Java 25 and up.
  constraints{
    implementation("org.lwjgl:lwjgl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-glfw:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-jemalloc:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-openal:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-opengl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-stb:$lwjgl3Version")
  }
}

def os = System.properties['os.name'].toLowerCase(Locale.ROOT)

run {
  workingDir = rootProject.file('assets').path
// You can uncomment the next line if your IDE claims a build failure even when the app closed properly.
  //setIgnoreExitValue(true)
  jvmArgs += "--enable-native-access=ALL-UNNAMED"
  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
// Прокидывает -Dgenomeia.* из командной строки Gradle в JVM игры:
// gradlew :lwjgl3:run -Dgenomeia.start=GoWorldEditor -Dgenomeia.screenshot=shot.png
  System.properties.each { key, value ->
    if (key.toString().startsWith('genomeia.')) systemProperty(key.toString(), value)
  }
}

jar {
// sets the name of the .jar file this produces to the name of the game or app, with the version after.
  archiveFileName.set("${appName}-${projectVersion}.jar")
// the duplicatesStrategy matters starting in Gradle 7.0; this setting works.
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
// these "exclude" lines remove some unnecessary duplicate files in the output JAR.
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
// setting the manifest makes the JAR runnable.
// enabling native access helps avoid a warning when Java 24 or later runs the JAR.
// setting Multi-Release to true allows LWJGL3 to use different classes on recent Java versions.
  manifest {
    attributes 'Main-Class': application.mainClass, 'Enable-Native-Access': 'ALL-UNNAMED', 'Multi-Release': 'true'
  }
// this last step may help on some OSes that need extra instruction to make runnable JARs.
  doLast {
    file(archiveFile).setExecutable(true, false)
  }
}

// Builds a JAR that only includes the files needed to run on macOS, not Windows or Linux.
// The file size for a Mac-only JAR is about 7MB smaller than a cross-platform JAR.
tasks.register("jarMac") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-mac.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dll", "**/*.so",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

// Builds a JAR that only includes the files needed to run on Linux, not Windows or macOS.
// The file size for a Linux-only JAR is about 5MB smaller than a cross-platform JAR.
tasks.register("jarLinux") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-linux.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**", "**/*.dll", "**/*.dylib",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

// Builds a JAR that only includes the files needed to run on Windows, not Linux or macOS.
// The file size for a Windows-only JAR is about 6MB smaller than a cross-platform JAR.
tasks.register("jarWin") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-win.jar")
  jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dylib", "**/*.so",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

construo {
  // name of the executable
  name.set(appName)
  // human-readable name, used for example in the `.app` name for macOS
  humanName.set(appName)
  jlink {
    guessModulesFromJar.set(false)
    // You may need to add more modules, as needed.
    modules.addAll("java.base", "java.management", "java.desktop", "jdk.unsupported")
  }

  targets.configure {
    register("linuxX64", Target.Linux) {
      architecture.set(Target.Architecture.X86_64)
      jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_linux_hotspot_21.0.10_7.tar.gz")
      // Linux does not currently have a way to set the icon on the executable
    }
    register("macM1", Target.MacOs) {
      architecture.set(Target.Architecture.AARCH64)
      jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.10_7.tar.gz")
      // macOS needs an identifier
      identifier.set("io.github.some_example_name." + appName)
      // Optional: icon for macOS, as an ICNS file
      macIcon.set(project.file("icons/logo.icns"))
    }
    register("macX64", Target.MacOs) {
      architecture.set(Target.Architecture.X86_64)
      jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_mac_hotspot_21.0.10_7.tar.gz")
      // macOS needs an identifier
      identifier.set("io.github.some_example_name." + appName)
      // Optional: icon for macOS, as an ICNS file
      macIcon.set(project.file("icons/logo.icns"))
    }
    register("winX64", Target.Windows) {
      architecture.set(Target.Architecture.X86_64)
      // Optional: icon for Windows, as a PNG
      icon.set(project.file("icons/logo.png"))
      jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.10%2B7/OpenJDK21U-jdk_x64_windows_hotspot_21.0.10_7.zip")
      // Uncomment the next line to show a console when the game runs, to print messages.
      //useConsole.set(true)
    }
  }
}

// Equivalent to the jar task; here for compatibility with gdx-setup.
tasks.register('dist') {
  dependsOn 'jar'
}

distributions {
  main {
    contents {
      into('libs') {
        project.configurations.runtimeClasspath.files.findAll { file ->
          file.getName() != project.tasks.jar.outputs.files.singleFile.name
        }.each { file ->
          exclude file.name
        }
      }
    }
  }
}

startScripts.dependsOn(':lwjgl3:jar')
startScripts.classpath = project.tasks.jar.outputs.files

// Helps if debugging on Linux with an Nvidia GPU.
// This means StartupHelper won't try to restart the JVM, which can prevent debugging.
// This only applies to Gradle tasks, not main methods debugged when launching a main() method directly.
// As a more general solution, set the environment variable __GL_THREADED_OPTIMIZATIONS to 0 globally, on Linux
// machines with Nvidia GPUs where you need to debug LWJGL3 apps and games.
// You can also set __GL_THREADED_OPTIMIZATIONS to 0 in run configurations, which you would need per main() method.
// StartupHelper will still restart the JVM to set this environment variable when run as a distributable JAR, which is
// a good thing for end users. They won't need to ever set the debug-specific environment variable.
tasks.withType(JavaExec.class).configureEach {
  environment("__GL_THREADED_OPTIMIZATIONS", 0)
}

if(enableGraalNative == 'true') {
  apply from: file("nativeimage.gradle")
}


// Лаунчеры стенда компилируются отдельно: библиотека и её проверки не входят в JAR игры.
// main.output даёт StartupHelper, но не подтягивает зависимости основной игры в стенд.
sourceSets {
  lab {
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output + files(rootProject.file('assets'))
  }
}
dependencies {
  labImplementation project(':physics-lab')
  labImplementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  labRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}


// Регрессия рецепта мира: gradlew :lwjgl3:worldSpecCheck
// Ненулевой код, если карта по WorldSpec разошлась с картой редактора.
tasks.register('worldSpecCheck', JavaExec) {
  group = 'verification'
  description = 'Совпадает ли карта по рецепту с картой на экране редактора'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.verification.WorldSpecCheckKt'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8'
}

// Регрессия сохранения мира: gradlew :lwjgl3:saveRoundTrip
// Игра в окне сохраняет мир, загружает его и сверяет состояние побайтно; ненулевой код — регрессия.
// -Pkeep оставляет файл сохранения в maps/.
tasks.register('saveRoundTrip', JavaExec) {
  group = 'verification'
  description = 'Сохранение и загрузка мира восстанавливают его состояние побайтно'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.verification.SaveRoundTripKt'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
  if (project.hasProperty('keep')) systemProperty 'keep', 'true'
  if (project.hasProperty('loadSlot')) systemProperty 'saveRoundTrip.load', project.property('loadSlot')
}

// Перевод старых JSON-геномов в .genome с запеканием из редактора: gradlew :lwjgl3:genomeJsonCheck
// Каждый файл переводится тем же путём, что импорт в игре, и сверяется с «открыть в редакторе и
// сохранить» побайтно; ненулевой код — перевод не совпал. -Pfrom=каталог с JSON, -Pto=куда класть.
tasks.register('genomeJsonCheck', JavaExec) {
  group = 'verification'
  description = 'Старые JSON-геномы переводятся в .genome так же, как их сохранил бы редактор'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.verification.GenomeJsonCheckKt'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
  args = [project.findProperty('from') ?: 'core/src/test/resources/legacy-genomes', project.findProperty('to') ?: 'lwjgl3/build/genomeJsonCheck']
}

// Допекание встроенных геномов (снимок для превью и т.п.) тем же кодом, что свои при запуске:
// gradlew :lwjgl3:bakeBundledGenomes [-Pdir=каталог] [-PrebakeInterior]. Ненулевой код — не
// допёкся или снимок не повторился при втором выращивании. -PrebakeInterior — сначала
// пересчитать границу тела у всех файлов (см. BakeBundledGenomes.kt).
tasks.register('bakeBundledGenomes', JavaExec) {
  group = 'verification'
  description = 'Встроенные геномы допекаются, как свои при запуске игры, и снимок превью повторяется'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.verification.BakeBundledGenomesKt'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
  args = [project.findProperty('dir') ?: 'assets/genomes'] +
    (project.hasProperty('rebakeInterior') ? ['--rebake-interior'] : [])
}

// Запись и повтор бага целиком: gradlew :lwjgl3:bugReplayCheck
// Ручная проверка отправки на настоящий сервер: -PbugFile=путь/к/отчёту.bug.
tasks.register('bugUploadCheck', JavaExec) {
  group = 'verification'
  description = 'Отправляет указанный .bug на сервер тем же кодом, что кнопка игры'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.verification.BugUploadCheckKt'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
  doFirst {
    if (!project.hasProperty('bugFile')) throw new GradleException('Укажите -PbugFile=путь/к/отчёту.bug')
    args project.property('bugFile')
  }
}

// Первый запуск игры проходит сценарий через команды и собирает .bug, второй проигрывает его и
// сверяет контрольные суммы журнала и хэши состояния мира; ненулевой код — повтор разошёлся.
tasks.register('bugReplayCheckRecord', JavaExec) {
  group = 'verification'
  description = 'Сценарий игрока через команды и .bug в конце (первая половина bugReplayCheck)'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.verification.BugReplayCheckKt'
  args 'record'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
  if (project.hasProperty('hashPeriod')) systemProperty 'genomeia.stateHashPeriod', project.property('hashPeriod')
  if (project.hasProperty('workers')) systemProperty 'bugReplayCheck.workers', project.property('workers')
  if (project.hasProperty('growTicks')) systemProperty 'bugReplayCheck.growTicks', project.property('growTicks')
  if (project.hasProperty('spawnGrid')) systemProperty 'bugReplayCheck.spawnGrid', project.property('spawnGrid')
  if (project.hasProperty('spawnGenome')) systemProperty 'bugReplayCheck.spawnGenome', project.property('spawnGenome')
  if (project.hasProperty('stressTicks')) systemProperty 'bugReplayCheck.stressTicks', project.property('stressTicks')
  if (project.hasProperty('killEvery')) systemProperty 'bugReplayCheck.killEvery', project.property('killEvery')
  if (project.hasProperty('flingEvery')) systemProperty 'bugReplayCheck.flingEvery', project.property('flingEvery')
  if (project.hasProperty('spawnEvery')) systemProperty 'bugReplayCheck.spawnEvery', project.property('spawnEvery')
}

tasks.register('bugReplayCheck', JavaExec) {
  group = 'verification'
  description = 'Повтор .bug совпадает с записью: команды, контрольные суммы, хэши состояния мира'
  dependsOn 'bugReplayCheckRecord'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.verification.BugReplayCheckKt'
  args 'replay'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
  if (project.hasProperty('hashPeriod')) systemProperty 'genomeia.stateHashPeriod', project.property('hashPeriod')
  // Повтор может идти при другом числе воркеров, чем запись: -PreplayWorkers=1 — проверка,
  // что мир не зависит от числа потоков.
  if (project.hasProperty('replayWorkers')) systemProperty 'bugReplayCheck.workers', project.property('replayWorkers')
  else if (project.hasProperty('workers')) systemProperty 'bugReplayCheck.workers', project.property('workers')
  if (project.hasProperty('growTicks')) systemProperty 'bugReplayCheck.growTicks', project.property('growTicks')
  if (project.hasProperty('spawnGrid')) systemProperty 'bugReplayCheck.spawnGrid', project.property('spawnGrid')
  if (project.hasProperty('spawnGenome')) systemProperty 'bugReplayCheck.spawnGenome', project.property('spawnGenome')
  if (project.hasProperty('stressTicks')) systemProperty 'bugReplayCheck.stressTicks', project.property('stressTicks')
  if (project.hasProperty('killEvery')) systemProperty 'bugReplayCheck.killEvery', project.property('killEvery')
  if (project.hasProperty('flingEvery')) systemProperty 'bugReplayCheck.flingEvery', project.property('flingEvery')
  if (project.hasProperty('spawnEvery')) systemProperty 'bugReplayCheck.spawnEvery', project.property('spawnEvery')
}

// Снимки отладочного режима на настоящих организмах: gradlew :lwjgl3:debugViewShot
// По организму каждого запечённого генома, рост, PNG и дамп сцены на каждый (для renderLab).
//   -PshotTicks=600 -PshotZoom=0.012 -PshotDir=lwjgl3/build/debugViewShot
tasks.register('debugViewShot', JavaExec) {
  group = 'verification'
  description = 'Снимки отладочного режима: организмы из папки genomes, PNG и дамп сцены'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.verification.DebugViewShotKt'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
  if (project.hasProperty('shotTicks')) systemProperty 'debugViewShot.ticks', project.property('shotTicks')
  if (project.hasProperty('shotZoom')) systemProperty 'debugViewShot.zoom', project.property('shotZoom')
  if (project.hasProperty('shotDir')) systemProperty 'debugViewShot.dir', project.property('shotDir')
}

// Физический стенд с окном: то же тело и тот же решатель, что в collisionBench,
// но видно глазами. Сцены столкновений — клавиша N выбрать, M запустить.
//   gradlew :lwjgl3:realBodyDemo
//   gradlew :lwjgl3:realBodyDemo -Pbody=body-export-кирпич.txt
// Стенд чистой мягкой ткани: решётка 10x10 без костей и мышц, треть связей убита.
//   gradlew :lwjgl3:softGridLab
//   gradlew :lwjgl3:softGridLab -Pseed=12345
tasks.register('softGridLab', JavaExec) {
  group = 'application'
  description = 'Окно: мягкая решётка 10x10, треть связей убита, сид печатается'
  classpath = sourceSets.lab.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.demo.SoftGridLauncherKt'
  workingDir = rootProject.projectDir
  args = [project.findProperty('seed') ?: '', project.findProperty('kill') ?: '']
  jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.register('realBodyDemo', JavaExec) {
  group = 'application'
  description = 'Окно физического стенда: сцены столкновений на N/M'
  classpath = sourceSets.lab.runtimeClasspath
  mainClass = 'io.github.some_example_name.lwjgl3.demo.RealBodyDemoKt'
  workingDir = rootProject.projectDir
  // -Pplay=player-log.txt — воспроизвести журнал В ОКНЕ: тело и параметры берутся из его
  // заголовка, живой ввод не читается, итог проверки контрольных сумм виден в HUD.
  args = [project.findProperty('body') ?: 'body-export.txt', project.findProperty('play') ?: '', project.findProperty('speed') ?: '']
  jvmArgs '-Dfile.encoding=UTF-8'
  // ВЫЛЕТ НА ПРОНИКНОВЕНИИ ВКЛЮЧЁН В ОКНЕ: пока проникновение не побеждено, окно падает
  // на первой же клетке, попавшей в чужую ткань, с полным описанием места. Журнал перед
  // падением сбрасывается на диск (см. trapCrashScan), поэтому запись остаётся пригодной
  // для побитового воспроизведения.
  // Выключить: gradlew :lwjgl3:realBodyDemo -Pnocrash=1
  // Вылет на проникновении по умолчанию ВЫКЛЮЧЕН: он не даёт поставить метку на
  // проникшую клетку. Включить: -Pcrash=1
  if (project.hasProperty('crash')) environment 'RB_TRAP_CRASH', '1'
}

// Старые команды сохранены для записанных инструкций; реализация задач теперь в :physics-lab.
// Для --args используйте задачу непосредственно в :physics-lab.
[
  'physicsAudit', 'swimTune', 'solverBench', 'precisionScale', 'foldRecovery',
  'tickRate', 'physicsCheck', 'dragReplay', 'collisionBench', 'perfBench',
  'scaleBench', 'layoutBench', 'refactorCheck', 'scaleParityCheck', 'softGridBench',
  'playerReplay', 'trapHunt', 'playerLogSelfTest', 'demoWindowCheck'
].each { tool ->
  tasks.register(tool) {
    group = 'verification'
    description = "Совместимый вызов :physics-lab:${tool}"
    dependsOn(":physics-lab:${tool}")
  }
}
