// Инструменты разработчика. Обратной зависимости из :physics и :render нет.
dependencies {
  implementation project(':physics')
  implementation project(':render')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  // Шрифт с кириллицей для окна стендов (lab/stands/viewer): те же библиотеки, что у игры.
  implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
  testImplementation "junit:junit:4.13.2"
  // Те же версии, что у прежнего лаунчера: перенос не должен менять native-бэкенд.
  constraints {
    implementation "org.lwjgl:lwjgl:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-glfw:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-jemalloc:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-openal:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-opengl:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-stb:$lwjgl3Version"
  }
}

sourceSets.main.runtimeClasspath += files(rootProject.file('assets'))
tasks.withType(JavaExec).configureEach {
  environment('__GL_THREADED_OPTIMIZATIONS', '0')
  // РАСКЛАДКА КУЧИ ОДНА И ТА ЖЕ В КАЖДОМ ЗАПУСКЕ. При участке G1 по умолчанию (2 МБ при
  // -Xmx3g) массивы частиц сцены 100k ложатся то подряд, то с началом участка, и тогда у
  // px/py/prevX/... совпадают младшие 12 бит адреса: чтение после записи задерживается
  // (4K aliasing). Замер 22.10, тот же код: integrate 8.7 / 36 / 60 мс за тик в трёх
  // запусках, весь тик 255 / 298 / 319 мс. С участком 32 МБ массивы до 16 МБ ложатся
  // подряд всегда. Худший случай для проверки стадий: -PheapRegion=1m.
  jvmArgs "-XX:G1HeapRegionSize=${project.findProperty('heapRegion') ?: '32m'}"
  // Число подшагов физики: -Psubsteps=16 (см. SolverParameters.SUBSTEPS).
  if (project.hasProperty('substeps')) systemProperty 'genomeia.substeps', project.property('substeps')
  if (System.properties['os.name'].toLowerCase(Locale.ROOT).contains('mac')) {
    jvmArgs '-XstartOnFirstThread'
  }
}
// Число подшагов физики в тестах стендов — тем же свойством, что у :physics: gradlew :physics-lab:test -Psubsteps=20.
tasks.withType(Test).configureEach {
  if (project.hasProperty('substeps')) systemProperty 'genomeia.substeps', project.property('substeps')
}
// Толпа тел без мышц и сна — цель 100k клеток в 30 UPS. См. CrowdBench.kt.
//   gradlew :physics-lab:crowdBench -Pcells=100000 -Pworkers=8 -Pwarm=150 -Pmeasure=150
tasks.register('crowdBench', JavaExec) {
  group = 'verification'
  description = 'Толпа толкающихся тел: мс на тик, стадии и контрольная сумма мира'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.physics.lab.bench.CrowdBenchKt'
  workingDir = rootProject.projectDir
  // -Pgame=1 — режим «как в игре» (мышцы вперемешку), -Ppatches=1 — мышцы сплошными участками.
  args = [project.findProperty('cells') ?: '100000', project.findProperty('workers') ?: '8',
          project.findProperty('warm') ?: '150', project.findProperty('measure') ?: '150',
          project.findProperty('push') ?: '1',
          project.hasProperty('patches') ? 'patches' : (project.hasProperty('game') ? 'game' : 'crowd')]
  jvmArgs '-Xmx3g', '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
  if (project.hasProperty('jfr')) jvmArgs "-XX:StartFlightRecording=filename=${project.property('jfr')},settings=profile"
}
// Опыт «острова»: та же толпа одним миром (-Pmode=one) и по миру на тело (-Pmode=split). См. IslandBench.kt.
//   gradlew :physics-lab:islandBench -Pcells=20000 -Pworkers=8 -Pmode=split -Ppatches=1 -Psubsteps=32 -Pworld=1024
