// Инструменты разработчика. Обратной зависимости из :physics и :render нет.
dependencies {
  implementation project(':physics')
  implementation project(':render')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  testImplementation "junit:junit:4.13.2"
  // Те же версии, что у прежнего лаунчера: перенос не должен менять native-бэкенд.
  constraints {
    implementation "org.lwjgl:lwjgl:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-glfw:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-jemalloc:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-openal:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-opengl:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-stb:$lwjgl3Version"
  }
}

sourceSets.main.runtimeClasspath += files(rootProject.file('assets'))
tasks.withType(JavaExec).configureEach {
  environment('__GL_THREADED_OPTIMIZATIONS', '0')
  if (System.properties['os.name'].toLowerCase(Locale.ROOT).contains('mac')) {
    jvmArgs '-XstartOnFirstThread'
  }
}
// Стенд честности физики RealBodyDemo: gradlew :physics-lab:physicsAudit
// Считает сохранение импульса и момента по стадиям решателя и печатает таблицы.
// Опорные числа — в комментариях PhysicsAudit.kt и у констант RealBodyDemo.
tasks.register('physicsAudit', JavaExec) {
  group = 'verification'
  description = 'Проверка XPBD-решателя RealBodyDemo на сохранение импульса и момента'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.physics.lab.checks.PhysicsAuditKt'
  workingDir = rootProject.projectDir
  jvmArgs '-Dfile.encoding=UTF-8'
}

