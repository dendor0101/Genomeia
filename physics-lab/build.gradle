// Самопроверка журнала: пишет сессию без окна, воспроизводит и сверяет побитово.
// ОХОТА НА ПРОНИКНОВЕНИЕ: столкновения всем перебором, падение на каждом прорыве.
//   gradlew :physics-lab:trapHunt
//   gradlew :physics-lab:trapHunt -Pplan=quick
//   gradlew :physics-lab:trapHunt -Pcase=57
tasks.register('trapHunt', JavaExec) {
  group = 'verification'
  description = 'Stalkivaet tela i padaet na kazhdom proniknovenii kletki v chuzhuyu tkan'
  dependsOn 'classes'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.physics.lab.checks.TrapHuntKt'
  workingDir = rootProject.projectDir
  jvmArgs = ['-Xss16m']
  args = [
    project.hasProperty('plan') ? project.property('plan').toString() : '',
    project.hasProperty('case') ? project.property('case').toString() : '',
    project.hasProperty('trace') ? project.property('trace').toString() : '',
  ]
}

