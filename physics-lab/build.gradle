tasks.register('writeBenchmarkClasspath') {
  group = 'verification'
  description = 'Записывает текущий runtime classpath для A/B в отдельных JVM'
  dependsOn 'classes', ':physics:jar', ':render:jar'
  doLast {
    def target = layout.buildDirectory.file('bench/classpath.txt').get().asFile
    target.parentFile.mkdirs()
    // Gradle включает и каталоги пустых source set; JVM их игнорирует.
    // В снимок входят только существующие результаты сборки и зависимости.
    target.text = sourceSets.main.runtimeClasspath.files.findAll { it.exists() }.join(File.pathSeparator)
    println target.absolutePath
  }
}

