// Регрессионная проверка физики одной командой: gradlew :physics-lab:physicsCheck
// Возвращает ненулевой код при выходе за опорные значения — годится для CI и хуков.
tasks.register('physicsCheck', JavaExec) {
  group = 'verification'
  description = 'PASS/FAIL по законам сохранения; ненулевой код при регрессии'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'io.github.some_example_name.physics.lab.checks.PhysicsCheckKt'
  workingDir = rootProject.projectDir
  // Тело задаётся так: gradlew :physics-lab:physicsCheck -Pbody=body-export-кирпич.txt
  // Проверки одни и те же, тела разные — на кирпиче из чистой кости вылезает
  // то, чего на мягком теле не видно вовсе.
  args = [project.findProperty('body') ?: 'body-export.txt']
  jvmArgs '-Dfile.encoding=UTF-8'
}

