  workingDir = rootProject.projectDir
  args = [project.findProperty('cells') ?: '20000', project.findProperty('workers') ?: '8',
          project.findProperty('warm') ?: '100', project.findProperty('measure') ?: '200',
          project.findProperty('push') ?: '1', project.findProperty('mode') ?: 'split',
          project.hasProperty('patches') ? 'patches' : (project.hasProperty('game') ? 'game' : 'crowd'),
          project.findProperty('world') ?: '1024', project.hasProperty('bodies') ? 'bodies' : '-']
  jvmArgs '-Xmx3g', '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
