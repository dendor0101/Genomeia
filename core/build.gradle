[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  // api, а не implementation: платформенные модули (lwjgl3, android, teavm, ios-moe)
  // должны видеть типы рендера транзитивно, иначе каждому пришлось бы прописывать
  // зависимость самому. Направление строго одностороннее — :render о :core не знает.
  api project(':render')
  // Физика-библиотека: чистый Kotlin/JDK, о :core не знает (мост — пакет physics/bridge).
  implementation project(':physics')
  api "com.kotcrab.vis:vis-ui:$visUiVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
  implementation "it.unimi.dsi:fastutil:8.5.16"
//  implementation "com.kotcrab.vis:vis-ui:1.5.3"
  implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  implementation("org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0")
  implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"
  implementation "games.spooky.gdx:gdx-nativefilechooser:2.4.0"
  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlinVersion"
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlinVersion"
  testImplementation "junit:junit:4.13.2"
}

// Тесты :core гоняются без Gdx: в них нельзя трогать DIGenomeEditorContainer,
// DIGameGlobalContainer и прочие object-контейнеры — их инициализация тянет OpenGL.
// Команды редактора от этого свободны: это чистые функции над списком стадий.
test {
  useJUnit()
  testLogging { events "passed", "skipped", "failed" }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
