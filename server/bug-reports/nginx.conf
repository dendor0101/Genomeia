limit_req_zone $binary_remote_addr zone=genomeia_upload:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=genomeia_connections:1m;

server {
    listen 80;
    server_name 199.189.252.141;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://199.189.252.141$request_uri; }
}

server {
    listen 443 ssl;
    server_name 199.189.252.141;
    ssl_certificate /etc/letsencrypt/live/199.189.252.141/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/199.189.252.141/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 101m;
    client_body_timeout 120s;
    limit_conn genomeia_connections 8;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;

    location = /upload {
        limit_except POST { deny all; }
        limit_req zone=genomeia_upload burst=3 nodelay;
        # Gunicorn разбирает multipart по мере поступления, без ещё одной копии в nginx.
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /reports {
        auth_basic "Genomeia reports";
        auth_basic_user_file /etc/nginx/genomeia.htpasswd;
        proxy_pass http://127.0.0.1:8000;
    }
    location ^~ /reports/ {
        auth_basic "Genomeia reports";
        auth_basic_user_file /etc/nginx/genomeia.htpasswd;
        proxy_pass http://127.0.0.1:8000;
    }
    location = / { proxy_pass http://127.0.0.1:8000; }
    location = /api/status { proxy_pass http://127.0.0.1:8000; }
    location / { return 404; }
}
